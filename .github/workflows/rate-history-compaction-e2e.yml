name: Rate history compaction production-copy E2E

on:
  push:
    branches:
      - "feat/strategy-main-runtime-e2e-*"
      - "fix/db-history-*"
    paths:
      - "scripts/rate_history_audit.py"
      - "scripts/rate_history_compact.py"
      - "src/rate_monitor/services/collection_service.py"
      - "tests/test_rate_change_semantics.py"
      - "tests/test_rate_history_audit.py"
      - "tests/test_rate_history_compact.py"
      - ".github/workflows/rate-history-compaction-e2e.yml"
  pull_request:
    paths:
      - "scripts/rate_history_audit.py"
      - "scripts/rate_history_compact.py"
      - "src/rate_monitor/services/collection_service.py"
      - "tests/test_rate_change_semantics.py"
      - "tests/test_rate_history_audit.py"
      - "tests/test_rate_history_compact.py"
      - ".github/workflows/rate-history-compaction-e2e.yml"
  workflow_dispatch:

concurrency:
  group: rate-history-compaction-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compact-production-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Targeted compaction tests
        run: |
          set -euo pipefail
          uv run ruff check \
            scripts/rate_history_audit.py \
            scripts/rate_history_compact.py \
            tests/test_rate_change_semantics.py \
            tests/test_rate_history_audit.py \
            tests/test_rate_history_compact.py
          uv run pytest -q \
            tests/test_rate_change_semantics.py \
            tests/test_rate_history_audit.py \
            tests/test_rate_history_compact.py

      - name: Restore authoritative R2 into runner-local copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          date +%s > work/restore-start.txt
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          date +%s > work/restore-end.txt
          test -s work/rate_monitor.sqlite3
          stat -c 'source_bytes=%s' work/rate_monitor.sqlite3 | tee work/source-size.txt
          df -h . | tee work/disk-before-compaction.txt

      - name: Apply migrations to local copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Dry-run production compaction plan
        run: |
          set -euo pipefail
          date +%s > work/dry-run-start.txt
          uv run python scripts/rate_history_compact.py \
            --db work/rate_monitor.sqlite3 \
            --output work/rate-history-compaction-dry-run.json
          date +%s > work/dry-run-end.txt

      - name: Fail closed on referenced deletion candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("work/rate-history-compaction-dry-run.json").read_text(encoding="utf-8")
          )
          print("candidate_rows=", report["candidate_rows"])
          print("candidate_groups=", report["candidate_groups"])
          print("estimated_rows_after=", report["estimated_rate_observations_after"])
          print("candidate_rows_by_source=", report["candidate_rows_by_source"])
          print("reference_blockers=", report["reference_blockers"])
          assert report["candidate_rows"] > 0, report
          assert not report["reference_blockers"], report["reference_blockers"]
          PY

      - name: Compact local copy and VACUUM INTO separate candidate
        run: |
          set -euo pipefail
          date +%s > work/apply-start.txt
          uv run python scripts/rate_history_compact.py \
            --db work/rate_monitor.sqlite3 \
            --apply \
            --vacuum-into work/rate_monitor_compacted.sqlite3 \
            --output work/rate-history-compaction-apply.json
          date +%s > work/apply-end.txt
          test -s work/rate_monitor_compacted.sqlite3
          stat -c 'compacted_bytes=%s' work/rate_monitor_compacted.sqlite3 \
            | tee work/compacted-size.txt
          df -h . | tee work/disk-after-compaction.txt

      - name: Validate compacted candidate
        run: |
          set -euo pipefail
          uv run rate-monitor validate --db work/rate_monitor_compacted.sqlite3 \
            | tee work/compacted-validate.txt
          uv run python scripts/rate_history_audit.py \
            --db work/rate_monitor_compacted.sqlite3 \
            --output work/rate-history-compacted-audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          apply = json.loads(
              Path("work/rate-history-compaction-apply.json").read_text(encoding="utf-8")
          )
          audit = json.loads(
              Path("work/rate-history-compacted-audit.json").read_text(encoding="utf-8")
          )
          assert audit["rate_observations"] == apply["after_rate_observations"], (audit, apply)
          assert audit["semantic_redundant_rows"] == 0, audit
          assert apply["integrity_check"] == "ok", apply
          assert apply["foreign_key_errors"] == 0, apply
          assert apply["after_current_observations"] == apply["before_current_observations"], apply
          print("before_bytes=", apply["before_file_bytes"])
          print("after_bytes=", apply["after_file_bytes"])
          print("bytes_reclaimed=", apply["bytes_reclaimed"])
          print("size_ratio=", apply["size_ratio"])
          print("before_rows=", apply["before_rate_observations"])
          print("after_rows=", apply["after_rate_observations"])
          PY

      - name: Record timings
        if: always()
        run: |
          python - <<'PY' | tee work/rate-history-compaction-timing.txt
          from pathlib import Path

          def elapsed(name):
              start = Path(f"work/{name}-start.txt")
              end = Path(f"work/{name}-end.txt")
              if start.exists() and end.exists():
                  return int(end.read_text()) - int(start.read_text())
              return None

          for phase in ("restore", "dry-run", "apply"):
              print(f"{phase}_seconds={elapsed(phase)}")
          PY

      - name: Upload compaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-history-compaction-e2e-${{ github.run_id }}
          path: |
            work/rate-history-compaction-dry-run.json
            work/rate-history-compaction-apply.json
            work/rate-history-compacted-audit.json
            work/rate-history-compaction-timing.txt
            work/source-size.txt
            work/compacted-size.txt
            work/compacted-validate.txt
            work/disk-before-compaction.txt
            work/disk-after-compaction.txt
          retention-days: 30
          if-no-files-found: warn
