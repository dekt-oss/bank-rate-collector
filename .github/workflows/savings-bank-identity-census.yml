name: Savings bank identity census

on:
  push:
    branches:
      - "chore/savings-bank-identity-census-*"
    paths:
      - "scripts/savings_bank_identity_census.py"
      - "tests/test_savings_bank_identity_census.py"
      - ".github/workflows/savings-bank-identity-census.yml"
  workflow_dispatch:

# Read-only production-data diagnostic. The authoritative database is restored
# into a runner-local file; this workflow never uploads or writes that DB back.
permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Validate census code
        run: |
          set -euo pipefail
          uv run ruff check \
            scripts/savings_bank_identity_census.py \
            tests/test_savings_bank_identity_census.py
          uv run pytest -q tests/test_savings_bank_identity_census.py

      - name: Restore current production database into runner-local copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          print(load_backend(Path('config/storage.yaml')).backend.value)
          ")
          echo "identity census source backend=$BACKEND"

          if [ "$BACKEND" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          else
            git fetch --force origin \
              +rate-data:refs/remotes/origin/rate-data --depth=1
            git show refs/remotes/origin/rate-data:latest/rate_monitor.sqlite3.gz \
              > work/rate_monitor.sqlite3.gz
            gunzip work/rate_monitor.sqlite3.gz
          fi

          test -s work/rate_monitor.sqlite3
          echo "restored bytes=$(stat -c%s work/rate_monitor.sqlite3)"

      - name: Apply migrations to runner-local copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Record local DB hash before census
        run: sha256sum work/rate_monitor.sqlite3 | tee work/db-before.sha256

      - name: Run read-only identity census
        run: |
          set -euo pipefail
          uv run python scripts/savings_bank_identity_census.py \
            --db work/rate_monitor.sqlite3 \
            --out-json work/savings-bank-identity-census.json \
            --out-md work/savings-bank-identity-census.md

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("work/savings-bank-identity-census.json").read_text())
          assert data["write_back_performed"] is False, data
          assert data["source_population"] > 0, data
          assert data["observation_mapped_count"] + data["observation_unmapped_count"] == data["source_population"], data
          assert data["observation_unmapped_count"] == len(data["rows"]), data
          print(
              "census summary",
              "month=", data["latest_source_effective_month"],
              "population=", data["source_population"],
              "mapped=", data["observation_mapped_count"],
              "unmapped=", data["observation_unmapped_count"],
              "classifications=", data["classification_counts"],
          )
          PY

      - name: Prove census did not mutate runner-local DB
        run: |
          set -euo pipefail
          sha256sum work/rate_monitor.sqlite3 | tee work/db-after.sha256
          BEFORE=$(cut -d' ' -f1 work/db-before.sha256)
          AFTER=$(cut -d' ' -f1 work/db-after.sha256)
          test "$BEFORE" = "$AFTER"
          echo "read-only DB hash verified=$AFTER"

      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: savings-bank-identity-census-${{ github.run_id }}
          path: |
            work/savings-bank-identity-census.json
            work/savings-bank-identity-census.md
            work/db-before.sha256
            work/db-after.sha256
          retention-days: 30
          if-no-files-found: error
