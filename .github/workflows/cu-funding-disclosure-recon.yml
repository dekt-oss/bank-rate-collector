name: Diagnostic — CU funding disclosure recon

on:
  workflow_dispatch:
  push:
    branches:
      - recon/cu-funding-disclosure-20260829
    paths:
      - scripts/cu_funding_disclosure_recon.py
      - .github/workflows/cu-funding-disclosure-recon.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked
      - name: Probe official CU central disclosure contract
        run: uv run python scripts/cu_funding_disclosure_recon.py
      - name: Upload structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cu-funding-disclosure-recon
          path: docs/source-recon/cu-funding-disclosure-recon-20260829.json
          if-no-files-found: error
          retention-days: 14
