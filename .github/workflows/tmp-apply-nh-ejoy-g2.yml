name: Temporary apply NH e-joy G2

on:
  push:
    branches: ["feat/nh-local-ejoy-max-rate-g2"]
    paths:
      - "scripts/tmp_apply_nh_ejoy_g2.py"
      - ".github/workflows/tmp-apply-nh-ejoy-g2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nh-local-ejoy-max-rate-g2
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/tmp_apply_nh_ejoy_g2.py
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rate_monitor/collectors/nh_local/parser.py src/rate_monitor/collectors/nh_local/adapter.py
          git diff --cached --check
          git commit -m "feat: NH e-joy 인터넷 최고금리 variant 연결"
          git push origin HEAD:feat/nh-local-ejoy-max-rate-g2
