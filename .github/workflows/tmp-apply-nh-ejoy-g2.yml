name: Temporary clean NH e-joy G2 harness

on:
  push:
    branches: ["feat/nh-local-ejoy-max-rate-g2"]
    paths:
      - ".github/workflows/tmp-apply-nh-ejoy-g2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nh-local-ejoy-max-rate-g2
          fetch-depth: 0
      - name: Fix lint contract and remove temporary harness
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/rate_monitor/collectors/nh_local/parser.py")
          text = path.read_text(encoding="utf-8")
          old = "zip(ordered, ordered[1:])"
          if text.count(old) != 1:
              raise SystemExit(f"expected one ordered zip, got {text.count(old)}")
          text = text.replace(old, "zip(ordered, ordered[1:], strict=False)")
          old = "zip(options, options[1:])"
          if text.count(old) != 1:
              raise SystemExit(f"expected one options zip, got {text.count(old)}")
          text = text.replace(old, "zip(options, options[1:], strict=False)")
          path.write_text(text, encoding="utf-8")
          PY
          rm scripts/tmp_apply_nh_ejoy_g2.py
          rm .github/workflows/tmp-apply-nh-ejoy-g2.yml
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: NH e-joy G2 lint 계약 정리"
          git push origin HEAD:feat/nh-local-ejoy-max-rate-g2
