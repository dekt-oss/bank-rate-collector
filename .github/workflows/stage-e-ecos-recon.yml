name: Diagnostic — Stage E ECOS external indicators

on:
  workflow_dispatch:
  push:
    branches:
      - "recon/stage-e-external-indicators-*"
    paths:
      - "scripts/stage_e_ecos_external_recon.py"
      - ".github/workflows/stage-e-ecos-recon.yml"

# Read-only source-contract evidence. No DB restore, no collector execution,
# no rate-data writes and no production publication.
permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Probe ECOS by names only
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: uv run python scripts/stage_e_ecos_external_recon.py

      - name: Verify no code was selected automatically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("work/stage-e-ecos-external-recon.json").read_text(encoding="utf-8"))
          assert report["mode"] == "read_only_recon"
          assert report["selected_stat_codes"] == []
          assert report["selected_item_codes"] == []
          assert report["selection_status"] == "not_selected_until_human_evidence_review"
          print("automatic code selection: 0")
          PY

      - name: Check API key never reached artifact
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          if grep -qF "$ECOS_API_KEY" work/stage-e-ecos-external-recon.json; then
            echo "ECOS key leaked into recon artifact"
            exit 1
          fi
          echo "ECOS key exposure: 0"

      - uses: actions/upload-artifact@v4
        with:
          name: stage-e-ecos-external-recon
          path: work/stage-e-ecos-external-recon.json
          retention-days: 7
