name: Temporary phase3 legacy test update

on:
  push:
    branches: ["feat/search-ux-phase3-closure-20260824"]
    paths:
      - "scripts/tmp_update_phase3_legacy_test.py"
      - ".github/workflows/tmp-update-phase3-legacy-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy preset contract
        run: python scripts/tmp_update_phase3_legacy_test.py
      - name: Commit updated contract
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_site_ui_v4.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test: update preset count contract"
          git push
