name: P0 KFCC capture

on:
  workflow_dispatch:
    inputs:
      sido:
        description: "시도"
        required: false
        default: "부산"
      sigungu:
        description: "시군구"
        required: false
        default: "중구"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture KFCC official HTML
        run: python scripts/p0_kfcc_capture.py "${{ inputs.sido }}" "${{ inputs.sigungu }}"
      - name: Upload raw HTML, fixtures and recon report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-kfcc-capture
          path: |
            data/raw/p0/kfcc/
            tests/fixtures/kfcc/
            docs/source-recon/kfcc-capture.json
          if-no-files-found: ignore
