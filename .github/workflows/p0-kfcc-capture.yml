name: Diagnostic — KFCC source capture

# Manual recovery/source-contract probe. This is not part of the scheduled
# collection pipeline. Keep it available so a KFCC HTML/schema change can be
# captured with the same evidence path used to build the parser.
on:
  workflow_dispatch:
    inputs:
      sido:
        description: "시도"
        required: false
        default: "부산"
      sigungu:
        description: "시군구"
        required: false
        default: "중구"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture KFCC official HTML
        run: python scripts/p0_kfcc_capture.py "${{ inputs.sido }}" "${{ inputs.sigungu }}"
      - name: Upload raw HTML, fixtures and recon report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-kfcc-capture
          path: |
            data/raw/p0/kfcc/
            tests/fixtures/kfcc/
            docs/source-recon/kfcc-capture.json
          retention-days: 7
          if-no-files-found: ignore
