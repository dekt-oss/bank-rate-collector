name: Size Peer CU Total Assets Evidence

on:
  push:
    branches:
      - "feat/size-peer-cu-total-assets-evidence-*"
    paths:
      - ".github/workflows/size-peer-cu-total-assets-evidence.yml"
      - "src/rate_monitor/collectors/cu/total_assets_evidence.py"
      - "src/rate_monitor/collectors/cu/funding.py"
      - "tests/test_cu_total_assets_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: size-peer-cu-total-assets-evidence
  cancel-in-progress: false

jobs:
  bounded-live-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Targeted lint and tests
        run: |
          set -euo pipefail
          uv run ruff check src/rate_monitor/collectors/cu/total_assets_evidence.py tests/test_cu_total_assets_evidence.py
          uv run pytest -q tests/test_cu_total_assets_evidence.py tests/test_cu_funding.py tests/test_cu_funding_year_format.py

      - name: Restore production database into runner-local read-only candidate
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work publish work/cu-size-peer-raw
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          test -s work/rate_monitor.sqlite3

      - name: Apply migrations to runner-local candidate
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Inspect exact CU identity census
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          conn = sqlite3.connect("work/rate_monitor.sqlite3")
          conn.row_factory = sqlite3.Row
          active_targets = conn.execute(
              "SELECT COUNT(*) AS n FROM source_entity_links "
              "WHERE source_id='cu' AND entity_type='institution' "
              "AND source_entity_key LIKE 'cu:%' AND valid_to IS NULL"
          ).fetchone()["n"]
          duplicate_keys = conn.execute(
              "SELECT COUNT(*) AS n FROM ("
              "SELECT source_entity_key FROM source_entity_links "
              "WHERE source_id='cu' AND entity_type='institution' "
              "AND source_entity_key LIKE 'cu:%' AND valid_to IS NULL "
              "GROUP BY source_entity_key HAVING COUNT(*) > 1)"
          ).fetchone()["n"]
          payload = {
              "active_cu_targets": active_targets,
              "duplicate_active_cu_keys": duplicate_keys,
              "production_write": False,
          }
          Path("publish/cu-size-peer-census.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False))
          assert active_targets >= 800
          assert duplicate_keys == 0
          PY

      - name: Probe official CU same-disclosure size pairs
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from rate_monitor.collectors.cu.total_assets_evidence import (
              collect_cu_size_pair_evidence,
          )

          controls = {"02002", "02022", "03087", "10154"}
          result = collect_cu_size_pair_evidence(
              db_path=Path("work/rate_monitor.sqlite3"),
              periods=1,
              only_cu_nos=controls,
              request_interval=0.2,
              raw_root=Path("work/cu-size-peer-raw"),
          )
          pairs = [
              {
                  "institution_id": pair.institution_id,
                  "cu_ingno": pair.cu_ingno,
                  "institution_name": pair.institution_name,
                  "source_effective_month": pair.source_effective_month,
                  "disclosure_no": pair.disclosure_no,
                  "disclosure_type": pair.disclosure_type,
                  "deposit_liabilities_total": str(pair.deposit_liabilities_total),
                  "total_assets": str(pair.total_assets),
                  "unit": "million_krw",
                  "source_locator": pair.source_locator,
                  "raw_sha256": pair.raw_sha256,
              }
              for pair in result.pairs
          ]
          payload = {
              "status": result.status,
              "target_count": result.target_count,
              "completed_targets": result.completed_targets,
              "failed_targets": list(result.failed_targets),
              "pair_count": len(pairs),
              "warning_count": result.warning_count,
              "message": result.message,
              "pairs": pairs,
              "production_write": False,
          }
          Path("publish/cu-size-peer-pairs.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False))
          assert result.status == "success", payload
          assert result.target_count == len(controls), payload
          assert result.completed_targets == len(controls), payload
          assert not result.failed_targets, payload
          assert len(pairs) == len(controls), payload
          assert {row["cu_ingno"] for row in pairs} == controls, payload
          for row in pairs:
              assert float(row["deposit_liabilities_total"]) >= 0, row
              assert float(row["total_assets"]) > 0, row
              assert len(row["raw_sha256"]) == 64, row
          PY

      - name: Verify database remained unchanged by evidence probe
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          conn = sqlite3.connect("work/rate_monitor.sqlite3")
          total_assets = conn.execute(
              "SELECT COUNT(*) FROM institution_funding_observations "
              "WHERE source_id='cu_disclosure_funding' "
              "AND metric_code='total_assets'"
          ).fetchone()[0]
          integrity = conn.execute("PRAGMA integrity_check").fetchone()[0]
          fk = conn.execute("PRAGMA foreign_key_check").fetchall()
          payload = {
              "cu_disclosure_total_assets_rows": total_assets,
              "integrity_check": integrity,
              "foreign_key_violations": len(fk),
              "production_write": False,
          }
          Path("publish/cu-size-peer-db-readback.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False))
          assert integrity == "ok"
          assert not fk
          PY

      - name: Explicit no-publish gate
        run: |
          set -euo pipefail
          echo "Read-only evidence only: this workflow never calls rate-monitor storage upload."
          echo "Canonical R2 state/current.json is unchanged."

      - name: Upload CU total-assets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-peer-cu-total-assets-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            publish/cu-size-peer-census.json
            publish/cu-size-peer-pairs.json
            publish/cu-size-peer-db-readback.json
            work/cu-size-peer-raw/*
