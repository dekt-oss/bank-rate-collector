name: Probe — Data.go 예수부채 필터

on:
  push:
    branches: [feat/market-funding-ops-finalize-20260828]

permissions:
  contents: read

jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, '[funding-filter]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Compare account filters
        env:
          DATA_GO_KR_SERVICE_KEY_SB: ${{ secrets.DATA_GO_KR_SERVICE_KEY_SB }}
          DATA_GO_KR_SERVICE_KEY_NH: ${{ secrets.DATA_GO_KR_SERVICE_KEY_NH }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: uv run python scripts/probe_data_go_account_filter.py
