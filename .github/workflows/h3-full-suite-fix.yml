name: H3 Full Suite Fix

on:
  push:
    branches:
      - feat/strategy-dashboard-mutual-finance-h3
    paths:
      - .github/h3_full_suite_fix.py
      - .github/workflows/h3-full-suite-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply full-suite fixes
        run: python .github/h3_full_suite_fix.py
      - name: Verify inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/templates/strategy.html').read_text(encoding='utf-8')
          marker = '<script id="rate-monitor-data" type="application/json"></script>'
          data_end = html.index(marker) + len(marker)
          script_start = html.index('<script>', data_end) + len('<script>')
          script_end = html.index('</script>', script_start)
          Path('/tmp/strategy-h3.js').write_text(html[script_start:script_end], encoding='utf-8')
          PY
          node --check /tmp/strategy-h3.js
      - name: Run targeted affected tests
        run: |
          pip install uv
          uv sync --locked
          uv run pytest -q tests/test_strategy_dashboard_ui_contract.py tests/test_strategy_stage_e_ux.py tests/test_strategy_mutual_finance_h3.py
      - name: Remove one-off full-suite harness
        run: rm .github/h3_full_suite_fix.py .github/workflows/h3-full-suite-fix.yml
      - name: Commit full-suite fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: H3 접근성 폰트와 부산 레이어 계약 정리"
          git push origin HEAD:feat/strategy-dashboard-mutual-finance-h3
