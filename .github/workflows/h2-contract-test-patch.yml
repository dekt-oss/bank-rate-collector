name: H2 Contract Test Patch

on:
  push:
    branches:
      - feat/strategy-dashboard-mutual-finance-h2
    paths:
      - scripts/patch_h2_contract_tests.py
      - .github/workflows/h2-contract-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update legacy H2 contract tests
        run: python scripts/patch_h2_contract_tests.py
      - name: Verify test source
        run: |
          python -m compileall -q tests
          python -m pip install ruff
          ruff check tests/test_strategy_contract_service.py tests/test_strategy_dashboard.py tests/test_strategy_dashboard_refinement.py tests/test_strategy_dashboard_ui_contract.py tests/test_strategy_stage_e_ux.py tests/test_strategy_mutual_finance_h2.py
      - name: Remove one-off patch harness
        run: rm scripts/patch_h2_contract_tests.py .github/workflows/h2-contract-test-patch.yml
      - name: Commit updated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: H2 상호금융 계약으로 기존 검증 갱신"
          git push origin HEAD:feat/strategy-dashboard-mutual-finance-h2
