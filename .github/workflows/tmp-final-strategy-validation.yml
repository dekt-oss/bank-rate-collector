name: Temporary final Strategy validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write
  actions: write

jobs:
  validate-final-head:
    if: github.head_ref == 'feat/strategy-dashboard-collected-max-rate' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/strategy-dashboard-collected-max-rate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-dashboard-collected-max-rate
          fetch-depth: 0

      - name: Remove temporary harness and create final head
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-final-strategy-validation.yml
          git commit -m "chore: PR126 최종 검증 harness 제거"
          git push origin HEAD:"$TARGET_BRANCH"
          FINAL_SHA=$(git rev-parse HEAD)
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "final sha=$FINAL_SHA"

      - name: Dispatch exact-head Strategy Preview
        run: |
          set -euo pipefail
          gh workflow run strategy-preview.yml --ref "$TARGET_BRANCH"
          PREVIEW_ID=""
          for i in $(seq 1 30); do
            PREVIEW_ID=$(gh run list \
              --workflow strategy-preview.yml \
              --branch "$TARGET_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$FINAL_SHA\") | .databaseId" \
              | head -n1)
            [ -n "$PREVIEW_ID" ] && break
            sleep 2
          done
          test -n "$PREVIEW_ID"
          echo "PREVIEW_ID=$PREVIEW_ID" >> "$GITHUB_ENV"
          echo "preview run=$PREVIEW_ID sha=$FINAL_SHA"
          gh run watch "$PREVIEW_ID" --exit-status

      - name: Verify exact preview source stamp
        run: |
          set -euo pipefail
          git fetch --force origin \
            +preview/strategy-dashboard:refs/remotes/origin/preview/strategy-dashboard \
            --depth=1
          SOURCE_SHA=$(git show refs/remotes/origin/preview/strategy-dashboard:site-public/preview-source.json \
            | python -c 'import json,sys; print(json.load(sys.stdin)["source_sha"])')
          echo "preview source sha=$SOURCE_SHA expected=$FINAL_SHA"
          test "$SOURCE_SHA" = "$FINAL_SHA"

      - name: Dispatch exact-head Chrome smoke
        run: |
          set -euo pipefail
          gh workflow run strategy-browser-smoke.yml --ref "$TARGET_BRANCH"
          SMOKE_ID=""
          for i in $(seq 1 30); do
            SMOKE_ID=$(gh run list \
              --workflow strategy-browser-smoke.yml \
              --branch "$TARGET_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$FINAL_SHA\") | .databaseId" \
              | head -n1)
            [ -n "$SMOKE_ID" ] && break
            sleep 2
          done
          test -n "$SMOKE_ID"
          echo "SMOKE_ID=$SMOKE_ID" >> "$GITHUB_ENV"
          echo "browser smoke run=$SMOKE_ID sha=$FINAL_SHA"
          gh run watch "$SMOKE_ID" --exit-status

      - name: Report exact-head evidence
        run: |
          echo "FINAL_SHA=$FINAL_SHA"
          echo "PREVIEW_ID=$PREVIEW_ID"
          echo "SMOKE_ID=$SMOKE_ID"
