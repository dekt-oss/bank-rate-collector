name: Stage B one-time template rewrite

on:
  push:
    branches: ["feat/strategy-dashboard-v2-slice"]
    paths:
      - ".github/workflows/stage-b-template-rewrite.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Rewrite aggregate cache contract
        run: python scripts/stage_b_template_rewrite.py

      - name: Commit rewrite and remove one-time helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/stage-b-template-rewrite.yml scripts/stage_b_template_rewrite.py
          git add web/templates/strategy.html
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "perf: 전략 상품 집계 결과 캐시"
          git push origin "HEAD:${GITHUB_REF_NAME}"
