name: Verify NH operator fresh workflow

on:
  push:
    branches:
      - agent/nh-resumable-acquisition-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nh-resumable-acquisition-v1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Apply and verify
        run: |
          python .github/dev/pr86_operator_fresh.py
          uv sync --locked
          uv run ruff check src tests scripts
          uv run pytest -q
          RATE_MONITOR_DB_URL=sqlite+pysqlite:///${{ runner.temp }}/nh-operator-fresh.sqlite3 uv run alembic upgrade head
      - name: Create final commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-pr86-operator-fresh.yml .github/dev/pr86_operator_fresh.py
          git add -A
          git commit -m "fix: expose NH same-day fresh recovery mode"
          FINAL_COMMIT=$(git rev-parse HEAD)
          echo "FINAL_COMMIT=$FINAL_COMMIT"
          git push origin HEAD:agent/nh-resumable-acquisition-v1 || true
