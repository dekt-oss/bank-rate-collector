name: Format source discrepancy review patch

on:
  push:
    branches: ["feat/source-discrepancy-postmerge-review-hardening-20260824"]
    paths:
      - ".github/workflows/postmerge-source-format.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-discrepancy-postmerge-review-hardening-20260824
          fetch-depth: 0
      - name: Wrap service calls and remove helper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/rate_monitor/services/source_discrepancy_service.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '                key, candidates, side="primary", as_of=generated_at, counterpart=secondary.get(key)\n',
              '                key,\n                candidates,\n                side="primary",\n                as_of=generated_at,\n                counterpart=secondary.get(key),\n',
              1,
          )
          text = text.replace(
              '                key, candidates, side="secondary", as_of=generated_at, counterpart=primary.get(key)\n',
              '                key,\n                candidates,\n                side="secondary",\n                as_of=generated_at,\n                counterpart=primary.get(key),\n',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/postmerge-source-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rate_monitor/services/source_discrepancy_service.py
          git commit -m "style: wrap source discrepancy review calls"
          git push origin HEAD:feat/source-discrepancy-postmerge-review-hardening-20260824
