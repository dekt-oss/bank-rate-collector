name: Temporary phase3 preset refresh fix

on:
  push:
    branches: ["feat/search-ux-phase3-closure-20260824"]
    paths:
      - "scripts/tmp_fix_phase3_preset_refresh.py"
      - ".github/workflows/tmp-fix-phase3-preset-refresh.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tmp_fix_phase3_preset_refresh.py
      - name: Commit product fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/templates/site.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh preset state after scalar edits"
          git push
