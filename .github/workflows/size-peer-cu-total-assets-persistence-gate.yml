name: Size Peer CU Total Assets Persistence Gate

on:
  push:
    branches:
      - "feat/size-peer-cu-total-assets-persistence-gate-*"
    paths:
      - ".github/workflows/size-peer-cu-total-assets-persistence-gate.yml"
      - "src/rate_monitor/collectors/cu/total_assets_evidence.py"
      - "src/rate_monitor/collectors/cu/total_assets_persistence.py"
      - "src/rate_monitor/collectors/cu/funding.py"
      - "tests/test_cu_total_assets_persistence.py"
      - "tests/test_cu_total_assets_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: size-peer-cu-total-assets-persistence-gate
  cancel-in-progress: false

jobs:
  bounded-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Targeted lint and tests
        run: |
          set -euo pipefail
          uv run ruff check \
            src/rate_monitor/collectors/cu/total_assets_persistence.py \
            tests/test_cu_total_assets_persistence.py
          uv run pytest -q \
            tests/test_cu_total_assets_persistence.py \
            tests/test_cu_total_assets_evidence.py \
            tests/test_cu_funding.py \
            tests/test_cu_funding_year_format.py

      - name: Restore production database into runner-local candidate
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work publish data/raw work/cu-size-peer-raw
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          test -s work/rate_monitor.sqlite3

      - name: Apply migrations to runner-local candidate
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Seal existing CU funding observations
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          conn = sqlite3.connect("work/rate_monitor.sqlite3")
          conn.row_factory = sqlite3.Row
          rows = conn.execute(
              "SELECT * FROM institution_funding_observations "
              "WHERE source_id='cu_disclosure_funding' "
              "AND metric_code='deposit_liabilities_total' ORDER BY id"
          ).fetchall()
          encoded = json.dumps(
              [dict(row) for row in rows], default=str, sort_keys=True
          ).encode()
          payload = {
              "rows": len(rows),
              "sha256": hashlib.sha256(encoded).hexdigest(),
          }
          Path("publish/cu-funding-before-assets.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          print(payload)
          assert payload["rows"] > 0
          PY

      - name: Collect and persist bounded same-disclosure controls twice
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from rate_monitor.collectors.cu.total_assets_evidence import (
              collect_cu_size_pair_evidence,
          )
          from rate_monitor.collectors.cu.total_assets_persistence import (
              persist_cu_total_assets_pairs,
          )

          controls = {"02002", "02022", "03087", "10154"}
          evidence = collect_cu_size_pair_evidence(
              db_path=Path("work/rate_monitor.sqlite3"),
              periods=1,
              only_cu_nos=controls,
              request_interval=0.2,
              raw_root=Path("work/cu-size-peer-raw"),
          )
          assert evidence.status == "success", evidence
          assert evidence.completed_targets == len(controls), evidence
          assert not evidence.failed_targets, evidence
          assert len(evidence.pairs) == len(controls), evidence

          first = persist_cu_total_assets_pairs(
              db_path=Path("work/rate_monitor.sqlite3"),
              evidence_raw_root=Path("work/cu-size-peer-raw"),
              artifact_root=Path("data/raw"),
              pairs=evidence.pairs,
          )
          second = persist_cu_total_assets_pairs(
              db_path=Path("work/rate_monitor.sqlite3"),
              evidence_raw_root=Path("work/cu-size-peer-raw"),
              artifact_root=Path("data/raw"),
              pairs=evidence.pairs,
          )
          payload = {
              "evidence_status": evidence.status,
              "target_count": evidence.target_count,
              "completed_targets": evidence.completed_targets,
              "failed_targets": list(evidence.failed_targets),
              "warning_count": evidence.warning_count,
              "pairs": [
                  {
                      "cu_ingno": pair.cu_ingno,
                      "institution_id": pair.institution_id,
                      "institution_name": pair.institution_name,
                      "source_effective_month": pair.source_effective_month,
                      "disclosure_no": pair.disclosure_no,
                      "deposit_liabilities_total": str(pair.deposit_liabilities_total),
                      "total_assets": str(pair.total_assets),
                      "raw_sha256": pair.raw_sha256,
                  }
                  for pair in evidence.pairs
              ],
              "first": {
                  "status": first.status,
                  "stored": first.stored,
                  "revisions": first.revisions,
                  "unchanged": first.unchanged,
              },
              "second": {
                  "status": second.status,
                  "stored": second.stored,
                  "revisions": second.revisions,
                  "unchanged": second.unchanged,
              },
              "production_write": False,
          }
          Path("publish/cu-total-assets-persistence.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False))
          assert first.status == "success"
          assert first.stored + first.unchanged == len(controls)
          assert first.revisions == 0
          assert second.status == "success"
          assert second.stored == 0
          assert second.revisions == 0
          assert second.unchanged == len(controls)
          PY

      - name: Verify funding isolation, pair completeness and provenance
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          controls = {"02002", "02022", "03087", "10154"}
          conn = sqlite3.connect("work/rate_monitor.sqlite3")
          conn.row_factory = sqlite3.Row
          before = json.loads(
              Path("publish/cu-funding-before-assets.json").read_text(encoding="utf-8")
          )
          funding = conn.execute(
              "SELECT * FROM institution_funding_observations "
              "WHERE source_id='cu_disclosure_funding' "
              "AND metric_code='deposit_liabilities_total' ORDER BY id"
          ).fetchall()
          encoded = json.dumps(
              [dict(row) for row in funding], default=str, sort_keys=True
          ).encode()
          assert len(funding) == before["rows"]
          assert hashlib.sha256(encoded).hexdigest() == before["sha256"]

          placeholders = ",".join("?" for _ in controls)
          assets = conn.execute(
              "SELECT o.*, r.sha256 AS raw_sha256 FROM institution_funding_observations o "
              "LEFT JOIN raw_artifacts r ON r.id=o.raw_artifact_id "
              "WHERE o.source_id='cu_disclosure_funding' "
              "AND o.metric_code='total_assets' AND o.valid_to IS NULL "
              f"AND o.source_institution_key IN ({placeholders}) "
              "ORDER BY o.source_institution_key",
              tuple(sorted(controls)),
          ).fetchall()
          assert len(assets) == len(controls), [dict(row) for row in assets]
          for row in assets:
              assert row["institution_id"], dict(row)
              assert row["identity_status"] == "mapped_exact_cu_ingno", dict(row)
              assert row["unit"] == "million_krw", dict(row)
              assert row["raw_artifact_id"], dict(row)
              assert row["raw_sha256"], dict(row)
              funding_row = conn.execute(
                  "SELECT value, institution_id FROM institution_funding_observations "
                  "WHERE source_id='cu_disclosure_funding' "
                  "AND source_institution_key=? "
                  "AND source_effective_month=? "
                  "AND metric_code='deposit_liabilities_total' AND valid_to IS NULL",
                  (row["source_institution_key"], row["source_effective_month"]),
              ).fetchall()
              assert len(funding_row) == 1, dict(row)
              assert funding_row[0]["institution_id"] == row["institution_id"], dict(row)

          integrity = conn.execute("PRAGMA integrity_check").fetchone()[0]
          fk = conn.execute("PRAGMA foreign_key_check").fetchall()
          payload = {
              "funding_rows_unchanged": len(funding),
              "asset_rows_for_controls": len(assets),
              "integrity_check": integrity,
              "foreign_key_violations": len(fk),
              "production_write": False,
          }
          Path("publish/cu-total-assets-persistence-readback.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False))
          assert integrity == "ok"
          assert not fk
          PY

      - name: Explicit candidate-only no-publish gate
        run: |
          set -euo pipefail
          echo "Candidate database only: no rate-monitor storage upload is called."
          echo "Canonical R2 state/current.json remains unchanged."

      - name: Upload CU persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-peer-cu-total-assets-persistence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            publish/cu-funding-before-assets.json
            publish/cu-total-assets-persistence.json
            publish/cu-total-assets-persistence-readback.json
            work/cu-size-peer-raw/*
