name: Strategy decision evidence contract

on:
  push:
    branches:
      - main
      - "feat/strategy-ux-*"
    paths:
      - "src/rate_monitor/services/strategy_decision_cockpit.py"
      - "src/rate_monitor/services/strategy_decision_evidence_refinement_presentation.py"
      - "tests/test_inflow_prediction_parity.py"
      - "tests/test_strategy_decision_cockpit.py"
      - "tests/test_strategy_decision_evidence_refinement_presentation.py"
      - "tests/test_strategy_workspace_presentation.py"
      - "scripts/strategy_preview_smoke.js"
      - "scripts/strategy_workspace_smoke.js"
      - "docs/specs/20260821-strategy-decision-evidence-refinement-v1.md"
      - ".github/workflows/strategy-decision-evidence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Publish contract locator
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=strategy-decision-evidence-contract \
            -f description="Strategy decision/parity contract running" \
            -f target_url="$TARGET_URL"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff targeted Strategy files
        run: |
          uv run ruff check \
            src/rate_monitor/services/strategy_decision_cockpit.py \
            src/rate_monitor/services/strategy_decision_evidence_refinement_presentation.py \
            tests/test_inflow_prediction_parity.py \
            tests/test_strategy_decision_cockpit.py \
            tests/test_strategy_decision_evidence_refinement_presentation.py \
            tests/test_strategy_workspace_presentation.py

      - name: Pytest Strategy decision and parity contracts
        run: |
          uv run pytest -q \
            tests/test_inflow_prediction_parity.py \
            tests/test_strategy_decision_cockpit.py \
            tests/test_strategy_decision_evidence_refinement_presentation.py \
            tests/test_strategy_workspace_presentation.py

      - name: Check browser smoke syntax
        run: |
          node --check scripts/strategy_preview_smoke.js
          node --check scripts/strategy_workspace_smoke.js

      - name: Publish contract conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="Strategy decision/parity contract passed"
          else
            STATE=failure
            DESCRIPTION="Strategy decision/parity contract failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context=strategy-decision-evidence-contract \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"
