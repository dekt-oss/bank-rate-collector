name: Strategy product id patch one-shot

on:
  push:
    branches: ["fix/strategy-stable-product-id"]
    paths:
      - ".github/workflows/strategy-product-id-patch-one-shot.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-stable-product-id
      - name: Apply patch
        run: python scripts/_strategy_product_id_patch.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rate_monitor/services/dashboard_service.py src/rate_monitor/services/site_service.py
          git commit -m "fix: strategy stable product id 직접 전달"
          git push origin HEAD:fix/strategy-stable-product-id
