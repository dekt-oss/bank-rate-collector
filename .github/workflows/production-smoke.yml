name: Production smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vercel.json"
      - "web/runtime/**"
      - "scripts/production_smoke.py"
      - "tests/test_production_smoke.py"
      - "tests/test_vercel_static_serving.py"
      - "tests/test_strategy_production_release.py"
      - ".github/workflows/collect.yml"
      - ".github/workflows/collect-savings-fast.yml"
      - ".github/workflows/nh-attempt.yml"
      - ".github/workflows/production-smoke.yml"
  workflow_run:
    workflows:
      - "수집 — 일반·새마을금고"
      - "Collect bank rates fast"
      - "수집 — 농·축협"
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    # Failed collection/publish runs already have their own failure evidence. Only
    # verify production after a successful pipeline, while PR/manual runs always
    # exercise the checker against the currently published site.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out canonical rate-data payload
        uses: actions/checkout@v4
        with:
          ref: rate-data
          path: published

      - name: Verify anonymous site access is blocked
        env:
          PRODUCTION_URL: https://bank-rate-collector.vercel.app
        run: |
          set -euo pipefail
          ROOT_HEADERS=$(mktemp)
          ROOT_STATUS=$(curl -sS --max-time 20 \
            -o /tmp/auth-root-body \
            -D "$ROOT_HEADERS" \
            -w '%{http_code}' \
            -H 'Accept: text/html' \
            "$PRODUCTION_URL/")
          if [ "$ROOT_STATUS" != "302" ]; then
            echo "::error::anonymous root must redirect to login; got HTTP $ROOT_STATUS"
            cat /tmp/auth-root-body || true
            exit 1
          fi
          if ! grep -qiE '^location: .*\/__login([?]|$)' "$ROOT_HEADERS"; then
            echo "::error::anonymous root did not redirect to /__login"
            cat "$ROOT_HEADERS"
            exit 1
          fi

          HEALTH_STATUS=$(curl -sS --max-time 20 \
            -o /tmp/auth-health-body \
            -w '%{http_code}' \
            -H 'Accept: application/json' \
            "$PRODUCTION_URL/api/health")
          if [ "$HEALTH_STATUS" != "401" ]; then
            echo "::error::anonymous /api/health must be blocked; got HTTP $HEALTH_STATUS"
            cat /tmp/auth-health-body || true
            exit 1
          fi

          {
            echo "anonymous auth boundary PASS"
            echo "root_status=$ROOT_STATUS"
            echo "health_status=$HEALTH_STATUS"
          } > production-smoke.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify production root, strategy, freshness and health endpoint
        env:
          PRODUCTION_URL: https://bank-rate-collector.vercel.app
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -o pipefail
          python scripts/production_smoke.py \
            --base-url "$PRODUCTION_URL" \
            --expected-manifest published/site-public/site-manifest.json \
            --attempts 20 \
            --interval 15 \
            --timeout 20 \
            2>&1 | tee -a production-smoke.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke.txt
          retention-days: 30
          if-no-files-found: warn
