name: Harden NH contract mismatch terminal state

on:
  push:
    branches:
      - agent/nh-resumable-acquisition-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nh-resumable-acquisition-v1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Apply adversarial review fix
        run: |
          python .github/dev/pr86_contract_patch.py
          uv sync --locked
          uv run ruff check src tests scripts
          uv run pytest -q tests/test_nh_local_resumable.py tests/test_checkpoint_workflow_contract.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/dev/pr86_contract_patch.py
          git add src/rate_monitor/collectors/nh_local/resumable.py tests/test_nh_local_resumable.py
          git commit -m "fix: seal NH checkpoint contract drift"
          git push origin HEAD:agent/nh-resumable-acquisition-v1
