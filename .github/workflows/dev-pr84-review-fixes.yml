name: Finalize PR84 workflow fix

on:
  push:
    branches:
      - agent/resumable-acquisition-common-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resumable-acquisition-common-v1
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Wire authenticated workflow context
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/collect.yml')
          text = p.read_text(encoding='utf-8')
          for scope_name in ('kfcc_scope', 'nh_local_scope'):
              old = f'          SCOPE: ${{{{ inputs.{scope_name} }}}}\n          R2_ACCESS_KEY_ID:'
              new = (
                  f'          SCOPE: ${{{{ inputs.{scope_name} }}}}\n'
                  '          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n'
                  '          R2_ACCESS_KEY_ID:'
              )
              if text.count(old) != 1:
                  raise SystemExit(f'insertion mismatch: {scope_name}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify workflow contract
        run: |
          uv sync --locked
          uv run ruff check src tests scripts
          uv run pytest -q tests/test_checkpoint_workflow_contract.py tests/test_workflow_context.py

      - name: Create final commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-pr84-review-fixes.yml
          git add -A
          git commit -m "fix: authenticate checkpoint workflow context"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          # Expected to be rejected because GITHUB_TOKEN cannot update workflow files.
          # The repository connector will advance the branch to this uploaded commit.
          git push origin HEAD:agent/resumable-acquisition-common-v1
