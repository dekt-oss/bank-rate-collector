name: Finalize PR84 workflow fix

on:
  push:
    branches:
      - agent/resumable-acquisition-common-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resumable-acquisition-common-v1
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Wire authenticated workflow context
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/collect.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          inserted = 0
          token_expr = '$' + '{{ secrets.GITHUB_TOKEN }}'
          for line in lines:
              out.append(line)
              if line.startswith('          SCOPE: '):
                  out.append('          GITHUB_TOKEN: ' + token_expr)
                  inserted += 1
          if inserted != 2:
              raise SystemExit(f'expected 2 SCOPE env lines, got {inserted}')
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Verify workflow contract
        run: |
          uv sync --locked
          uv run ruff check src tests scripts
          uv run pytest -q tests/test_checkpoint_workflow_contract.py tests/test_workflow_context.py

      - name: Create final commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-pr84-review-fixes.yml
          git add -A
          git commit -m "fix: authenticate checkpoint workflow context"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:agent/resumable-acquisition-common-v1
