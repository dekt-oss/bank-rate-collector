name: Apply relative pricing review2 patch

on:
  push:
    branches:
      - fix/relative-pricing-review2-20260901
    paths:
      - scripts/apply_relative_pricing_review2_patch.py
      - .github/workflows/apply-relative-pricing-review2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Apply patch
        run: uv run python scripts/apply_relative_pricing_review2_patch.py
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Targeted tests
        run: uv run pytest -q tests/test_relative_pricing_strategy_payload.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rate_monitor/services/relative_pricing_strategy_payload.py tests/test_relative_pricing_strategy_payload.py
          git commit -m 'fix(strategy): close second relative pricing review gates'
          git push origin HEAD:fix/relative-pricing-review2-20260901
