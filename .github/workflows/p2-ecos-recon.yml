name: P2 ECOS recon

# 한국은행 ECOS 정찰 (v4 §7.2).
#
# 인증키가 GitHub Secrets에만 있어서 로컬에서 돌릴 수 없다. 결과 JSON은
# 아티팩트로 받고, 그걸 보고 파서를 만든다.
#
# **아무것도 저장소에 쓰지 않는다.** 정찰이므로 읽기만 한다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Probe ECOS
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: uv run python scripts/p2_bok_ecos_recon.py

      # 인증키가 남았는지 마지막으로 확인한다. 아티팩트는 내려받을 수 있고,
      # 저장소가 공개라 더 조심한다.
      - name: Check the key never reached the report
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          if grep -qF "$ECOS_API_KEY" docs/source-recon/bok-ecos-recon.json; then
            echo "인증키가 정찰 보고서에 남아 있다. 올리지 않는다."
            exit 1
          fi
          echo "인증키 노출 0건"

      - uses: actions/upload-artifact@v4
        with:
          name: ecos-recon
          path: docs/source-recon/bok-ecos-recon.json
          retention-days: 7
