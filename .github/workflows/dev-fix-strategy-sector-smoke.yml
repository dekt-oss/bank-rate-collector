name: Dev fix Strategy sector smoke
on:
  push:
    branches: [fix/strategy-sector-smoke-selector-20260830]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sector-smoke-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/strategy-sector-smoke-selector-20260830
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch selector contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/strategy_preview_smoke.js')
          text = p.read_text(encoding='utf-8')
          anchor = '''function cleanNumber(value) {\n  return Number(String(value || "").replaceAll(",", "").trim());\n}\n'''
          helper = anchor + '''\nfunction sectorCheckbox(page, sector) {\n  return page.locator(`input[type="checkbox"][data-sector="${sector}"]`);\n}\n'''
          if 'function sectorCheckbox(page, sector)' not in text:
              if anchor not in text:
                  raise SystemExit('cleanNumber anchor not found')
              text = text.replace(anchor, helper, 1)
          for sector in ('cu', 'kfcc', 'nh_local'):
              old = f'''page.locator('[data-sector="{sector}"]')'''
              new = f'''sectorCheckbox(page, "{sector}")'''
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          node --check scripts/strategy_preview_smoke.js
          if grep -n "page.locator('\[data-sector=\"\(cu\|kfcc\|nh_local\)\"\]')" scripts/strategy_preview_smoke.js; then
            echo '::error::unscoped sector checkbox locator remains'
            exit 1
          fi
          grep -n 'function sectorCheckbox' scripts/strategy_preview_smoke.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/strategy_preview_smoke.js
          git commit -m 'fix: scope Strategy smoke sector selectors [sector-smoke-fixed]'
          git push origin HEAD:fix/strategy-sector-smoke-selector-20260830
