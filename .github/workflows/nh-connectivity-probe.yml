name: NH connectivity probe

on:
  push:
    branches:
      - agent/savings-fast-lane-schedule

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DNS and HTTPS
        shell: bash
        run: |
          set +e
          echo "=== UTC ==="
          date -u
          echo "=== resolver ==="
          cat /etc/resolv.conf
          echo "=== DNS wmall ==="
          getent ahosts wmall.nonghyup.com
          echo "getent rc=$?"
          python - <<'PY'
          import socket
          for host in ("wmall.nonghyup.com", "www.nonghyup.com"):
              print("\ngetaddrinfo", host)
              try:
                  for row in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM):
                      print(row)
              except Exception as exc:
                  print(type(exc).__name__, repr(exc))
          PY

          echo "=== control HTTPS www.nonghyup.com ==="
          curl -sS -o /dev/null -w 'code=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
            --connect-timeout 10 --max-time 20 https://www.nonghyup.com/
          echo "control rc=$?"

          echo "=== target HTTPS wmall list ==="
          curl -sS -o /dev/null -w 'code=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
            --connect-timeout 10 --max-time 20 \
            -A 'rate-monitor/1 (+public rate disclosure collector; 1 req/s)' \
            https://wmall.nonghyup.com/servlet/SFDPW0161R.view
          echo "target rc=$?"

          echo "=== Python TLS sockets ==="
          python - <<'PY'
          import socket, ssl, time
          host = "wmall.nonghyup.com"
          try:
              infos = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
          except Exception as exc:
              print("resolve failed", type(exc).__name__, repr(exc))
              raise SystemExit(0)
          seen = set()
          for family, socktype, proto, canonname, sockaddr in infos:
              key = (family, sockaddr)
              if key in seen:
                  continue
              seen.add(key)
              print("connect", family, sockaddr)
              s = socket.socket(family, socktype, proto)
              s.settimeout(8)
              start = time.monotonic()
              try:
                  s.connect(sockaddr)
                  print("tcp ok", round(time.monotonic()-start, 3))
                  ctx = ssl.create_default_context()
                  with ctx.wrap_socket(s, server_hostname=host) as tls:
                      print("tls ok", tls.version(), tls.cipher())
              except Exception as exc:
                  print("connect failed", type(exc).__name__, repr(exc), "after", round(time.monotonic()-start, 3))
                  try:
                      s.close()
                  except Exception:
                      pass
          PY

      - name: Reproduce adapter-level httpx error
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import asyncio, traceback
          import httpx

          async def main():
              timeout = httpx.Timeout(connect=10.0, read=60.0, write=60.0, pool=10.0)
              async with httpx.AsyncClient(
                  timeout=timeout,
                  follow_redirects=True,
                  headers={"User-Agent": "rate-monitor/1 (+public rate disclosure collector; 1 req/s)"},
              ) as client:
                  try:
                      r = await client.get("https://wmall.nonghyup.com/servlet/SFDPW0161R.view")
                      print("status", r.status_code, "bytes", len(r.content), "final", r.url)
                  except Exception as exc:
                      print("top", type(exc).__name__, repr(exc))
                      cur = exc
                      depth = 0
                      while cur is not None and depth < 10:
                          print("cause", depth, type(cur).__name__, repr(cur))
                          cur = cur.__cause__ or cur.__context__
                          depth += 1
                      traceback.print_exc()

          asyncio.run(main())
          PY
