name: Verify — Special-offer current-main one-shot

# Temporary one-shot production verification for Issue #347.
# The path filter ensures this runs only when this verification workflow itself
# is added/changed. It will be deleted after the run reaches a terminal result.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-special-offer-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  verify:
    uses: ./.github/workflows/collect.yml
    with:
      manual_target: "특판만"
      require_password: false
      accept_volume_drop: false
    secrets: inherit
