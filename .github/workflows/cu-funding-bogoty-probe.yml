name: Diagnostic — CU bogoTy summary contract

on:
  workflow_dispatch:
  push:
    branches:
      - recon/cu-funding-disclosure-20260829
    paths:
      - scripts/cu_funding_bogoty_probe.py
      - .github/workflows/cu-funding-bogoty-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked
      - name: Probe bogoTy=N structured finance summary
        run: uv run python scripts/cu_funding_bogoty_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cu-funding-bogoty-probe-${{ github.run_id }}
          path: docs/source-recon/cu-funding-bogoty-probe-20260829.json
          if-no-files-found: error
          retention-days: 14
