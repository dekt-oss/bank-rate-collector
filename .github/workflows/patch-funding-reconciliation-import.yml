name: Maintenance — fix funding reconciliation import

on:
  push:
    branches:
      - feat/cu-funding-disclosure-20260829
    paths:
      - .github/workflows/patch-funding-reconciliation-import.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cu-funding-disclosure-20260829
      - name: Apply Ruff import fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/rate_monitor/collectors/data_go_funding/reconciliation.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from collections import defaultdict\n',
              'from collections import defaultdict\nfrom collections.abc import Iterable\n',
              1,
          )
          text = text.replace('from typing import Any, Iterable\n', 'from typing import Any\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-funding-reconciliation-import.yml
      - name: Commit lint fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rate_monitor/collectors/data_go_funding/reconciliation.py .github/workflows/patch-funding-reconciliation-import.yml
          git commit -m "style: fix funding reconciliation imports"
          git push origin HEAD:feat/cu-funding-disclosure-20260829
