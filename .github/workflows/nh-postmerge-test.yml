name: NH post-merge one-shot test

# Temporary operator-authorized test harness. It exists only on the test branch and
# runs the merged NH reusable attempt chain against the production data path.
on:
  push:
    branches: [agent/nh-postmerge-test]

concurrency:
  group: rate-data-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  attempt_1:
    uses: ./.github/workflows/nh-attempt.yml
    with:
      attempt: 1
      max_attempts: 3
      scope: "전국"
      resume_mode: fresh
      accept_volume_drop: false
    secrets: inherit

  attempt_2:
    needs: attempt_1
    if: ${{ needs.attempt_1.result == 'success' && needs.attempt_1.outputs.outcome == 'retry' }}
    uses: ./.github/workflows/nh-attempt.yml
    with:
      attempt: 2
      max_attempts: 3
      cycle_date: ${{ needs.attempt_1.outputs.cycle_date }}
      scope: "전국"
      resume_mode: auto
      accept_volume_drop: false
    secrets: inherit

  attempt_3:
    needs: attempt_2
    if: ${{ needs.attempt_2.result == 'success' && needs.attempt_2.outputs.outcome == 'retry' }}
    uses: ./.github/workflows/nh-attempt.yml
    with:
      attempt: 3
      max_attempts: 3
      cycle_date: ${{ needs.attempt_2.outputs.cycle_date }}
      scope: "전국"
      resume_mode: auto
      accept_volume_drop: false
    secrets: inherit

  surface:
    needs: [attempt_1, attempt_2, attempt_3]
    if: always()
    runs-on: ubuntu-latest
    env:
      A1_RESULT: ${{ needs.attempt_1.result }}
      A1_OUTCOME: ${{ needs.attempt_1.outputs.outcome }}
      A2_RESULT: ${{ needs.attempt_2.result }}
      A2_OUTCOME: ${{ needs.attempt_2.outputs.outcome }}
      A3_RESULT: ${{ needs.attempt_3.result }}
      A3_OUTCOME: ${{ needs.attempt_3.outputs.outcome }}
    steps:
      - name: Surface NH post-merge test result
        run: |
          set -euo pipefail
          for result in "$A1_RESULT" "$A2_RESULT" "$A3_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::NH attempt workflow failed: a1=$A1_RESULT a2=$A2_RESULT a3=$A3_RESULT"
              exit 1
            fi
          done

          TERMINAL="$A1_OUTCOME"
          [ -n "$A2_OUTCOME" ] && TERMINAL="$A2_OUTCOME"
          [ -n "$A3_OUTCOME" ] && TERMINAL="$A3_OUTCOME"
          if [ "$TERMINAL" = "success" ]; then
            echo "NH post-merge test success"
            exit 0
          fi
          echo "::error::NH post-merge test failed: terminal_outcome=$TERMINAL"
          exit 1
