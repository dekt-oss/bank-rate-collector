name: Dev NH e-joy lint fix
on:
  push:
    branches: [fix/nh-resumable-ejoy-max-rate-20260830]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[nh-ejoy-lint-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nh-resumable-ejoy-max-rate-20260830
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12 && uv sync --locked
      - name: Fix and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify_gate.py')
          s = p.read_text(encoding='utf-8')
          old = '                "     OR p.name NOT IN (\'정기예탁금\',\'복리식정기예탁금\',\'정기적금\',\'자유적립적금\',\'자유로부금\')"\n'
          new = ('                "     OR p.name NOT IN (\'정기예탁금\',\'복리식정기예탁금\',"\n'
                 '                "\'정기적금\',\'자유적립적금\',\'자유로부금\')"\n')
          if s.count(old) != 1:
              raise SystemExit(f'expected one long SQL line, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          uv run ruff format src/rate_monitor/collectors/nh_local/resumable.py \
            src/rate_monitor/collectors/nh_local/adapter.py scripts/verify_gate.py \
            tests/test_nh_resumable_ejoy_contract.py
          uv run ruff check src tests scripts
          uv run pytest -q tests/test_nh_resumable_ejoy_contract.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_gate.py src/rate_monitor/collectors/nh_local/resumable.py \
            src/rate_monitor/collectors/nh_local/adapter.py tests/test_nh_resumable_ejoy_contract.py
          git commit -m "test: validate NH resumable e-joy repair [nh-ejoy-lint-fixed]"
          git push origin HEAD:fix/nh-resumable-ejoy-max-rate-20260830
