name: TEMP apply Windows path contract fix

on:
  push:
    branches:
      - fix/windows-posix-path-contract-20260826
    paths:
      - ".github/workflows/temp-apply-windows-path-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-posix-path-contract-20260826
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Apply path contract fix and regression guards
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "src/rate_monitor/services/site_service.py",
              "files = [str(table_path.relative_to(out_dir)), str(gz_path.relative_to(out_dir))]",
              "files = [table_path.relative_to(out_dir).as_posix(), gz_path.relative_to(out_dir).as_posix()]",
          )
          replace_exact(
              "src/rate_monitor/services/site_service.py",
              "str(strategy_table_path.relative_to(out_dir)),\n                str(strategy_table_gz_path.relative_to(out_dir)),",
              "strategy_table_path.relative_to(out_dir).as_posix(),\n                strategy_table_gz_path.relative_to(out_dir).as_posix(),",
          )
          replace_exact(
              "src/rate_monitor/services/site_service.py",
              "relative = str(target.relative_to(out_dir))",
              "relative = target.relative_to(out_dir).as_posix()",
          )
          replace_exact(
              "src/rate_monitor/services/collection_service.py",
              "relative_path=str(path),",
              "relative_path=path.as_posix(),",
          )

          replace_exact(
              "tests/test_site_service.py",
              '    assert TABLE_FILE in recorded["files"]\n',
              '    assert TABLE_FILE in recorded["files"]\n    assert all("\\\\" not in relative_path for relative_path in recorded["files"])\n',
          )
          replace_exact(
              "tests/test_site_service.py",
              "    assert packed.exists()\n    assert packed.stat().st_size < (exports / \"rates_20260806.json\").stat().st_size\n",
              "    assert packed.exists()\n    inline = _inline((out / \"index.html\").read_text(encoding=\"utf-8\"))\n    assert inline[\"downloads\"][\"json\"][\"url\"] == \"data/rates.json.gz\"\n    assert \"\\\\\" not in inline[\"downloads\"][\"json\"][\"url\"]\n    assert packed.stat().st_size < (exports / \"rates_20260806.json\").stat().st_size\n",
          )
          replace_exact(
              "tests/test_strategy_dashboard.py",
              '    assert STRATEGY_TABLE_FILE in manifest.files\n',
              '    assert STRATEGY_TABLE_FILE in manifest.files\n    assert all("\\\\" not in relative_path for relative_path in manifest.files)\n',
          )
          replace_exact(
              "tests/test_repeat_guard.py",
              '        rows = {r.relative_path.rsplit("/", 1)[-1]: r.request_meta_json\n                for r in session.scalars(select(m.RawArtifact)).all()}\n',
              '        raw_rows = session.scalars(select(m.RawArtifact)).all()\n        assert all("\\\\" not in row.relative_path for row in raw_rows)\n        rows = {\n            row.relative_path.rsplit("/", 1)[-1]: row.request_meta_json\n            for row in raw_rows\n        }\n',
          )

          Path(".github/workflows/windows-path-contract.yml").write_text(
              '''name: Windows path contract\n\non:\n  push:\n    paths:\n      - "src/rate_monitor/services/site_service.py"\n      - "src/rate_monitor/services/collection_service.py"\n      - "tests/test_site_service.py"\n      - "tests/test_strategy_dashboard.py"\n      - "tests/test_repeat_guard.py"\n      - ".github/workflows/windows-path-contract.yml"\n  pull_request:\n    paths:\n      - "src/rate_monitor/services/site_service.py"\n      - "src/rate_monitor/services/collection_service.py"\n      - "tests/test_site_service.py"\n      - "tests/test_strategy_dashboard.py"\n      - "tests/test_repeat_guard.py"\n      - ".github/workflows/windows-path-contract.yml"\n\npermissions:\n  contents: read\n\njobs:\n  path-contract:\n    runs-on: windows-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Install uv\n        uses: astral-sh/setup-uv@v5\n        with:\n          enable-cache: true\n\n      - name: Set up Python\n        run: uv python install 3.12\n\n      - name: Sync dependencies\n        run: uv sync --locked\n\n      - name: Verify Windows path-sensitive regression tests\n        run: >-\n          uv run pytest -q\n          tests/test_site_service.py::test_manifest_records_what_was_written\n          tests/test_site_service.py::test_huge_export_is_compressed\n          tests/test_strategy_dashboard.py::test_release_gate_builds_strategy_page_without_replacing_index\n          tests/test_repeat_guard.py::test_identical_responses_share_one_row_but_no_query_is_lost\n''',
              encoding="utf-8",
          )
          PY

      - name: Targeted Linux regression tests
        run: >-
          uv run pytest -q
          tests/test_site_service.py::test_manifest_records_what_was_written
          tests/test_site_service.py::test_huge_export_is_compressed
          tests/test_strategy_dashboard.py::test_release_gate_builds_strategy_page_without_replacing_index
          tests/test_repeat_guard.py::test_identical_responses_share_one_row_but_no_query_is_lost

      - name: Lint changed Python tests and services
        run: >-
          uv run ruff check
          src/rate_monitor/services/site_service.py
          src/rate_monitor/services/collection_service.py
          tests/test_site_service.py
          tests/test_strategy_dashboard.py
          tests/test_repeat_guard.py

      - name: Remove one-off audit/apply workflows before commit
        run: |
          rm -f .github/workflows/temp-raw-artifact-path-audit.yml
          rm -f .github/workflows/temp-apply-windows-path-fix.yml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "dekt-oss"
          git config user.email "degackt@gmail.com"
          git add src/rate_monitor/services/site_service.py \
                  src/rate_monitor/services/collection_service.py \
                  tests/test_site_service.py \
                  tests/test_strategy_dashboard.py \
                  tests/test_repeat_guard.py \
                  .github/workflows/windows-path-contract.yml \
                  .github/workflows/temp-raw-artifact-path-audit.yml \
                  .github/workflows/temp-apply-windows-path-fix.yml
          git commit -m "fix: normalize persisted paths across operating systems"
          git push origin HEAD:fix/windows-posix-path-contract-20260826
