name: P0 finlife API test

on:
  workflow_dispatch:
    inputs:
      top_fin_grp_no:
        description: "금융권역 코드 (020000=은행, 030300=저축은행)"
        required: false
        default: "030300"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run finlife API connectivity test
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
        run: python scripts/p0_finlife_test.py "${{ inputs.top_fin_grp_no }}"
      - name: Upload raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-finlife-raw
          path: data/raw/p0/finlife/
          if-no-files-found: ignore
