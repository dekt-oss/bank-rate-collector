name: Dashboard usability preference v2

on:
  pull_request:
    paths:
      - "src/rate_monitor/services/main_map_drilldown_refinement.py"
      - "src/rate_monitor/services/preference_intelligence_service.py"
      - "src/rate_monitor/services/preference_intelligence_presentation.py"
      - "src/rate_monitor/services/strategy_readability_preference_v2_presentation.py"
      - "src/rate_monitor/services/strategy_decision_cockpit.py"
      - "src/rate_monitor/services/public_structural_v2_cockpit_presentation.py"
      - "src/rate_monitor/services/public_structural_v2_cockpit_visual_refinement.py"
      - "src/rate_monitor/services/public_structural_v2_factual_rate_finder_service.py"
      - "src/rate_monitor/services/public_structural_v2_factual_rate_finder_presentation.py"
      - "src/rate_monitor/services/public_structural_v2_forecast_provider.py"
      - "src/rate_monitor/services/public_structural_v2_forecast_provider_presentation.py"
      - "src/rate_monitor/services/public_structural_v2_surface_service.py"
      - "src/rate_monitor/services/institution_funding_read_model.py"
      - "src/rate_monitor/services/institution_funding_read_model_db.py"
      - "src/rate_monitor/services/institution_funding_strategy_payload.py"
      - "src/rate_monitor/services/institution_funding_position_service.py"
      - "src/rate_monitor/services/institution_funding_position_presentation.py"
      - "tests/test_main_map_drilldown_refinement.py"
      - "tests/test_main_map_presentation.py"
      - "tests/test_preference_intelligence_service.py"
      - "tests/test_preference_intelligence_presentation.py"
      - "tests/test_strategy_readability_preference_v2_presentation.py"
      - "tests/test_public_structural_v2_cockpit_presentation.py"
      - "tests/test_public_structural_v2_cockpit_visual_refinement.py"
      - "tests/test_public_structural_v2_factual_rate_finder_*.py"
      - "tests/test_public_structural_v2_forecast_provider*.py"
      - "tests/test_public_structural_v2_surface*.py"
      - "tests/test_institution_funding_read_model.py"
      - "tests/test_institution_funding_strategy_payload.py"
      - "tests/test_institution_funding_position_ui.py"
      - "web/public-structural-v2/factual_rate_finder.js"
      - "web/public-structural-v2/forecast_provider.js"
      - "web/public-structural-v2/surface.js"
      - "scripts/main_map_runtime_smoke.js"
      - "scripts/dashboard_usability_preference_v2_smoke.js"
      - "scripts/public_structural_v2_cockpit_runtime_smoke.js"
      - "scripts/public_structural_v2_provider_runtime_smoke.js"
      - "scripts/institution_funding_position_runtime_smoke.js"
      - ".github/workflows/dashboard-usability-preference-v2.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Targeted lint
        run: |
          uv run ruff check \
            src/rate_monitor/services/main_map_drilldown_refinement.py \
            src/rate_monitor/services/preference_intelligence_service.py \
            src/rate_monitor/services/preference_intelligence_presentation.py \
            src/rate_monitor/services/strategy_readability_preference_v2_presentation.py \
            src/rate_monitor/services/strategy_decision_cockpit.py \
            src/rate_monitor/services/public_structural_v2_cockpit_presentation.py \
            src/rate_monitor/services/public_structural_v2_cockpit_visual_refinement.py \
            src/rate_monitor/services/public_structural_v2_factual_rate_finder_service.py \
            src/rate_monitor/services/public_structural_v2_factual_rate_finder_presentation.py \
            src/rate_monitor/services/public_structural_v2_forecast_provider.py \
            src/rate_monitor/services/public_structural_v2_forecast_provider_presentation.py \
            src/rate_monitor/services/public_structural_v2_surface_service.py \
            src/rate_monitor/services/institution_funding_read_model.py \
            src/rate_monitor/services/institution_funding_read_model_db.py \
            src/rate_monitor/services/institution_funding_strategy_payload.py \
            src/rate_monitor/services/institution_funding_position_service.py \
            tests/test_main_map_drilldown_refinement.py \
            tests/test_main_map_presentation.py \
            tests/test_preference_intelligence_service.py \
            tests/test_preference_intelligence_presentation.py \
            tests/test_strategy_readability_preference_v2_presentation.py \
            tests/test_public_structural_v2_cockpit_presentation.py \
            tests/test_public_structural_v2_cockpit_visual_refinement.py \
            tests/test_public_structural_v2_factual_rate_finder_service.py \
            tests/test_public_structural_v2_factual_rate_finder_parity.py \
            tests/test_public_structural_v2_factual_rate_finder_presentation.py \
            tests/test_public_structural_v2_forecast_provider.py \
            tests/test_public_structural_v2_forecast_provider_parity.py \
            tests/test_public_structural_v2_forecast_provider_presentation.py \
            tests/test_public_structural_v2_surface_service.py \
            tests/test_public_structural_v2_surface_parity.py \
            tests/test_institution_funding_read_model.py \
            tests/test_institution_funding_strategy_payload.py \
            tests/test_institution_funding_position_ui.py

      - name: Targeted tests
        run: |
          uv run pytest -q \
            tests/test_main_map_drilldown_refinement.py \
            tests/test_main_map_presentation.py \
            tests/test_preference_intelligence_service.py \
            tests/test_preference_intelligence_presentation.py \
            tests/test_strategy_readability_preference_v2_presentation.py \
            tests/test_public_structural_v2_cockpit_presentation.py \
            tests/test_public_structural_v2_cockpit_visual_refinement.py \
            tests/test_public_structural_v2_factual_rate_finder_service.py \
            tests/test_public_structural_v2_factual_rate_finder_parity.py \
            tests/test_public_structural_v2_factual_rate_finder_presentation.py \
            tests/test_public_structural_v2_forecast_provider.py \
            tests/test_public_structural_v2_forecast_provider_parity.py \
            tests/test_public_structural_v2_forecast_provider_presentation.py \
            tests/test_public_structural_v2_surface_service.py \
            tests/test_public_structural_v2_surface_parity.py \
            tests/test_institution_funding_read_model.py \
            tests/test_institution_funding_strategy_payload.py \
            tests/test_institution_funding_position_ui.py

      - name: Browser smoke syntax
        run: |
          node --check scripts/main_map_runtime_smoke.js
          node --check scripts/dashboard_usability_preference_v2_smoke.js
          node --check scripts/public_structural_v2_cockpit_runtime_smoke.js
          node --check scripts/public_structural_v2_provider_runtime_smoke.js
          node --check scripts/institution_funding_position_runtime_smoke.js
          node --check web/public-structural-v2/factual_rate_finder.js
          node --check web/public-structural-v2/forecast_provider.js
          node --check web/public-structural-v2/surface.js

  production-data-runtime:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore production database into runner-local copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          print(load_backend(Path('config/storage.yaml')).backend.value)
          ")
          echo "dashboard v2 runtime source backend=$BACKEND"
          if [ "$BACKEND" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          else
            git fetch --force origin +rate-data:refs/remotes/origin/rate-data --depth=1
            git show refs/remotes/origin/rate-data:latest/rate_monitor.sqlite3.gz \
              > work/rate_monitor.sqlite3.gz
            gunzip work/rate_monitor.sqlite3.gz
          fi
          test -s work/rate_monitor.sqlite3
          echo "restored bytes=$(stat -c%s work/rate_monitor.sqlite3)"

      - name: Apply migrations to runner-local copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Measure production funding position payload
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          from rate_monitor.services.institution_funding_position_service import (
              build_institution_funding_positions,
          )

          db = Path("work/rate_monitor.sqlite3")
          conn = sqlite3.connect(db)
          rows = conn.execute(
              """
              SELECT sector,
                     COUNT(*) AS active,
                     SUM(institution_id IS NOT NULL) AS mapped,
                     SUM(institution_id IS NULL) AS unmapped,
                     COUNT(DISTINCT institution_id) AS mapped_institutions,
                     MIN(source_effective_month),
                     MAX(source_effective_month)
              FROM institution_funding_observations
              WHERE valid_to IS NULL
                AND metric_code = 'deposit_liabilities_total'
              GROUP BY sector ORDER BY sector
              """
          ).fetchall()
          payload = build_institution_funding_positions(db)
          evidence = {
              "canonical": [
                  {
                      "sector": row[0],
                      "active": row[1],
                      "mapped": row[2],
                      "unmapped": row[3],
                      "mapped_institutions": row[4],
                      "earliest_month": row[5],
                      "latest_month": row[6],
                  }
                  for row in rows
              ],
              "position_sectors": {
                  key: {
                      "analysis_month": value["analysis_month"],
                      "observed": value["coverage"]["observed_institutions"],
                      "eligible": value["coverage"]["eligible_institutions"],
                      "coverage_ratio": value["coverage"]["coverage_ratio"],
                      "growth_6m": value["availability"]["growth_6m_institutions"],
                      "growth_12m": value["availability"]["growth_12m_institutions"],
                      "freshness": value["freshness"],
                  }
                  for key, value in payload["sectors"].items()
              },
              "display_order": payload["display_order"],
          }
          assert "savings_bank" in payload["sectors"]
          assert "cu" not in payload["sectors"], (
              "CU appeared even though the current production canonical DB has no CU funding"
          )
          Path("work/institution-funding-production.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False))
          PY

      - name: Build isolated site from production data
        env:
          RATE_MONITOR_STRATEGY_DASHBOARD: "1"
        run: |
          set -euo pipefail
          uv run rate-monitor build-site \
            --db work/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out work/site-public
          test -s work/site-public/index.html
          test -s work/site-public/strategy.html
          grep -q 'data-main-map-drilldown-refinement="1"' work/site-public/index.html
          grep -q 'id="strategy-readability-preference-v2-script"' work/site-public/strategy.html
          grep -q 'preference-intelligence-v2' work/site-public/strategy.html
          grep -q 'preference_bearing_products_present_only' work/site-public/strategy.html
          grep -q 'id="public-structural-v2-cockpit-script"' work/site-public/strategy.html
          grep -q 'id="public-structural-v2-engine-bundle"' work/site-public/strategy.html
          grep -q 'id="public-structural-v2-cockpit-visual-refinement-script"' work/site-public/strategy.html
          grep -q 'id="public-structural-v2-forecast-provider-engine"' work/site-public/strategy.html
          grep -q 'id="public-structural-v2-forecast-provider-bridge"' work/site-public/strategy.html
          grep -q 'id="public-structural-v2-factual-rate-finder-engine"' work/site-public/strategy.html
          grep -q 'id="public-structural-v2-factual-rate-finder-script"' work/site-public/strategy.html
          grep -q 'id="institution-funding-position-script"' work/site-public/strategy.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Korean visual QA font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match "Noto Sans CJK KR"

      - name: Install Playwright runner
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          npm install --no-save --package-lock=false @playwright/test@1.61.1
          node --check scripts/main_map_runtime_smoke.js
          node --check scripts/dashboard_usability_preference_v2_smoke.js
          node --check scripts/strategy_preview_smoke.js
          node --check scripts/public_structural_v2_cockpit_runtime_smoke.js
          node --check scripts/public_structural_v2_provider_runtime_smoke.js
          node --check scripts/institution_funding_position_runtime_smoke.js
          node --check web/public-structural-v2/factual_rate_finder.js
          node --check web/public-structural-v2/forecast_provider.js
          node --check web/public-structural-v2/surface.js

      - name: Run desktop and mobile Chrome smoke
        env:
          STRATEGY_PREVIEW_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory work/site-public \
            > work/dashboard-v2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/strategy.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          curl -fsS http://127.0.0.1:4173/strategy.html >/dev/null
          EXPECT_MAIN_MAP_CROP=1 MAIN_MAP_SMOKE_PREFIX=main-map-v2-local \
            node scripts/main_map_runtime_smoke.js
          node scripts/public_structural_v2_provider_runtime_smoke.js
          node scripts/public_structural_v2_cockpit_runtime_smoke.js
          node scripts/dashboard_usability_preference_v2_smoke.js
          node scripts/strategy_preview_smoke.js
          node scripts/institution_funding_position_runtime_smoke.js

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-usability-preference-v2-${{ github.run_id }}
          path: |
            work/main-map-v2-local-*.png
            work/main-map-v2-local-layout-metrics.json
            work/dashboard-usability-preference-v2-*.png
            work/dashboard-usability-preference-v2-metrics.json
            work/strategy-smoke-*.png
            work/public-structural-v2-cockpit-*.png
            work/institution-funding-*.png
            work/institution-funding-production.json
            work/dashboard-v2-http.log
          retention-days: 30
          if-no-files-found: warn
