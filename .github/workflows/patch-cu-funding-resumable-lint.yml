name: Maintenance — apply CU checkpoint lint fix

on:
  push:
    branches:
      - feat/cu-funding-disclosure-20260829
    paths:
      - .github/workflows/patch-cu-funding-resumable-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cu-funding-disclosure-20260829
      - run: |
          set -euo pipefail
          python scripts/patch_cu_funding_resumable_lint.py
          rm -f .github/workflows/patch-cu-funding-resumable-lint.yml
          rm -f scripts/patch_cu_funding_resumable_lint.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: fix CU funding checkpoint lint"
          git push origin HEAD:feat/cu-funding-disclosure-20260829
