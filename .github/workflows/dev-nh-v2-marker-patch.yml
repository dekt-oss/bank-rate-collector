name: Dev NH v2 run marker patch

on:
  push:
    branches: [fix/nh-ejoy-current-run-gate-20260830]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nh-v2-marker-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nh-ejoy-current-run-gate-20260830
      - name: Patch persisted v2 run marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/rate_monitor/collectors/nh_local/resumable.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.fetch_note = guard.summary()\n'
          new = (
              '        self.fetch_note = (\n'
              '            f"nh_acquisition_contract=v{NH_ACQUISITION_CONTRACT_VERSION} · "\n'
              '            f"{guard.summary()}"\n'
              '        )\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one marker insertion point, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Focused checks
        run: |
          python -m py_compile src/rate_monitor/collectors/nh_local/resumable.py src/rate_monitor/services/validation_service.py tests/test_nh_ejoy_validation_gate.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rate_monitor/collectors/nh_local/resumable.py
          git commit -m "fix: persist NH resumable v2 run marker [nh-v2-marker-patched]"
          git push origin HEAD:fix/nh-ejoy-current-run-gate-20260830
