name: 복구 — 실패한 정기 수집 1회 재실행

on:
  workflow_run:
    workflows:
      - "수집 — 아침 SLA 체인"
      - "수집 — 일반·새마을금고"
      - "수집 — 농·축협"
      - "수집 — Data.go 기관별 수신잔액"
      - "Collect bank rates fast"
    types: [completed]

# Morning production scheduling is owned by the parent SLA chain. A terminal parent
# failure gets exactly one failed-jobs rerun; GitHub re-runs the failed job and its
# dependent jobs, preserving the successful prefix of the chain. Standalone/manual
# child workflows keep the legacy recovery paths below.
concurrency:
  group: failed-scheduled-collection-recovery-control-plane
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  recover:
    # 정기 실행(schedule)만, 그리고 default branch에서 돈 실행만 재실행한다.
    # Morning-chain rerun attempt 2는 다시 복구하지 않아 bounded one-shot을 보장한다.
    if: >-
      ${{ github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.name != '수집 — 아침 SLA 체인' ||
           github.event.workflow_run.run_attempt == 1) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COLLECT_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
      PARENT_WORKFLOW: ${{ github.event.workflow_run.name }}
      PARENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      PARENT_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
      PARENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Checkout current main control plane
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate recovery context
        run: |
          set -euo pipefail
          test -n "$COLLECT_PASSWORD"
          test -n "$PARENT_RUN_ID"
          test -n "$PARENT_WORKFLOW"
          test -n "$PARENT_CONCLUSION"
          test -n "$PARENT_RUN_STARTED_AT"
          test -n "$PARENT_RUN_ATTEMPT"
          echo "scheduled workflow=$PARENT_WORKFLOW run_id=$PARENT_RUN_ID attempt=$PARENT_RUN_ATTEMPT conclusion=$PARENT_CONCLUSION"

      - name: Dispatch one current-main recovery for terminal failure
        if: ${{ env.PARENT_CONCLUSION == 'failure' }}
        run: |
          set -euo pipefail

          case "$PARENT_WORKFLOW" in
            "수집 — 아침 SLA 체인")
              # GitHub rerun-failed-jobs re-runs failed jobs and their dependent
              # jobs. The successful prefix (for example NH) is not repeated.
              echo "recovery target=morning chain failed jobs + dependents"
              gh run rerun "$PARENT_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --failed
              ;;

            "수집 — 일반·새마을금고")
              # Legacy/manual compatibility path. Scheduled production collection
              # is now owned by the parent morning chain.
              gh run view "$PARENT_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --log > parent-run.log

              if grep -q 'KFCC_ONLY: true' parent-run.log; then
                KFCC_RESUME_MODE="auto"
                if grep -q 'COMPLETE_REPLAY_UNPROVEN' parent-run.log; then
                  KFCC_RESUME_MODE="fresh"
                fi
                echo "recovery target=KFCC nationwide resume_mode=$KFCC_RESUME_MODE"
                gh workflow run collect.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f password="$COLLECT_PASSWORD" \
                  -f manual_target="새마을금고만" \
                  -f kfcc_scope="전국" \
                  -f kfcc_resume_mode="$KFCC_RESUME_MODE" \
                  -f accept_volume_drop=false
              elif grep -q 'KFCC_ONLY: false' parent-run.log; then
                echo "recovery target=general"
                gh workflow run collect.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f password="$COLLECT_PASSWORD" \
                  -f manual_target="일반 전체" \
                  -f accept_volume_drop=false
              else
                echo "::error::parent logs do not prove KFCC_ONLY=true/false; refusing ambiguous recovery"
                exit 1
              fi
              ;;

            "수집 — 농·축협")
              gh run view "$PARENT_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --log > parent-run.log
              NH_RESUME_MODE="auto"
              if grep -q 'COMPLETE_REPLAY_UNPROVEN' parent-run.log; then
                NH_RESUME_MODE="fresh"
              fi
              echo "recovery target=NH nationwide resume_mode=$NH_RESUME_MODE"
              gh workflow run collect-nh.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f password="$COLLECT_PASSWORD" \
                -f nh_local_scope="전국" \
                -f nh_resume_mode="$NH_RESUME_MODE" \
                -f accept_volume_drop=false
              ;;

            "수집 — Data.go 기관별 수신잔액")
              echo "recovery target=Data.go incremental"
              gh workflow run collect-institution-funding.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f password="$COLLECT_PASSWORD" \
                -f mode=incremental \
                -f periods=12
              ;;

            "Collect bank rates fast")
              echo "recovery target=general after fast-bank terminal failure"
              gh workflow run collect.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f password="$COLLECT_PASSWORD" \
                -f manual_target="일반 전체" \
                -f accept_volume_drop=false
              ;;

            *)
              echo "::error::unsupported scheduled workflow: $PARENT_WORKFLOW"
              exit 1
              ;;
          esac

          echo "one-shot terminal recovery dispatched"

      - name: Build recovery plan for soft-source failures
        id: soft_plan
        if: >-
          ${{ env.PARENT_CONCLUSION == 'success' &&
              (env.PARENT_WORKFLOW == '수집 — 아침 SLA 체인' ||
               env.PARENT_WORKFLOW == '수집 — 일반·새마을금고' ||
               env.PARENT_WORKFLOW == 'Collect bank rates fast') }}
        run: |
          set -euo pipefail
          rm -rf recovery-evidence work/soft-recovery-plan.json
          mkdir -p recovery-evidence work

          EXTRA_ARGS=()
          case "$PARENT_WORKFLOW" in
            "수집 — 아침 SLA 체인")
              ARTIFACT="collection-run-$PARENT_RUN_ID"
              ;;
            "수집 — 일반·새마을금고")
              ARTIFACT="collection-run-$PARENT_RUN_ID"
              gh run view "$PARENT_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --log > parent-run.log
              if grep -q 'KFCC_ONLY: true' parent-run.log; then
                EXTRA_ARGS=(--kfcc-only true)
              elif grep -q 'KFCC_ONLY: false' parent-run.log; then
                EXTRA_ARGS=(--kfcc-only false)
              else
                echo "::error::parent logs do not prove KFCC_ONLY=true/false; refusing ambiguous soft recovery"
                exit 1
              fi
              ;;
            "Collect bank rates fast")
              ARTIFACT="bank-rates-fast-$PARENT_RUN_ID"
              ;;
            *)
              echo "::error::unsupported soft-recovery workflow: $PARENT_WORKFLOW"
              exit 1
              ;;
          esac

          # The artifact belongs to this exact immutable parent run. Reading the
          # mutable rate-data branch here would race with later queued writers.
          gh run download "$PARENT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT" \
            --dir recovery-evidence

          SUMMARY=$(find recovery-evidence -type f -name summary.json -print -quit)
          if [ -z "$SUMMARY" ]; then
            echo "::error::summary.json missing from parent artifact $ARTIFACT"
            exit 1
          fi

          python scripts/scheduled_soft_failure_recovery.py \
            --summary "$SUMMARY" \
            --workflow "$PARENT_WORKFLOW" \
            --run-started-at "$PARENT_RUN_STARTED_AT" \
            "${EXTRA_ARGS[@]}" \
            --output work/soft-recovery-plan.json

          TARGET_COUNT=$(python -c "import json; print(len(json.load(open('work/soft-recovery-plan.json', encoding='utf-8'))['targets']))")
          echo "target_count=$TARGET_COUNT" >> "$GITHUB_OUTPUT"
          echo "soft recovery target_count=$TARGET_COUNT"
          cat work/soft-recovery-plan.json

      - name: Dispatch bounded recovery for soft-failed sources
        if: ${{ steps.soft_plan.outputs.target_count != '' && steps.soft_plan.outputs.target_count != '0' }}
        run: |
          set -euo pipefail
          mapfile -t TARGETS < <(
            python -c "import json; print('\\n'.join(json.load(open('work/soft-recovery-plan.json', encoding='utf-8'))['targets']))"
          )

          for target in "${TARGETS[@]}"; do
            case "$target" in
              "일반 전체"|"참고지표만"|"저축은행만"|"신협만")
                echo "soft recovery target=$target"
                gh workflow run collect.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f password="$COLLECT_PASSWORD" \
                  -f manual_target="$target" \
                  -f accept_volume_drop=false
                ;;
              "새마을금고만")
                echo "soft recovery target=KFCC nationwide"
                gh workflow run collect.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f password="$COLLECT_PASSWORD" \
                  -f manual_target="새마을금고만" \
                  -f kfcc_scope="전국" \
                  -f kfcc_resume_mode=auto \
                  -f accept_volume_drop=false
                ;;
              *)
                echo "::error::unmapped recovery target: $target"
                exit 1
                ;;
            esac
          done

          echo "bounded soft-source recovery dispatched on current main"

      - name: Report non-recoverable workflow conclusion
        if: ${{ env.PARENT_CONCLUSION != 'success' && env.PARENT_CONCLUSION != 'failure' }}
        run: |
          echo "::notice::scheduled workflow conclusion=$PARENT_CONCLUSION; automatic retry is intentionally limited to failure or successful runs with proven soft-source failure"
