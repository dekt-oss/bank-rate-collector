name: Dev NH e-joy repair patch

on:
  push:
    branches:
      - fix/nh-resumable-ejoy-max-rate-20260830

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nh-ejoy-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nh-resumable-ejoy-max-rate-20260830
      - name: Apply deterministic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          path = Path('src/rate_monitor/collectors/nh_local/resumable.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, 'from dataclasses import dataclass\n', 'from dataclasses import dataclass, replace\n', 'dataclasses import')
          text = replace_once(text, 'NH_ACQUISITION_CONTRACT_VERSION = 1\n', 'NH_ACQUISITION_CONTRACT_VERSION = 2\n', 'contract version')
          text = replace_once(
              text,
              '                result = service.materialize(complete)\n                self._set_fetch_notes(guard)\n                return result\n',
              '                result = service.materialize(complete)\n                self._set_fetch_notes(guard)\n                return self._attach_ejoy_metadata(result)\n',
              'complete materialize return',
          )
          text = replace_once(
              text,
              '        plan: list[dict[str, Any]] = []\n        for outlet in outlets:\n            for product in products:\n',
              '        plan: list[dict[str, Any]] = []\n        ordered_products = products\n        if ProductType.TERM_DEPOSIT in products:\n            ordered_products = (ProductType.TERM_DEPOSIT,) + tuple(\n                product for product in products if product != ProductType.TERM_DEPOSIT\n            )\n        for outlet in outlets:\n            for product in ordered_products:\n',
              'TERM-first plan',
          )
          marker = '    def _checkpoint_state(self) -> dict[str, Any]:\n'
          helper = '''    @staticmethod\n    def _attach_ejoy_metadata(\n        artifacts: list[RawArtifactData],\n    ) -> list[RawArtifactData]:\n        """Rebuild same-BRC e-joy evidence from immutable TERM raw bytes.\n\n        Resumable v1 checkpointed detail artifacts before the G2 e-joy metadata\n        carrier existed.  The raw TERM response is still authoritative evidence, so\n        v2 derives the same metadata envelope used by ``NhLocalAdapter.fetch`` after\n        materialization.  Raw bytes, filenames and schema fingerprints are untouched.\n        If a BRC has no TERM artifact, max-rate derivation stays fail-closed.\n        """\n        term_screen = parser.SCREEN_BY_PRODUCT[ProductType.TERM_DEPOSIT]\n        options_by_brc: dict[str, list[dict[str, Any]]] = {}\n        warnings_by_brc: dict[str, list[str]] = {}\n\n        for artifact in artifacts:\n            meta = artifact.request_meta\n            if meta.get("kind") != "rate" or meta.get("screen") != term_screen:\n                continue\n            outlet = dict(meta.get("outlet") or {})\n            brc = str(outlet.get("brc") or "")\n            if not brc:\n                raise CheckpointIncompatibleError(\n                    "NH TERM artifact의 BRC metadata가 없어 e-joy evidence를 연결할 수 없다"\n                )\n            options, warnings = parser.extract_ejoy_options(\n                artifact.content.decode("utf-8", "replace"), brc=brc\n            )\n            options_by_brc[brc] = options\n            if warnings:\n                warnings_by_brc[brc] = warnings\n\n        enriched: list[RawArtifactData] = []\n        for artifact in artifacts:\n            meta = artifact.request_meta\n            if meta.get("kind") != "rate":\n                enriched.append(artifact)\n                continue\n            outlet = dict(meta.get("outlet") or {})\n            brc = str(outlet.get("brc") or "")\n            if not brc:\n                raise CheckpointIncompatibleError(\n                    "NH rate artifact의 BRC metadata가 없어 e-joy evidence를 연결할 수 없다"\n                )\n            request_meta = dict(meta)\n            request_meta["ejoy_options"] = options_by_brc.get(brc, [])\n            warnings = warnings_by_brc.get(brc)\n            if warnings:\n                request_meta["ejoy_warnings"] = warnings\n            else:\n                request_meta.pop("ejoy_warnings", None)\n            enriched.append(replace(artifact, request_meta=request_meta))\n        return enriched\n\n'''
          text = replace_once(text, marker, helper + marker, 'ejoy helper insertion')
          text = replace_once(
              text,
              '        return service.materialize(terminal)\n',
              '        return self._attach_ejoy_metadata(service.materialize(terminal))\n',
              'guard partial materialize return',
          )
          path.write_text(text, encoding='utf-8')

          adapter = Path('src/rate_monitor/collectors/nh_local/adapter.py')
          text = adapter.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    # 상세표에 최고우대금리 열이 없다 (정찰 §0.2).\n    provides_max_rate = False\n',
              '    # 일반 상세표에 최고우대금리 열은 없지만, 공식 e-joy 가산행을\n    # 대상상품 기본금리와 연결한 internet variant에는 source-derived max_rate가 있다.\n    provides_max_rate = True\n',
              'NH max-rate capability',
          )
          adapter.write_text(text, encoding='utf-8')

          gate = Path('scripts/verify_gate.py')
          text = gate.read_text(encoding='utf-8')
          needle = '''        # 업권이 섞이면 화면이 둘을 못 가른다.\n        wrong_sector = conn.execute(\n'''
          addition = '''        if source_id == "nh_local":\n            invalid_nh_max = conn.execute(\n                "SELECT COUNT(*) FROM rate_observations o"\n                "  JOIN collection_runs r  ON r.id = o.run_id"\n                "  JOIN product_variants v ON v.id = o.variant_id"\n                "  JOIN products p         ON p.id = v.product_id"\n                " WHERE r.source_id = ? AND o.max_rate IS NOT NULL"\n                "   AND (v.join_channel <> 'internet'"\n                "     OR o.option_source_locator IS NULL OR o.option_source_locator = ''"\n                "     OR o.raw_preference_text <> ?"\n                "     OR p.name NOT IN ('정기예탁금','복리식정기예탁금','정기적금','자유적립적금','자유로부금')"\n                "     OR json_extract(o.source_detail_json, '$.max_rate_method')"\n                "        <> 'base_plus_source_declared_ejoy_add_rate'"\n                "     OR json_extract(o.source_detail_json, '$.ejoy_add_rate') IS NULL)",\n                (source_id, parser.EJOY_APPLICABILITY_NOTE),\n            ).fetchone()[0]\n            filled_nh_max = conn.execute(\n                "SELECT COUNT(o.max_rate) FROM rate_observations o"\n                "  JOIN collection_runs r ON r.id = o.run_id"\n                " WHERE r.source_id = ?",\n                (source_id,),\n            ).fetchone()[0]\n            check(\n                invalid_nh_max == 0,\n                "NH e-joy max_rate provenance 계약",\n                f"채워진 값 {filled_nh_max}건 / 계약 위반 {invalid_nh_max}건",\n            )\n\n        # 업권이 섞이면 화면이 둘을 못 가른다.\n        wrong_sector = conn.execute(\n'''
          text = replace_once(text, needle, addition, 'NH provenance gate')
          text = replace_once(
              text,
              '    from rate_monitor.cli import ADAPTERS\n',
              '    from rate_monitor.cli import ADAPTERS\n    from rate_monitor.collectors.nh_local import parser\n',
              'gate parser import',
          )
          gate.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_nh_resumable_ejoy_contract.py')
          test_path.write_text(r'''from decimal import Decimal\n\nfrom rate_monitor.collectors.nh_local import parser\nfrom rate_monitor.collectors.nh_local.resumable import (\n    NH_ACQUISITION_CONTRACT_VERSION,\n    NhResumableAdapter,\n)\nfrom rate_monitor.domain.enums import ProductType\nfrom rate_monitor.domain.schemas import RawArtifactData\n\n\ndef _artifact(screen: str, product: ProductType, body: str) -> RawArtifactData:\n    return RawArtifactData(\n        artifact_type="html",\n        content=body.encode(),\n        filename=f"{screen}.html",\n        request_meta={\n            "kind": "rate",\n            "screen": screen,\n            "product_type": product.value,\n            "as_of": "2026-08-30",\n            "outlet": {\n                "brc": "123456",\n                "name": "테스트농협",\n                "address": "부산광역시 테스트구",\n            },\n        },\n        schema_fingerprint="fixture",\n        source_role="secondary_official",\n        trust_level="official_direct",\n    )\n\n\nEJOY_NOTE_HTML = (\n    "- 대상예금 &lt;거치식&gt; 정기예탁금, 복리식 정기예탁금 "\n    "&lt;적립식&gt; 정기적금, 자유적립 적금, 자유로 부금 "\n    "- 상품별 금리 + 우대금리 적용"\n)\n\n\ndef _table(*rows: str) -> str:\n    return "<table><caption>금리 상세정보</caption><tbody>" + "".join(rows) + "</tbody></table>"\n\n\ndef _row(product: str, term: str, rate: str, note: str = "기준", interest: str = "고정금리") -> str:\n    return (\n        f"<tr><td>{product}</td><td>{term}</td><td>{rate}</td>"\n        f"<td>{note}</td><td>{interest}</td></tr>"\n    )\n\n\ndef test_resumable_v2_rebuilds_ejoy_metadata_for_same_brc_term_and_savings() -> None:\n    term = _artifact(\n        parser.SCREEN_BY_PRODUCT[ProductType.TERM_DEPOSIT],\n        ProductType.TERM_DEPOSIT,\n        _table(\n            _row("정기예탁금", "12개월 이상~24개월 미만", "3.0%"),\n            _row(\n                parser.EJOY_PRODUCT_NAME,\n                "12개월 이상~24개월 미만",\n                "0.2%",\n                EJOY_NOTE_HTML,\n            ),\n        ),\n    )\n    savings = _artifact(\n        parser.SCREEN_BY_PRODUCT[ProductType.INSTALLMENT_SAVINGS],\n        ProductType.INSTALLMENT_SAVINGS,\n        _table(_row("정기적금", "12개월 이상~24개월 미만", "3.1%")),\n    )\n\n    enriched = NhResumableAdapter._attach_ejoy_metadata([term, savings])\n    assert enriched[0].content == term.content\n    assert enriched[1].content == savings.content\n    assert enriched[0].request_meta["ejoy_options"] == enriched[1].request_meta["ejoy_options"]\n    assert enriched[0].request_meta["ejoy_options"][0]["add_rate"] == "0.2"\n\n    outlet = parser.NhOutlet("123456", "테스트농협", "부산광역시 테스트구")\n    term_rows, _ = parser.parse_detail(\n        term.content.decode(),\n        outlet=outlet,\n        product_type=ProductType.TERM_DEPOSIT,\n        as_of=__import__('datetime').date(2026, 8, 30),\n        ejoy_options=enriched[0].request_meta["ejoy_options"],\n    )\n    savings_rows, _ = parser.parse_detail(\n        savings.content.decode(),\n        outlet=outlet,\n        product_type=ProductType.INSTALLMENT_SAVINGS,\n        as_of=__import__('datetime').date(2026, 8, 30),\n        ejoy_options=enriched[1].request_meta["ejoy_options"],\n    )\n    assert any(row.max_rate == Decimal("3.2") for row in term_rows)\n    assert any(row.max_rate == Decimal("3.3") for row in savings_rows)\n\n\ndef test_resumable_without_term_evidence_stays_fail_closed() -> None:\n    savings = _artifact(\n        parser.SCREEN_BY_PRODUCT[ProductType.INSTALLMENT_SAVINGS],\n        ProductType.INSTALLMENT_SAVINGS,\n        _table(_row("정기적금", "12개월 이상~24개월 미만", "3.1%")),\n    )\n    enriched = NhResumableAdapter._attach_ejoy_metadata([savings])\n    assert enriched[0].request_meta["ejoy_options"] == []\n\n\ndef test_resumable_contract_version_bumped_for_ejoy_metadata_contract() -> None:\n    assert NH_ACQUISITION_CONTRACT_VERSION == 2\n\n\ndef test_resumable_plan_forces_term_before_savings() -> None:\n    adapter = object.__new__(NhResumableAdapter)\n    outlet = parser.NhOutlet("123456", "테스트농협", "부산광역시 테스트구")\n    plan = adapter._build_plan(\n        [outlet],\n        (ProductType.INSTALLMENT_SAVINGS, ProductType.TERM_DEPOSIT),\n    )\n    assert [item["product"] for item in plan] == [\n        ProductType.TERM_DEPOSIT,\n        ProductType.INSTALLMENT_SAVINGS,\n    ]\n'''.replace('\\n', '\n'), encoding='utf-8')
          PY

      - name: Run focused checks
        shell: bash
        run: |
          python -m compileall -q src scripts tests/test_nh_resumable_ejoy_contract.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rate_monitor/collectors/nh_local/resumable.py \
                  src/rate_monitor/collectors/nh_local/adapter.py \
                  scripts/verify_gate.py \
                  tests/test_nh_resumable_ejoy_contract.py
          git commit -m "fix: restore NH e-joy max rates in resumable collection [nh-ejoy-patched]"
          git push origin HEAD:fix/nh-resumable-ejoy-max-rate-20260830
