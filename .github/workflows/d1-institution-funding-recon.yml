name: Diagnostic — Institution funding D1 recon

# Read-only discovery for FSC/Data.go.kr institution-level funding data.
# Never opens the production DB and never publishes Strategy output.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/market-funding-stage0-d0-20260827
    paths:
      - scripts/d1_institution_funding_data_go_recon.py
      - .github/workflows/d1-institution-funding-recon.yml

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Probe FSC institution funding APIs
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: uv run python scripts/d1_institution_funding_data_go_recon.py

      - name: Check credential never reached report
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          set -euo pipefail
          REPORT=docs/source-recon/market-funding-d1-institution-recon.json
          if [ -n "${DATA_GO_KR_SERVICE_KEY}" ] && grep -qF "$DATA_GO_KR_SERVICE_KEY" "$REPORT"; then
            echo "::error::DATA_GO_KR_SERVICE_KEY leaked into $REPORT"
            exit 1
          fi
          echo "credential leak: 0"

      - uses: actions/upload-artifact@v4
        with:
          name: market-funding-d1-institution-recon
          path: docs/source-recon/market-funding-d1-institution-recon.json
          retention-days: 14
