name: Temporary — apply PR 80 lint fix

on:
  push:
    branches: [agent/collection-sla-schedule]
    paths:
      - .github/workflows/dev-pr80-lint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collection-sla-schedule
      - name: Apply lint fix
        run: python scripts/dev_pr80_lint_fix.py
      - name: Check diff
        run: |
          git diff --check
          git diff --exit-code -- scripts/dev_pr80_lint_fix.py .github/workflows/dev-pr80-lint-fix.yml
      - name: Commit lint fix
        run: |
          git config user.name "dekt-oss"
          git config user.email "degackt@gmail.com"
          git add tests/test_collection_sla_api.py
          git commit -m "test: wrap SLA handler regression fixtures"
          git push origin HEAD:agent/collection-sla-schedule
