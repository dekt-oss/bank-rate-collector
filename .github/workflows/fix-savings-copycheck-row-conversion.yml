name: Fix savings copycheck row conversion

on:
  push:
    branches:
      - "fix/savings-bank-funding-identity-13-20260901"
    paths:
      - ".github/workflows/fix-savings-copycheck-row-conversion.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/savings-bank-funding-identity-13-20260901
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Patch, validate, and commit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_savings_bank_identity_reconciliation.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "return [{key: row[key] for key in row} for row in result]": "return [dict(row) for row in result]",
              "return [{key: row[key] for key in row} for row in rows]": "return [dict(row) for row in rows]",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one match: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff check scripts/validate_savings_bank_identity_reconciliation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_savings_bank_identity_reconciliation.py
          git diff --cached --check
          git commit -m "fix: convert sqlite rows safely in copycheck"
          git push origin HEAD:fix/savings-bank-funding-identity-13-20260901
