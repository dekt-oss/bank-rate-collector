name: Temporary — apply PR 79 review follow-up

on:
  push:
    branches: [agent/nh-transient-resilience]
    paths:
      - .github/workflows/dev-pr79-review-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nh-transient-resilience
      - name: Apply review follow-up
        run: |
          python scripts/dev_review_followup_79.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/rate_monitor/collectors/nh_local/adapter.py')
          text = path.read_text(encoding='utf-8')
          bad = '        reasons = ", \\.join(\n'
          good = '        reasons = ", ".join(\n'
          if text.count(bad) != 1:
              raise SystemExit(f'expected one escaped join artifact, got {text.count(bad)}')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          for name in ('tests/test_nh_local_retry.py', 'tests/test_repeat_guard.py'):
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Static check
        run: |
          python -m py_compile src/rate_monitor/collectors/nh_local/adapter.py tests/test_nh_local_retry.py
          git diff --check
          git diff --exit-code -- scripts/dev_review_followup_79.py .github/workflows/dev-pr79-review-followup.yml
          git status --short
      - name: Commit follow-up
        run: |
          git config user.name "dekt-oss"
          git config user.email "degackt@gmail.com"
          git add src/rate_monitor/collectors/nh_local/adapter.py tests/test_nh_local_retry.py tests/test_repeat_guard.py
          git commit -m "fix: broaden NH transient retry evidence"
          git push origin HEAD:agent/nh-transient-resilience
