name: Mutual finance identity evidence one-shot

on:
  push:
    branches: ["analysis/strategy-mutual-finance-evidence"]
    paths:
      - ".github/workflows/mutual-finance-identity-evidence-one-shot.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12 && uv sync --locked
      - name: Restore production copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          mkdir -p work evidence/site
          BACKEND=$(uv run python -c "from pathlib import Path; from rate_monitor.services.storage_service import load_backend; print(load_backend(Path('config/storage.yaml')).backend.value)")
          if [ "$BACKEND" = "r2" ]; then uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3; else git fetch origin rate-data --depth=1 && git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz && gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3; fi
          RATE_MONITOR_DB_URL=sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3 uv run alembic upgrade head
          uv run rate-monitor build-site --db work/rate_monitor.sqlite3 --template web/templates/site.html --out evidence/site
      - name: Verify current strategy identity key against mutual-finance rows
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          from rate_monitor.services.strategy_contract_service import _product_id_index, _row_key, _decode

          table=json.loads(Path('evidence/site/data/table.json').read_text(encoding='utf-8'))
          cols={n:i for i,n in enumerate(table['columns'])}
          idx=_product_id_index(Path('work/rate_monitor.sqlite3'))
          sectors={'kfcc','cu','nh_local'}; terms={6,12,24,36}
          stats=defaultdict(Counter); ids=defaultdict(set)
          for row in table['rows']:
              sector=_decode(table,'sector',row[cols['sector']])
              ptype=_decode(table,'product_type',row[cols['product_type']])
              term=row[cols['term_months']]
              if sector not in sectors or ptype!='term_deposit' or term not in terms: continue
              pid=idx.get(_row_key(table,row))
              stats[sector]['rows']+=1
              stats[sector]['matched' if pid else 'unmatched']+=1
              stats[sector][f'term_{term}']+=1
              if pid: ids[sector].add(pid)
          result={s:{**stats[s], 'unique_product_ids':len(ids[s])} for s in sorted(sectors)}
          Path('evidence/identity-match.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mutual-finance-identity-evidence
          path: evidence/identity-match.json
