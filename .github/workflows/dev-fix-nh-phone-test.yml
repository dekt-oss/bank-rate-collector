name: Fix NH phone test robustness

on:
  push:
    branches:
      - agent/nh-resumable-acquisition-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nh-resumable-acquisition-v1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Patch flaky phone persistence assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_nh_local_collection.py')
          text = path.read_text(encoding='utf-8')
          old = '''        blob = " ".join(\n            str(value)\n            for row in (*outlets, *institutions)\n            for value in row.__dict__.values()\n        )\n        assert "033-" not in blob and "051-" not in blob\n'''
          new = '''        persisted_text = [\n            value\n            for row in (*outlets, *institutions)\n            for column in row.__table__.columns\n            if column.name != "id" and not column.name.endswith("_id")\n            if isinstance((value := getattr(row, column.name)), str)\n        ]\n        assert all("033-" not in value and "051-" not in value for value in persisted_text)\n'''
          if text.count(old) != 1:
              raise SystemExit('phone assertion block mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          uv sync --locked
          uv run ruff check src tests scripts
          uv run pytest -q tests/test_nh_local_collection.py
          uv run pytest -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-fix-nh-phone-test.yml
          git add -A
          git commit -m "test: avoid UUID collision in NH phone assertion"
          git push origin HEAD:agent/nh-resumable-acquisition-v1
