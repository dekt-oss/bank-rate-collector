name: DEV audit NH Matrix production

on:
  push:
    branches: ["ops/audit-nh-matrix-production-20260831"]
    paths:
      - ".github/workflows/dev-audit-nh-matrix-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Restore authoritative production DB locally
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          test -s work/rate_monitor.sqlite3
      - name: Apply migrations
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head
      - name: Audit NH Rate x Funding Matrix
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from rate_monitor.services.strategy_service import build_strategy_summary

          summary = build_strategy_summary(Path("work/rate_monitor.sqlite3"))
          matrix = summary["rate_funding_matrix"]
          sector = matrix["sectors"]["nh_local"]
          keys = (
              "label",
              "analysis_month",
              "status",
              "available",
              "funding_growth_6m_institutions",
              "historical_rate_institutions",
              "current_rate_institutions",
              "current_rate_institutions_not_carried_back",
              "paired_institutions",
              "pair_coverage_ratio",
          )
          result = {key: sector.get(key) for key in keys}
          print("NH_MATRIX_AUDIT=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
          assert result["analysis_month"] == "2025-12", result
          assert int(result.get("current_rate_institutions") or result.get("current_rate_institutions_not_carried_back") or 0) > 0, result
          assert result["status"] == "historical_rate_unavailable", result
          assert result["available"] is False, result
          assert int(result.get("paired_institutions") or 0) == 0, result
          print("NH_MATRIX_TEMPORAL_GATE=PASS")
          PY
