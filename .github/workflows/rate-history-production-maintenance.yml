name: R2 rate-history production maintenance

# Canonical maintenance is deliberately manual. A reviewed operator must pin both
# the main commit and the immutable R2 object observed immediately before dispatch.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact 40-character origin/main SHA approved for maintenance"
        required: true
        type: string
      expected_current_object_key:
        description: "Exact R2 current snapshot object key approved for compaction"
        required: true
        type: string
      confirmation:
        description: "Type COMPACT_CANONICAL_R2"
        required: true
        type: string

concurrency:
  group: rate-data-writer
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_CURRENT_OBJECT_KEY: ${{ inputs.expected_current_object_key }}
      CONFIRMATION: ${{ inputs.confirmation }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_REGION: ${{ vars.R2_REGION }}
      STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Require approved current main and explicit confirmation
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "COMPACT_CANONICAL_R2"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          test "${#EXPECTED_MAIN_SHA}" = 40
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$REMOTE_MAIN" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Require authoritative R2 backend
        run: |
          set -euo pipefail
          BACKEND=$(uv run python - <<'PY'
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          print(load_backend(Path("config/storage.yaml")).backend.value)
          PY
          )
          test "$BACKEND" = "r2"

      - name: Pin current pointer and durable rollback record
        run: |
          set -euo pipefail
          mkdir -p work
          uv run python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from rate_monitor.services.storage_service import (
              CURRENT_KEY,
              R2Config,
              SnapshotRef,
              open_store,
          )

          ROLLBACK_PREFIX = "state/rollbacks/rate-history/"
          config = R2Config.from_env()
          assert config is not None
          store = open_store(config)
          raw = store.get(CURRENT_KEY)
          before = SnapshotRef.from_json(raw)
          expected = os.environ["EXPECTED_CURRENT_OBJECT_KEY"]
          if before.object_key != expected:
              raise RuntimeError(
                  f"expected current object mismatch: expected={expected!r} actual={before.object_key!r}"
              )
          if not store.exists(before.object_key):
              raise RuntimeError(f"current snapshot object is missing: {before.object_key}")

          Path("work/r2-current-before.json").write_bytes(raw)
          rollback_key = f"{ROLLBACK_PREFIX}{os.environ['GITHUB_RUN_ID']}.json"
          rollback = {
              "created_at": datetime.now(UTC).isoformat(),
              "expected_main_sha": os.environ["EXPECTED_MAIN_SHA"],
              "current": json.loads(before.to_json()),
          }
          rollback_raw = (json.dumps(rollback, sort_keys=True) + "\n").encode()
          store.put(rollback_key, rollback_raw)
          if store.get(rollback_key) != rollback_raw:
              raise RuntimeError("rollback record readback mismatch")
          Path("work/r2-rollback-key.txt").write_text(rollback_key + "\n", encoding="utf-8")
          print(json.dumps({"rollback_key": rollback_key, "object_key": before.object_key}))
          PY

      - name: Restore and audit authoritative R2 copy
        run: |
          set -euo pipefail
          date +%s > work/restore-start.txt
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          date +%s > work/restore-end.txt
          test -s work/rate_monitor.sqlite3
          uv run python scripts/rate_history_audit.py \
            --db work/rate_monitor.sqlite3 \
            --output work/rate-history-before-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/rate-history-before-audit.json").read_text())
          assert report["integrity_check"] == "ok", report
          assert report["foreign_key_check_violations"] == 0, report
          PY

      - name: Apply migrations to runner-local copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Plan compaction without mutation
        run: |
          set -euo pipefail
          date +%s > work/dry-run-start.txt
          uv run python scripts/rate_history_compact.py \
            --db work/rate_monitor.sqlite3 \
            --output work/rate-history-compaction-dry-run.json
          date +%s > work/dry-run-end.txt
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/rate-history-compaction-dry-run.json").read_text())
          assert report["candidate_rows"] > 0, report
          assert not report["reference_blockers"], report
          assert 0 < report["estimated_rate_observations_after"] < report["before_rate_observations"]
          PY

      - name: Compact local copy into separate candidate
        run: |
          set -euo pipefail
          date +%s > work/apply-start.txt
          uv run python scripts/rate_history_compact.py \
            --db work/rate_monitor.sqlite3 \
            --apply \
            --vacuum-into work/rate_monitor_compacted.sqlite3 \
            --output work/rate-history-compaction-apply.json
          date +%s > work/apply-end.txt
          test -s work/rate_monitor_compacted.sqlite3

      - name: Validate candidate before any canonical pointer change
        run: |
          set -euo pipefail
          uv run rate-monitor validate --db work/rate_monitor_compacted.sqlite3 \
            | tee work/compacted-validate.txt
          uv run python scripts/rate_history_audit.py \
            --db work/rate_monitor_compacted.sqlite3 \
            --output work/rate-history-compacted-audit.json
          sha256sum work/rate_monitor_compacted.sqlite3 | awk '{print $1}' \
            > work/candidate-sha256.txt
          python - <<'PY'
          import json
          from pathlib import Path

          apply = json.loads(Path("work/rate-history-compaction-apply.json").read_text())
          audit = json.loads(Path("work/rate-history-compacted-audit.json").read_text())
          candidate_sha256 = Path("work/candidate-sha256.txt").read_text().strip()
          assert apply["compacted_sha256"] == candidate_sha256, apply
          assert apply["integrity_check"] == "ok", apply
          assert apply["foreign_key_errors"] == 0, apply
          assert apply["after_current_observations"] == apply["before_current_observations"], apply
          assert audit["integrity_check"] == "ok", audit
          assert audit["foreign_key_check_violations"] == 0, audit
          assert audit["semantic_redundant_rows"] == 0, audit
          assert audit["rate_observations"] == apply["after_rate_observations"], (audit, apply)
          PY

      - name: Recheck pinned current pointer immediately before upload
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          from rate_monitor.services.storage_service import CURRENT_KEY, R2Config, open_store
          config = R2Config.from_env()
          assert config is not None
          store = open_store(config)
          before = Path("work/r2-current-before.json").read_bytes()
          if store.get(CURRENT_KEY) != before:
              raise RuntimeError("current pointer changed while candidate was being built")
          PY
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$REMOTE_MAIN" = "$EXPECTED_MAIN_SHA"

      - name: Upload candidate and move canonical pointer
        id: publish
        run: |
          set -euo pipefail
          uv run rate-monitor storage upload \
            --db work/rate_monitor_compacted.sqlite3 \
            --preserve-snapshot "$EXPECTED_CURRENT_OBJECT_KEY" \
            | tee work/r2-upload.txt

      - name: Read back and verify canonical candidate
        run: |
          set -euo pipefail
          uv run rate-monitor storage restore --dest work/rate_monitor_r2_readback.sqlite3 \
            | tee work/r2-readback.txt
          cmp -s work/rate_monitor_compacted.sqlite3 work/rate_monitor_r2_readback.sqlite3
          uv run rate-monitor validate --db work/rate_monitor_r2_readback.sqlite3 \
            | tee work/r2-readback-validate.txt
          uv run python scripts/rate_history_audit.py \
            --db work/rate_monitor_r2_readback.sqlite3 \
            --output work/rate-history-r2-readback-audit.json
          sha256sum work/rate_monitor_r2_readback.sqlite3 | awk '{print $1}' \
            > work/readback-sha256.txt
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from rate_monitor.services.storage_service import CURRENT_KEY, R2Config, SnapshotRef, open_store

          before = SnapshotRef.from_json(Path("work/r2-current-before.json").read_bytes())
          audit = json.loads(Path("work/rate-history-r2-readback-audit.json").read_text())
          candidate_sha256 = Path("work/candidate-sha256.txt").read_text().strip()
          readback_sha256 = Path("work/readback-sha256.txt").read_text().strip()
          assert readback_sha256 == candidate_sha256
          assert audit["integrity_check"] == "ok", audit
          assert audit["foreign_key_check_violations"] == 0, audit
          assert audit["semantic_redundant_rows"] == 0, audit

          config = R2Config.from_env()
          assert config is not None
          store = open_store(config)
          after_raw = store.get(CURRENT_KEY)
          after = SnapshotRef.from_json(after_raw)
          assert after.object_key != before.object_key, (before, after)
          assert store.exists(before.object_key), "pre-compaction rollback snapshot was not retained"
          rollback_key = Path("work/r2-rollback-key.txt").read_text().strip()
          assert store.exists(rollback_key), rollback_key
          Path("work/r2-current-after.json").write_bytes(after_raw)
          print(json.dumps({
              "candidate_sha256": candidate_sha256,
              "readback_sha256": readback_sha256,
              "old_object_key": before.object_key,
              "new_object_key": after.object_key,
          }))
          PY

      - name: Final canonical R2 verification
        run: |
          set -euo pipefail
          uv run rate-monitor storage verify | tee work/r2-final-verify.txt
          uv run rate-monitor storage status | tee work/r2-final-status.txt

      - name: Rollback current pointer after a failed post-upload check
        if: ${{ failure() && steps.publish.outcome == 'success' }}
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from rate_monitor.services.storage_service import (
              CURRENT_KEY,
              R2Config,
              SnapshotRef,
              _guard_current_main_writer,
              open_store,
          )

          before_raw = Path("work/r2-current-before.json").read_bytes()
          before = SnapshotRef.from_json(before_raw)
          config = R2Config.from_env()
          assert config is not None
          store = open_store(config)
          assert store.exists(before.object_key), before.object_key
          _guard_current_main_writer()
          store.put(CURRENT_KEY, before.to_json().encode("utf-8"))
          restored = SnapshotRef.from_json(store.get(CURRENT_KEY))
          assert restored.object_key == before.object_key, (restored, before)
          print(f"restored current pointer to {before.object_key}")
          PY

      - name: Record timings
        if: always()
        run: |
          python - <<'PY' | tee work/rate-history-production-timing.txt
          from pathlib import Path
          def elapsed(name):
              start = Path(f"work/{name}-start.txt")
              end = Path(f"work/{name}-end.txt")
              if start.exists() and end.exists():
                  return int(end.read_text()) - int(start.read_text())
              return None
          for phase in ("restore", "dry-run", "apply"):
              print(f"{phase}_seconds={elapsed(phase)}")
          PY

      - name: Upload production maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-history-production-maintenance-${{ github.run_id }}
          path: |
            work/r2-current-before.json
            work/r2-current-after.json
            work/r2-rollback-key.txt
            work/rate-history-before-audit.json
            work/rate-history-compaction-dry-run.json
            work/rate-history-compaction-apply.json
            work/rate-history-compacted-audit.json
            work/rate-history-r2-readback-audit.json
            work/candidate-sha256.txt
            work/readback-sha256.txt
            work/compacted-validate.txt
            work/r2-upload.txt
            work/r2-readback.txt
            work/r2-readback-validate.txt
            work/r2-final-verify.txt
            work/r2-final-status.txt
            work/rate-history-production-timing.txt
          retention-days: 30
          if-no-files-found: warn
