name: P0 interest evidence

on:
  push:
    branches: [agent/p0-interest-method-evidence]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore production database copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          uv run alembic upgrade head

      - name: Baseline NH interest distribution
        run: |
          uv run python - <<'PY' | tee work/baseline.txt
          import sqlite3
          conn = sqlite3.connect('work/rate_monitor.sqlite3')
          print('current NH variants/observations by interest_method')
          for row in conn.execute('''
              SELECT v.interest_method,
                     COUNT(DISTINCT v.id) AS variants,
                     COUNT(o.id) AS current_observations
                FROM product_variants v
                JOIN products p ON p.id = v.product_id
                JOIN institutions i ON i.id = p.institution_id
                LEFT JOIN rate_observations o
                  ON o.variant_id = v.id AND o.valid_to IS NULL
               WHERE i.sector = 'nh_local'
               GROUP BY v.interest_method
               ORDER BY v.interest_method
          '''):
              print(*row, sep='\t')
          PY

      - name: Collect NH Busan from live source
        run: |
          set -euo pipefail
          uv run rate-monitor collect \
            --source nh_local \
            --scope 부산 \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw | tee work/collect.txt

      - name: Extract source interest evidence
        run: |
          uv run python - <<'PY' | tee work/evidence.txt
          from collections import Counter
          from pathlib import Path
          from rate_monitor.collectors.nh_local.parser import DETAIL_CAPTION, parse_rate_table

          buckets = Counter()
          patterns = Counter()
          files = 0
          rows = 0
          for path in Path('data/raw').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if DETAIL_CAPTION not in text:
                  continue
              try:
                  entries = parse_rate_table(text)
              except Exception:
                  continue
              files += 1
              for entry in entries:
                  rows += 1
                  evidence = ' '.join((entry.product_name, entry.note, entry.interest_note)).strip()
                  if '복리' in evidence:
                      bucket = 'compound_explicit'
                  elif '단리' in evidence:
                      bucket = 'simple_explicit'
                  else:
                      bucket = 'no_explicit_method'
                  buckets[bucket] += 1
                  key = (bucket, entry.product_name, entry.note, entry.interest_note)
                  patterns[key] += 1

          print(f'detail_files\t{files}')
          print(f'parsed_rows\t{rows}')
          for key in ('compound_explicit', 'simple_explicit', 'no_explicit_method'):
              print(f'{key}\t{buckets[key]}')
          print('\nTOP DISTINCT PATTERNS')
          for (bucket, product, note, interest), count in patterns.most_common(80):
              print(f'{count}\t{bucket}\t{product}\t{note}\t{interest}')
          PY

      - name: Validate copied database
        run: uv run rate-monitor validate --db work/rate_monitor.sqlite3 | tee work/validate.txt

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: p0-interest-evidence-${{ github.run_id }}
          path: |
            work/baseline.txt
            work/collect.txt
            work/evidence.txt
            work/validate.txt
          retention-days: 7
