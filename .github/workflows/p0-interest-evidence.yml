name: P0 interest evidence

on:
  push:
    branches: [agent/p0-interest-method-evidence]

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Download latest successful nationwide collection artifact
        uses: actions/download-artifact@v4
        with:
          name: collection-run-31326136819
          path: prior-run
          github-token: ${{ github.token }}
          run-id: 31326136819

      - name: Extract nationwide NH interest evidence
        run: |
          mkdir -p work
          uv run python - <<'PY' | tee work/evidence.txt
          from collections import Counter
          from pathlib import Path
          from rate_monitor.collectors.nh_local.parser import parse_rate_table

          buckets = Counter()
          patterns = Counter()
          files = 0
          rows = 0
          for path in Path('prior-run').rglob('rate_*_SFDPW016*.html'):
              if not path.name.endswith(('SFDPW0163R.html', 'SFDPW0164R.html')):
                  continue
              text = path.read_text(encoding='utf-8')
              entries = parse_rate_table(text)
              files += 1
              for entry in entries:
                  rows += 1
                  product = entry.product_name
                  note = entry.note
                  interest = entry.interest_note
                  evidence = ' '.join((product, note, interest)).strip()
                  if '단리' in product or '단리' in note:
                      bucket = 'simple_explicit'
                  elif '복리' in product or '월복리' in note:
                      bucket = 'compound_direct'
                  elif '복리' in evidence:
                      bucket = 'compound_reference_only'
                  else:
                      bucket = 'no_explicit_method'
                  buckets[bucket] += 1
                  patterns[(bucket, product, note, interest)] += 1

          print(f'detail_files\t{files}')
          print(f'parsed_rows\t{rows}')
          for key in (
              'compound_direct',
              'simple_explicit',
              'compound_reference_only',
              'no_explicit_method',
          ):
              print(f'{key}\t{buckets[key]}')
          print('\nDISTINCT PATTERNS')
          for (bucket, product, note, interest), count in patterns.most_common():
              print(f'{count}\t{bucket}\t{product}\t{note}\t{interest}')
          PY

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: p0-interest-nationwide-${{ github.run_id }}
          path: work/evidence.txt
          retention-days: 7
