name: Finalize P1 collection health

on:
  push:
    branches: [agent/p1-collection-health]
    paths: [.github/workflows/p1-health-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-collection-health
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked

      - name: Apply evidence-backed taxonomy and clean temporary files
        run: |
          uv run python scripts/_tmp_finalize_health_taxonomy.py
          rm scripts/_tmp_finalize_health_taxonomy.py
          rm .github/workflows/p1-health-warning-evidence.yml
          rm .github/workflows/p1-health-finalize.yml

      - name: Diff sanity and lint
        run: |
          git diff --check
          uv run ruff check .
          node --check web/api/health.js

      - name: Targeted tests
        run: |
          uv run pytest -q \
            tests/test_collection_health.py \
            tests/test_collection_health_ui.py \
            tests/test_snapshot_and_dashboard.py \
            tests/test_site_service.py \
            tests/test_collect_endpoint.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Empty DB migration
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/empty.sqlite3
        run: |
          mkdir -p work
          uv run alembic upgrade head

      - name: Restore production state read-only
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3

      - name: Apply current migration to production copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Verify final health semantics on production copy
        run: |
          uv run python - <<'PY'
          import json, sqlite3
          from rate_monitor.services.source_health_service import build_collection_health
          conn = sqlite3.connect('work/rate_monitor.sqlite3')
          try:
              h = build_collection_health(conn)
          finally:
              conn.close()
          print(json.dumps(h, ensure_ascii=False, indent=2))
          by = {s['source_id']: s for s in h['sources']}
          for source in ('cu', 'fsb', 'nh_local'):
              assert by[source]['run_health']['signal'] == 'green', (source, by[source])
              assert by[source]['latest_attempt']['actionable_warning_count'] == 0, by[source]
          assert any(r['code'] == 'EMPTY_QUERY_RESULT' and r['severity'] == 'info' for r in by['cu']['reasons'])
          assert any(r['code'] == 'RATELESS_SOURCE_ROW' and r['severity'] == 'info' for r in by['fsb']['reasons'])
          assert any(r['code'] == 'TERM_NOT_PROVIDED' and r['severity'] == 'info' for r in by['nh_local']['reasons'])
          assert h['counts']['red'] == 0
          PY

      - name: Snapshot and validate
        run: |
          uv run rate-monitor snapshot \
            --db work/rate_monitor.sqlite3 \
            --publish-db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json
          uv run rate-monitor validate --db publish/rate_monitor.sqlite3

      - name: Build dashboard, export and public site
        run: |
          uv run rate-monitor build-dashboard \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/dashboard.html \
            --site site/index.html \
            --summary publish/summary.json
          uv run rate-monitor export \
            --db publish/rate_monitor.sqlite3 \
            --out publish/export
          uv run rate-monitor build-site \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out site-public \
            --export-dir publish/export

      - name: Verify P1-A gate publish-only
        run: |
          mkdir -p data/raw
          uv run python scripts/verify_gate.py \
            --db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json \
            --summary publish/summary.json \
            --site site/index.html \
            --raw-root data/raw \
            --no-collection

      - name: Commit final reviewed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: classify expected source warnings as informational"
          git push origin HEAD:agent/p1-collection-health
