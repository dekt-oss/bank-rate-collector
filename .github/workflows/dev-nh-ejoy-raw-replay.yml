name: Dev NH production raw replay gate
on:
  push:
    branches: [fix/nh-resumable-ejoy-max-rate-20260830]
permissions:
  actions: read
  contents: write
jobs:
  replay:
    if: ${{ !contains(github.event.head_commit.message, '[nh-raw-replayed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nh-resumable-ejoy-max-rate-20260830
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12 && uv sync --locked
      - name: Download authoritative-run raw evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 32870399581 -n nh-attempt-1-32870399581 -D replay
      - name: Replay e-joy derivation from immutable raw bytes
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path
          from rate_monitor.collectors.nh_local import parser
          from rate_monitor.collectors.nh_local.resumable import NhResumableAdapter
          from rate_monitor.domain.enums import ProductType
          from rate_monitor.domain.schemas import RawArtifactData

          root = Path('replay')
          files = list(root.rglob('*.html'))
          rate_files = [p for p in files if p.name.startswith('rate_')]
          if len(files) != 9743:
              raise SystemExit(f'expected 9743 production HTML artifacts, got {len(files)}')

          artifacts = []
          base_rows = 0
          ejoy_source_rows = 0
          for p in rate_files:
              m = re.fullmatch(r'rate_(.+)_(SFDPW016[34]R)\.html', p.name)
              if not m:
                  continue
              brc, screen = m.groups()
              product = (
                  ProductType.TERM_DEPOSIT
                  if screen == parser.SCREEN_BY_PRODUCT[ProductType.TERM_DEPOSIT]
                  else ProductType.INSTALLMENT_SAVINGS
              )
              body = p.read_bytes()
              entries = parser.parse_rate_table(body.decode('utf-8', 'replace'))
              base_rows += len(entries)
              ejoy_source_rows += sum(e.product_name == parser.EJOY_PRODUCT_NAME for e in entries)
              artifacts.append(RawArtifactData(
                  artifact_type='html', content=body, filename=p.name,
                  request_meta={
                      'kind': 'rate', 'screen': screen, 'product_type': product.value,
                      'as_of': '2026-08-26',
                      'outlet': {'brc': brc, 'name': f'BRC-{brc}', 'address': '검증용'},
                  },
                  schema_fingerprint=parser.schema_fingerprint(body.decode('utf-8','replace')),
                  source_role='secondary_official', trust_level='official_direct',
              ))

          enriched = NhResumableAdapter._attach_ejoy_metadata(artifacts)
          option_brcs = {
              a.request_meta['outlet']['brc']
              for a in enriched
              if a.request_meta.get('ejoy_options')
          }
          derived = 0
          invalid = 0
          for a in enriched:
              meta = a.request_meta
              product = ProductType(meta['product_type'])
              outlet = parser.NhOutlet(meta['outlet']['brc'], meta['outlet']['name'], meta['outlet']['address'])
              rows, _ = parser.parse_detail(
                  a.content.decode('utf-8','replace'), outlet=outlet, product_type=product,
                  as_of=date(2026, 8, 26), ejoy_options=meta.get('ejoy_options'),
              )
              for row in rows:
                  if row.max_rate is None:
                      continue
                  derived += 1
                  if not (
                      row.join_channel == 'internet'
                      and row.option_source_locator
                      and row.preference_raw == parser.EJOY_APPLICABILITY_NOTE
                      and row.extra.get('max_rate_method') == 'base_plus_source_declared_ejoy_add_rate'
                      and row.extra.get('ejoy_add_rate') is not None
                      and row.base_rate is not None
                      and row.max_rate >= row.base_rate
                  ):
                      invalid += 1

          report = {
              'production_run': 32870399581,
              'html_artifacts': len(files),
              'rate_artifacts': len(artifacts),
              'base_rows': base_rows,
              'ejoy_source_rows': ejoy_source_rows,
              'ejoy_brcs': len(option_brcs),
              'derived_internet_max_rows': derived,
              'invalid_derived_rows': invalid,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          Path('nh-ejoy-replay-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          if base_rows != 198670:
              raise SystemExit(f'base row reconciliation failed: {base_rows}')
          if ejoy_source_rows != 19472:
              raise SystemExit(f'e-joy source reconciliation failed: {ejoy_source_rows}')
          if derived <= 0:
              raise SystemExit('no derived internet max rows')
          if invalid:
              raise SystemExit(f'invalid derived rows: {invalid}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nh-ejoy-production-raw-replay-${{ github.run_id }}
          path: nh-ejoy-replay-report.json
          retention-days: 30
      - name: Mark replay completion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "test: replay production NH raw e-joy evidence [nh-raw-replayed]"
          git push origin HEAD:fix/nh-resumable-ejoy-max-rate-20260830
