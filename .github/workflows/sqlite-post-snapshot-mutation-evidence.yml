name: SQLite post-snapshot mutation evidence

on:
  push:
    branches:
      - "verify/special-offer-canonical-*"
    paths:
      - ".github/workflows/sqlite-post-snapshot-mutation-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlite-post-snapshot-mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  RATE_MONITOR_STRATEGY_DASHBOARD: "1"

jobs:
  pinpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked

      - name: Restore current canonical candidate only
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work publish/export site site-public evidence
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          cp work/rate_monitor.sqlite3 publish/rate_monitor.sqlite3
          sha256sum publish/rate_monitor.sqlite3 | tee evidence/00-restored.sha256

      - name: Validate stored data
        run: |
          set -euo pipefail
          uv run rate-monitor validate --db publish/rate_monitor.sqlite3
          sha256sum publish/rate_monitor.sqlite3 | tee evidence/10-after-validate.sha256

      - name: Build dashboard
        run: |
          set -euo pipefail
          uv run rate-monitor build-dashboard \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/dashboard.html \
            --site site/index.html \
            --summary publish/summary.json
          sha256sum publish/rate_monitor.sqlite3 | tee evidence/20-after-dashboard.sha256

      - name: Export full dataset
        run: |
          set -euo pipefail
          uv run rate-monitor export \
            --db publish/rate_monitor.sqlite3 \
            --out publish/export
          sha256sum publish/rate_monitor.sqlite3 | tee evidence/30-after-export.sha256

      - name: Build public site
        run: |
          set -euo pipefail
          uv run rate-monitor build-site \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out site-public \
            --export-dir publish/export
          sha256sum publish/rate_monitor.sqlite3 | tee evidence/40-after-site.sha256

      - name: Classify first mutation
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('evidence').glob('*.sha256'))
          rows = []
          for path in files:
              digest = path.read_text().split()[0]
              rows.append((path.name, digest))
              print(path.name, digest)
          if rows:
              base = rows[0][1]
              changed = [name for name, digest in rows[1:] if digest != base]
              print('first_changed_checkpoint=', changed[0] if changed else 'none')
          PY

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-post-snapshot-mutation-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: evidence/
