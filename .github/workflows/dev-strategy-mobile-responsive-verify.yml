name: DEV Strategy mobile responsive production-data verify

on:
  push:
    branches: ["feat/strategy-ux-mobile-responsive-20260831"]
    paths:
      - ".github/workflows/dev-strategy-mobile-responsive-verify.yml"
      - "src/rate_monitor/services/strategy_mobile_responsive_presentation.py"
      - "src/rate_monitor/services/dashboard_ui_refinement_presentation.py"
      - "scripts/strategy_mobile_responsive_smoke.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked

      - name: Restore authoritative production DB locally
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          test -s work/rate_monitor.sqlite3

      - name: Migrate local copy and build Strategy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
          RATE_MONITOR_STRATEGY_DASHBOARD: "1"
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run rate-monitor build-site \
            --db work/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out work/site-public
          test -s work/site-public/strategy.html
          grep -q 'id="strategy-mobile-responsive-style"' work/site-public/strategy.html
          grep -q 'data-strategy-mobile-responsive' work/site-public/strategy.html

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run 1440 430 390 Chrome audit
        env:
          STRATEGY_PREVIEW_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.61.1
          node --check scripts/strategy_mobile_responsive_smoke.js
          python -m http.server 4173 --directory work/site-public > work/mobile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/strategy.html >/dev/null && break
            sleep 1
          done
          node scripts/strategy_mobile_responsive_smoke.js

      - name: Upload screenshots and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-mobile-responsive-${{ github.run_id }}
          path: |
            work/strategy-mobile-responsive-*.png
            work/mobile-http.log
          retention-days: 30
          if-no-files-found: warn
