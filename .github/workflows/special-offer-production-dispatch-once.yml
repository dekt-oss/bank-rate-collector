name: Special-offer production collection dispatch once

on:
  push:
    branches:
      - "verify/special-offer-canonical-*"
    paths:
      - ".github/workflows/special-offer-production-dispatch-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing canonical savings-bank collection
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_PASSWORD"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/dispatches" \
            -f ref=main \
            -f 'inputs[password]'="$DASHBOARD_PASSWORD" \
            -f 'inputs[manual_target]'='저축은행만'
          echo "Dispatched existing collect.yml on main with manual_target=저축은행만."
          echo "No direct database or R2 write is performed by this workflow."
