name: Checkpoint retention (R2)

# NH·KFCC 수집 체크포인트를 수집일 기준 7일만 남기고 지운다
# (docs/ops/20261016-r2-storage-audit.md §4).
#
# 체크포인트는 같은 수집일 안에서 끊긴 수집을 이어받는 데만 쓴다. 원본 파일은
# 수집 실행의 GitHub 아티팩트(data/raw/, 90일)에도 남고, 파싱된 금리는 운영 DB에
# 들어간다. 그래서 지난 날짜의 체크포인트를 지워도 복구·데이터 구축에 쓰이는
# 것이 없다.
#
# 지우는 범위는 `checkpoints/v1/` 아래, 수집일이 7일보다 오래됐고 운영 DB
# 포인터가 그 뒤에 갱신된 날짜 폴더뿐이다. state/·raw-evidence/는 건드리지
# 않으므로 rate-data-writer 그룹에 넣지 않는다. 지금 도는 수집의 날짜 폴더는
# 7일보다 새것이라 겹치지 않는다.
#
# 정기 실행은 실제로 지운다. 손으로 돌릴 때는 apply를 켜야만 지운다.

on:
  schedule:
    # 매일 12:13 KST. 아침 체인의 실제 수집(20:45 KST~)과 겹치지 않는 시각.
    - cron: "13 3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "실제로 지운다. 끄면 지울 목록만 본다"
        type: boolean
        required: false
        default: false

concurrency:
  group: checkpoint-retention
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_REGION: ${{ vars.R2_REGION }}
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Clean up expired checkpoint cycles
        run: |
          set -euo pipefail
          ARGS=(--retention-days 7 --json work/checkpoint-retention.json)
          if [ "$APPLY" = "true" ]; then
            ARGS+=(--apply)
          fi
          echo "apply=$APPLY"
          uv run rate-monitor-checkpoint cleanup "${ARGS[@]}" > /dev/null
          uv run python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("work/checkpoint-retention.json"))
          mode = "삭제" if not r["dry_run"] else "dry-run(목록만)"
          print(f"## Checkpoint retention — {mode}")
          print(f"- 기준일 {r['today_kst']}, 보관 {r['retention_days']}일, 이 날짜 이전 정리: {r['cutoff_kst']}")
          print(f"- 운영 DB 스냅샷 날짜: {r['canonical_snapshot_date_kst']}")
          print(f"- 대상: {len(r['candidate_cycles'])}개 수집일, {r['candidate_objects']:,}개 객체, "
                f"{r['candidate_bytes'] / 1e9:.2f} GB")
          print(f"- 실제 삭제: {r['deleted_objects']:,}개")
          print(f"- 남긴 최근 7일분: {r['kept_recent_bytes'] / 1e9:.2f} GB")
          if r["held_uncommitted_cycles"]:
              print(f"- 운영 DB 미반영이라 보류: {r['held_uncommitted_cycles']}")
          if r["skipped_unparseable"]:
              print(f"- 날짜를 읽지 못해 건너뜀: {len(r['skipped_unparseable'])}개")
          PY

      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-retention-${{ github.run_id }}
          path: work/checkpoint-retention.json
          retention-days: 90
          if-no-files-found: warn
