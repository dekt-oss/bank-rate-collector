name: Collect rates

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "권역코드 (030300=저축은행, 020000=은행). 공백으로 구분"
        required: false
        default: "030300"
      kfcc_scope:
        description: "새마을금고 수집 범위 (config/regions.yaml)"
        type: choice
        required: false
        default: "전국"
        options: ["전국", "수도권", "부산"]
      skip_kfcc:
        description: "새마을금고 수집을 건너뛴다"
        type: boolean
        required: false
        default: false
      skip_fsb:
        description: "저축은행중앙회 수집을 건너뛴다"
        type: boolean
        required: false
        default: false
      skip_cu:
        description: "신협 수집을 건너뛴다"
        type: boolean
        required: false
        default: false
      nh_local_scope:
        description: "농·축협 수집 범위. 전국은 약 2시간 43분이라 기본이 아니다"
        type: choice
        required: false
        default: "부산"
        options: ["부산", "수도권", "전국"]
      skip_finlife_bank:
        description: "시중은행(참고지표) 수집을 건너뛴다"
        type: boolean
        required: false
        default: false
      skip_bok:
        description: "한국은행 기준금리(참고지표) 수집을 건너뛴다"
        type: boolean
        required: false
        default: false
      skip_nh_local:
        description: "농·축협 수집을 건너뛴다"
        type: boolean
        required: false
        default: false
      accept_volume_drop:
        description: "물량 급감을 알고도 발행한다 (원천이 정말 줄었을 때만)"
        type: boolean
        required: false
        default: false
  schedule:
    # 월·수·금 02:00 KST = 17:00 UTC 전날 → 일·화·목(0,2,4)
    #
    # 요일이 하루 밀리는 것이 이 표기의 함정이다. 02:00 KST는 UTC로
    # 전날 17:00이므로 월요일 새벽은 **일요일** 17:00 UTC다. 실제로 계산해
    # 확인했다: 2026-08-10(월) 02:00 KST → 08-09(일) 17:00 UTC,
    # 08-12(수) → 08-11(화), 08-14(금) → 08-13(목).
    #
    # 전국 한 바퀴가 약 2시간 30분이라 04:30 KST쯤 끝난다.
    - cron: "0 17 * * 0,2,4"

# rate-data 브랜치의 단일 writer.
# 각 실행이 하나의 금리 관측 이력이므로 진행 중인 작업을 취소하지 않고
# 직렬로 대기시킨다 (명세서 v3.1 §10.2).
concurrency:
  group: rate-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      # 이전 실행의 DB를 이어받는다. 없으면 새로 만든다.
      # 어느 저장소에서 상태를 이어받는가 (선행 수정안 v1 §2.3).
      #
      #   github_legacy · r2_migration   rate-data에서 받는다
      #   r2                             R2에서 받는다. 실패하면 여기서 죽는다
      #
      # r2_migration에서 복원을 GitHub에 두는 것이 이 단계의 핵심이다.
      # R2가 아직 시험 저장소이므로, 거기서 받기 시작하면 시험이 아니라
      # 이미 전환한 것이다.
      - name: Decide storage backend
        id: storage
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          # 이 단계도 시크릿을 봐야 한다. load_backend가 backend를 읽자마자
          # 시크릿이 있는지 검사하기 때문이다 — 없으면 여기서 죽는다.
          #
          # 2026-08-06 run 31073323624에서 실제로 죽었다. backend를 r2_migration
          # 으로 바꾼 뒤 첫 실행이었고, 아래 단계들에만 시크릿을 넣어 뒀다.
          # "값을 읽기만 하는 단계"로 보였지만 검사도 같이 한다.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          c = load_backend(Path('config/storage.yaml'))
          print(c.backend.value)
          import sys; print(f'backend={c.backend.value} ({c.source})', file=sys.stderr)
          ")
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "상태 저장소: $BACKEND"

      - name: Restore previous database
        env:
          # 비밀은 Secrets, 나머지는 Variables에 있다. 다섯 개가 모두
          # 차지 않으면 storage_service가 "일부만 있다"로 실패한다 —
          # 절반만 채운 채 R2에 올라간다고 믿는 상태를 막기 위한 것이다.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work

          if [ "${{ steps.storage.outputs.backend }}" = "r2" ]; then
            # 실패하면 그대로 죽는다. 빈 DB로 시작하는 것보다 낫다 (§6.4).
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
            exit 0
          fi

          if git ls-remote --exit-code --heads origin rate-data >/dev/null 2>&1; then
            git fetch origin rate-data --depth=1
            git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz 2>/dev/null || true
            if [ -f latest/rate_monitor.sqlite3.gz ]; then
              gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3
              echo "이전 DB 복원: $(stat -c%s work/rate_monitor.sqlite3) bytes"
            fi
            rm -rf latest
          else
            echo "rate-data 브랜치 없음. 새 DB로 시작한다."
          fi

      - name: Apply migrations
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      # 금감원 비교공시 — 저축은행 (030300).
      #
      # 같은 API가 시중은행(020000)도 주지만 **소스를 따로 세운다** (v4 §6.2).
      # 하나의 실행이 하나의 source_id에 대응해야 실행 이력과 저장된 행이
      # 어긋나지 않는다.
      - name: Collect finlife savings bank
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
        run: |
          uv run rate-monitor collect \
            --source finlife_savings_bank \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --groups ${{ inputs.groups || '030300' }}

      # 금감원 비교공시 — 시중은행 (020000). 참고지표다 (v4 §6.4).
      #
      # DB에는 저장하되 메인 비교표에는 안 올린다. 전국 공시라 부산 구·군에
      # 연결할 수 없다. 20초쯤 걸린다.
      - name: Collect finlife bank
        if: ${{ inputs.skip_finlife_bank != true }}
        continue-on-error: true
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
        run: |
          uv run rate-monitor collect \
            --source finlife_bank \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --groups 020000

      # 한국은행 기준금리. 금융상품이 아니라 참고지표다 (v4 §7).
      #
      # 저장 표가 market_indicators로 따로다. 값이 몇 달씩 안 바뀌므로
      # 같은 날짜를 두 번 쌓지 않고, 안 바뀌면 no_change로 끝난다.
      # 요청 1회, 몇 초다.
      - name: Collect BOK base rate
        if: ${{ inputs.skip_bok != true }}
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          uv run rate-monitor collect \
            --source bok_ecos \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw

      # 저축은행중앙회. 저축은행 1차 원천이다 (명세서 v3 §7.2).
      #
      # finlife와 같은 저축은행을 보지만 가입방법·우대조건 3종·만기후이율·
      # 상품 링크가 더 온다. 둘 다 본점 기준 공시라 구·군 단위는 어느 쪽에서도
      # 나오지 않는다.
      #
      # 요청량은 명부 6 + 화면 2 × (GET 1 + 페이지 4) = 약 16회다. 기간마다
      # 나누지 않는다 — 한 행에 전 기간이 함께 온다.
      #
      # 이용약관을 확인하지 못해 policy_status가 unknown이다. 차단되면
      # SourceBlockedError로 끝나므로 continue-on-error로 둔다.
      - name: Collect FSB
        if: ${{ inputs.skip_fsb != true }}
        continue-on-error: true
        run: |
          uv run rate-monitor collect \
            --source fsb \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw

      # 신협. 지역과 최고 우대금리를 동시에 주는 유일한 원천이다
      # (docs/source-recon/cu.md §1).
      #
      # 지역을 지정하지 않으면 전국을 한 번에 받는다. 요청량은 화면 2 ×
      # 기간 4 × 페이지이고, 전국 기준 약 970페이지 ≈ 16분이다.
      #
      # 이용약관을 확인하지 못해 policy_status가 review다.
      - name: Collect CU
        if: ${{ inputs.skip_cu != true }}
        continue-on-error: true
        run: |
          uv run rate-monitor collect \
            --source cu \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw

      # 새마을금고. 수집 범위는 config/regions.yaml의 이름으로 고른다.
      #
      # 지역 목록은 `r2`를 비워 한 지역을 요청 한 번에 받는다. 1초 간격이므로
      # 걸리는 시간은 금고 수가 정한다 (명세서 v3 §7.3.8).
      #
      #   부산   목록  1 + 금고   137 × 상품군 2 =   275회  ≈  5분
      #   수도권 목록  3 + 금고   ~500 × 2       = ~1,000회 ≈ 17분
      #   전국   목록 17 + 금고 1,260 × 2       = 2,537회  ≈ 42분
      #
      # 기본은 전국이다. 부산은 수집 단위가 아니라 조회 화면의 필터일 뿐이고,
      # 전국이 들어와야 지역 간 비교가 성립한다. 매일 2,537회가 부담이면
      # workflow_dispatch에서 범위를 좁혀 돌린다.
      #
      # 차단되면 SourceBlockedError로 끝나고 종료코드가 1이 된다. 저축은행
      # 수집분까지 버리지 않도록 continue-on-error로 두고, 결과는 게이트와
      # 대시보드에서 실행 상태로 드러난다.
      - name: Collect KFCC
        if: ${{ inputs.skip_kfcc != true }}
        continue-on-error: true
        run: |
          uv run rate-monitor collect \
            --source kfcc \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --scope "${{ inputs.kfcc_scope || '부산' }}"

      # 농·축협. 원천에 지역 요청 인자가 없어 명부가 통째로 오고, 범위는
      # 받아 온 주소로 거른다 (docs/source-recon/nh-local.md §0.2).
      #
      # 그래서 요청 수가 점포 수에 정비례한다. 1초 간격 기준:
      #
      #   부산   명부 1 + 점포   119 × 화면 2 =   239회 ≈  4분
      #   수도권 명부 1 + 점포 1,224 × 2      = 2,449회 ≈ 41분
      #   전국   명부 1 + 점포 4,871 × 2      = 9,743회 ≈ 2시간 43분
      #
      # **기본이 전국이 아닌 유일한 원천이다.** 전국은 작업 하나에 담기 어렵고
      # 원천에 주는 부담도 아직 재 본 적이 없다. v4 §5.3의 부산 세로절단부터
      # 돌리고, 넓히는 것은 사람이 명시할 때만이다.
      #
      # 입출금식 화면(SFDPW0162R)은 아직 안 받는다. 실물을 본 적이 없다.
      - name: Collect NH local
        if: ${{ inputs.skip_nh_local != true }}
        continue-on-error: true
        run: |
          uv run rate-monitor collect \
            --source nh_local \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --scope "${{ inputs.nh_local_scope || '부산' }}"

      # CLI 명령으로 부른다. 예전에는 워크플로우 안에 파이썬을 heredoc으로
      # 박아 썼는데, 그 코드는 테스트도 lint도 닿지 않는 자리였다.
      - name: Snapshot
        run: |
          uv run rate-monitor snapshot \
            --db work/rate_monitor.sqlite3 \
            --publish-db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json

      - name: Validate stored data
        run: uv run rate-monitor validate --db publish/rate_monitor.sqlite3

      - name: Build dashboard
        run: |
          uv run rate-monitor build-dashboard \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/dashboard.html \
            --site site/index.html \
            --summary publish/summary.json

      # 전체 조사 내용을 파일로도 낸다. 화면을 열지 않고 받아갈 수 있어야 한다.
      - name: Export full dataset
        run: |
          uv run rate-monitor export \
            --db publish/rate_monitor.sqlite3 \
            --out publish/export

      # 배포용 공개 사이트. 화면과 데이터를 나눠 쓴다.
      #
      # 위 build-dashboard가 만드는 두 화면은 금리표를 HTML 안에 통째로
      # 박는다. 아티팩트로 공유할 때는 그래야 했지만, 진짜 호스팅에 올리면
      # 전국 16만 8천 행이 8MB짜리 페이지가 되어 열 때마다 그만큼을 받는다.
      # 이쪽은 페이지를 가볍게 두고 금리표를 data/table.json으로 뺀다.
      #
      # export 다음에 둔다 — 내려받기 링크가 가리킬 파일이 먼저 있어야 한다.
      - name: Build public site
        run: |
          uv run rate-monitor build-site \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out site-public \
            --export-dir publish/export

      - name: Verify P1-A gate
        run: |
          uv run python scripts/verify_gate.py \
            --db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json \
            --summary publish/summary.json \
            --site site/index.html \
            --raw-root data/raw

      - name: Upload raw and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-run-${{ github.run_id }}
          # 2026-08-05 실측: 400을 요청하면 저장소 상한에 걸려 90으로 낮춰진다.
          #   "Retention days cannot be greater than the maximum allowed
          #    retention set within the repository. Using 90 instead."
          # 실제 적용값을 그대로 적어 기대와 현실이 어긋나지 않게 한다.
          retention-days: 90
          path: |
            data/raw/
            publish/manifest.json
            publish/summary.json
            publish/export/
          if-no-files-found: warn

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: site/
          if-no-files-found: warn

      - name: Upload public site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-${{ github.run_id }}
          path: site-public/
          if-no-files-found: warn

      # rate-data에 실을 것만 모은다.
      #
      # 여기 넣지 않기로 한 것들 (선행 수정안 v1 §2.2, 2026-08-06 실측):
      #
      #   publish/export/*.json   50.67 MiB. 같은 내용이 site-public에
      #                           rates.json.gz 0.94 MiB로 이미 들어간다
      #   publish/export/*.csv    16.57 MiB. site-public/data/rates.csv와
      #                           바이트가 같다. 두 벌 실을 이유가 없다
      #   site/*.html             5.51 MiB × 2. 데이터를 통째로 박아 넣던
      #                           아티팩트 시절 화면이다. site-public이
      #                           대신하고, 원본은 Actions 아티팩트로 남는다
      #
      # 합계 94 MiB를 덜어낸다. 셋 다 Actions 아티팩트(90일)에는 그대로
      # 올라가므로 필요하면 거기서 받는다.
      # R2에 상태를 올린다.
      #
      #   github_legacy   건너뛴다
      #   r2_migration    올린다. 실패해도 수집은 계속된다 — 이 단계에서
      #                   R2는 시험 저장소이고 GitHub DB가 공식 원본이다
      #   r2              올린다. 실패하면 발행하지 않는다 (§6.4)
      - name: Upload state to R2
        if: steps.storage.outputs.backend != 'github_legacy'
        continue-on-error: ${{ steps.storage.outputs.backend == 'r2_migration' }}
        env:
          # 비밀은 Secrets, 나머지는 Variables에 있다. 다섯 개가 모두
          # 차지 않으면 storage_service가 "일부만 있다"로 실패한다 —
          # 절반만 채운 채 R2에 올라간다고 믿는 상태를 막기 위한 것이다.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: uv run rate-monitor storage upload --db publish/rate_monitor.sqlite3

      - name: Stage rate-data payload
        env:
          BACKEND: ${{ steps.storage.outputs.backend }}
        run: |
          set -euo pipefail

          rm -rf stage && mkdir -p stage/latest
          # r2 모드에서는 SQLite를 Git에 두지 않는다. 그게 전환의 정의다.
          if [ "$BACKEND" = "r2" ]; then
            echo "backend=r2 — 상태 DB를 rate-data에 싣지 않는다"
          else
            gzip -kf publish/rate_monitor.sqlite3
            cp publish/rate_monitor.sqlite3.gz stage/latest/
          fi
          cp publish/manifest.json publish/summary.json stage/latest/
          # 호스팅에 그대로 올릴 수 있는 한 벌.
          cp -r site-public stage/site-public
          # Vercel은 **저장소 루트**의 vercel.json만 읽는다. main에 있는
          # 원본을 rate-data 루트로 옮겨 놓지 않으면, 저장소를 파이썬 앱으로
          # 잡고 진입점을 찾다 실패한다 (2026-08-06 실측).
          cp vercel.json stage/vercel.json

      # 한도를 넘으면 여기서 멈춘다. push가 거부되는 것보다 낫다 —
      # 발행이 멈추면 어제 사이트가 그대로 살아 있다.
      - name: Size gate
        run: uv run python scripts/size_gate.py stage --backend ${{ steps.storage.outputs.backend }}

      # 물량이 급감했으면 발행하지 않는다.
      #
      # 2026-08-06 run 31069995734에서 finlife가 4,010 → 1,075행(26.8%)이
      # 됐는데 상태 success, validate 12/12, P1-A 게이트 15/15로 전부
      # 통과해 그대로 발행됐다. 기존 검사는 "이 실행 안에서 앞뒤가 맞는가"만
      # 봐서, 절반이 사라져도 남은 절반끼리는 완벽하게 맞는다.
      #
      # 원천이 정말 줄었을 때는 --accept로 한 번 통과시킨다.
      - name: Volume gate
        run: |
          uv run python scripts/volume_gate.py \
            --summary publish/summary.json \
            ${{ inputs.accept_volume_drop && '--accept' || '' }}

      - name: Publish to rate-data branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 이전 SHA를 기억해 둔다. --force-with-lease가 이 값을 쓴다 —
          # 그 사이 누가 밀어 넣었으면 덮어쓰지 않고 실패한다.
          git fetch origin rate-data --depth=1 2>/dev/null || true
          BEFORE=$(git rev-parse origin/rate-data 2>/dev/null || echo "")

          for attempt in 1 2; do
            # 매번 부모 없는 커밋을 새로 만든다.
            #
            # 예전에는 기존 브랜치 위에 커밋을 쌓았다. 파일을 지우는 커밋을
            # 올려도 과거 커밋의 blob은 그대로 남아서, 수집할 때마다 50 MiB
            # 짜리 DB가 한 벌씩 저장소에 영구히 쌓였다. 이력이 필요한 것은
            # main이지 데이터 브랜치가 아니다.
            #
            # 임시 브랜치를 먼저 지운다. 재시도 때 이미 있으면
            # `a branch named 'rate-data-new' already exists`로 죽는다.
            git checkout -q --detach 2>/dev/null || true
            git branch -D rate-data-new 2>/dev/null || true
            git checkout -q --orphan rate-data-new
            git rm -rq --cached . 2>/dev/null || true

            find . -maxdepth 1 -mindepth 1 \
              -not -name .git -not -name work -not -name publish \
              -not -name stage -not -name data -not -name site \
              -not -name site-public -exec rm -rf {} +
            rm -rf latest site site-public vercel.json
            cp -r stage/latest stage/site-public .
            cp stage/vercel.json .

            git add -f latest site-public vercel.json
            git commit -q -m "data: 수집 결과 갱신 (run ${{ github.run_id }})"

            if [ -n "$BEFORE" ]; then
              PUSH="git push --force-with-lease=rate-data:$BEFORE origin HEAD:rate-data"
            else
              PUSH="git push origin HEAD:rate-data"
            fi
            if $PUSH; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi

            echo "push 거부됨. 원격이 그 사이 바뀌었다. 재시도 $attempt"
            git fetch origin rate-data --depth=1 2>/dev/null || true
            BEFORE=$(git rev-parse origin/rate-data 2>/dev/null || echo "")
          done
          echo "push 재시도 실패" >&2
          exit 1

      # GitHub Pages 배포 자리.
      # 이 저장소는 private이라 Pages 공개 범위가 확정되지 않았다.
      # 공개 범위 결정 후 활성화한다 (명세서 v3.1 §5).
      # - name: Deploy to Pages
      #   uses: actions/deploy-pages@v4
