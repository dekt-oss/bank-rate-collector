name: 수집 — 일반·새마을금고

on:
  workflow_dispatch:
    inputs:
      password:
        description: "관리자 수집 암호"
        required: true
        default: ""
      manual_target:
        description: "실행 대상. 농·축협은 별도 '수집 — 농·축협' workflow에서 실행"
        type: choice
        required: true
        default: "일반 전체"
        options:
          - "일반 전체"
          - "저축은행만"
          - "신협만"
          - "새마을금고만"
          - "참고지표만"
          - "화면만 재발행"
      kfcc_scope:
        description: "[새마을금고만] 수집 범위 — 보통 전국"
        type: choice
        required: false
        default: "전국"
        options: ["전국", "수도권", "부산"]
      kfcc_resume_mode:
        description: "[새마을금고만] 재시작 방식 — 보통 auto, 같은 날 처음부터 다시 받을 때만 fresh"
        type: choice
        required: false
        default: "auto"
        options: ["auto", "fresh"]
      accept_volume_drop:
        description: "주의: 물량 급감 강제 승인 — 원천 데이터가 실제 줄었다고 확인한 경우만 체크"
        type: boolean
        required: false
        default: false

  # main 머지는 원천을 다시 긁지 않고 화면만 재발행한다.
  push:
    branches: [main]

  schedule:
    # 평일 00:17 KST = 15:17 UTC 전날. NH는 00:37 독립 workflow로 분리했다.
    - cron: "17 15 * * 0-4"
    # 평일 04:17 KST = 19:17 UTC 전날. 새마을금고만.
    - cron: "17 19 * * 0-4"

# 모든 수집 workflow가 같은 canonical DB/R2/rate-data writer 줄을 쓴다.
concurrency:
  group: rate-data-writer
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PUBLISH_ONLY: ${{ github.event_name == 'push' || inputs.manual_target == '화면만 재발행' }}
      KFCC_ONLY: ${{ github.event.schedule == '17 19 * * 0-4' || inputs.manual_target == '새마을금고만' }}
      SKIP_KFCC_THIS_RUN: ${{ github.event.schedule == '17 15 * * 0-4' || (github.event_name == 'workflow_dispatch' && inputs.manual_target != '새마을금고만') }}
    steps:
      - name: Check collect password
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED: ${{ secrets.DASHBOARD_PASSWORD }}
          GIVEN: ${{ inputs.password }}
        run: |
          if [ -z "${EXPECTED}" ]; then
            echo "::error::DASHBOARD_PASSWORD 시크릿이 없다."
            echo "::error::저장소 Settings → Secrets and variables → Actions에서 만든다."
            exit 1
          fi
          if [ "${GIVEN}" != "${EXPECTED}" ]; then
            echo "::error::수집 암호가 맞지 않는다. 관리자에게 확인한다."
            exit 1
          fi
          echo "암호 확인됨"

      - name: Show manual collection plan
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "수동 실행 대상: ${{ inputs.manual_target }}"
          if [ "${{ inputs.manual_target }}" = "새마을금고만" ]; then
            echo "새마을금고 범위: ${{ inputs.kfcc_scope }}"
            echo "새마을금고 재시작 방식: ${{ inputs.kfcc_resume_mode }}"
          fi
          echo "물량 급감 강제 승인: ${{ inputs.accept_volume_drop }}"

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Decide storage backend
        id: storage
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          c = load_backend(Path('config/storage.yaml'))
          print(c.backend.value)
          import sys; print(f'backend={c.backend.value} ({c.source})', file=sys.stderr)
          ")
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "상태 저장소: $BACKEND"

      - name: Restore previous database
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work

          if [ "${{ steps.storage.outputs.backend }}" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
            exit 0
          fi

          if git ls-remote --exit-code --heads origin rate-data >/dev/null 2>&1; then
            git fetch origin rate-data --depth=1
            git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz 2>/dev/null || true
            if [ -f latest/rate_monitor.sqlite3.gz ]; then
              gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3
              echo "이전 DB 복원: $(stat -c%s work/rate_monitor.sqlite3) bytes"
            fi
            rm -rf latest
          else
            echo "rate-data 브랜치 없음. 새 DB로 시작한다."
          fi

      - name: Apply migrations
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Collect finlife savings bank
        if: ${{ env.PUBLISH_ONLY != 'true' && env.KFCC_ONLY != 'true' && (github.event_name != 'workflow_dispatch' || inputs.manual_target == '일반 전체' || inputs.manual_target == '저축은행만') }}
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
        run: |
          uv run rate-monitor collect \
            --source finlife_savings_bank \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --groups 030300

      - name: Collect finlife bank
        if: ${{ env.PUBLISH_ONLY != 'true' && env.KFCC_ONLY != 'true' && (github.event_name != 'workflow_dispatch' || inputs.manual_target == '일반 전체' || inputs.manual_target == '참고지표만') }}
        continue-on-error: true
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
        run: |
          uv run rate-monitor collect \
            --source finlife_bank \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --groups 020000

      - name: Collect BOK base rate
        if: ${{ env.PUBLISH_ONLY != 'true' && env.KFCC_ONLY != 'true' && (github.event_name != 'workflow_dispatch' || inputs.manual_target == '일반 전체' || inputs.manual_target == '참고지표만') }}
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          uv run rate-monitor collect \
            --source bok_ecos \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw

      - name: Collect BOK deposit macro indicators
        if: ${{ env.PUBLISH_ONLY != 'true' && env.KFCC_ONLY != 'true' && (github.event_name != 'workflow_dispatch' || inputs.manual_target == '일반 전체' || inputs.manual_target == '참고지표만') }}
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          uv run python -m rate_monitor.collectors.bok_ecos.macro_cli \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw

      - name: Collect FSB
        if: ${{ env.PUBLISH_ONLY != 'true' && env.KFCC_ONLY != 'true' && (github.event_name != 'workflow_dispatch' || inputs.manual_target == '일반 전체' || inputs.manual_target == '저축은행만') }}
        continue-on-error: true
        run: |
          uv run rate-monitor collect \
            --source fsb \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw

      - name: Collect CU
        if: ${{ env.PUBLISH_ONLY != 'true' && env.KFCC_ONLY != 'true' && (github.event_name != 'workflow_dispatch' || inputs.manual_target == '일반 전체' || inputs.manual_target == '신협만') }}
        continue-on-error: true
        run: |
          uv run rate-monitor collect \
            --source cu \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw

      - name: Prepare KFCC checkpoint context
        id: kfcc_checkpoint
        if: ${{ env.PUBLISH_ONLY != 'true' && env.SKIP_KFCC_THIS_RUN != 'true' }}
        env:
          SCOPE: ${{ inputs.kfcc_scope }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          uv run rate-monitor-checkpoint prepare-context \
            --source kfcc \
            ${SCOPE:+--scope "$SCOPE"} \
            --json work/kfcc-checkpoint-context.json >/dev/null
          CYCLE_DATE=$(python -c "import json; print(json.load(open('work/kfcc-checkpoint-context.json'))['cycle_date_kst'])")
          FINGERPRINT=$(python -c "import json; print(json.load(open('work/kfcc-checkpoint-context.json'))['request_fingerprint'])")
          CONTRACT=$(python -c "import json; print(json.load(open('work/kfcc-checkpoint-context.json'))['acquisition_contract_version'])")
          echo "cycle_date=$CYCLE_DATE" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "contract_version=$CONTRACT" >> "$GITHUB_OUTPUT"

      - name: Collect KFCC
        id: collect_kfcc
        if: ${{ env.PUBLISH_ONLY != 'true' && env.SKIP_KFCC_THIS_RUN != 'true' }}
        continue-on-error: true
        env:
          SCOPE: ${{ inputs.kfcc_scope }}
          RESUME_MODE: ${{ inputs.kfcc_resume_mode || 'auto' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          uv run rate-monitor collect \
            --source kfcc \
            --resume "$RESUME_MODE" \
            --cycle-date "${{ steps.kfcc_checkpoint.outputs.cycle_date }}" \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            ${SCOPE:+--scope "$SCOPE"}

      - name: Decide KFCC recovery
        id: decide_kfcc_recovery
        if: ${{ steps.collect_kfcc.outcome == 'failure' }}
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          uv run rate-monitor-checkpoint recovery-decision \
            --source kfcc \
            --cycle-date "${{ steps.kfcc_checkpoint.outputs.cycle_date }}" \
            --request-fingerprint "${{ steps.kfcc_checkpoint.outputs.fingerprint }}" \
            --acquisition-contract-version "${{ steps.kfcc_checkpoint.outputs.contract_version }}" \
            --attempt-failed \
            --json work/kfcc-recovery-decision.json >/dev/null
          ELIGIBLE=$(python -c "import json; print(str(json.load(open('work/kfcc-recovery-decision.json'))['eligible']).lower())")
          REASON=$(python -c "import json; print(json.load(open('work/kfcc-recovery-decision.json'))['reason_code'])")
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "KFCC recovery eligible=$ELIGIBLE reason=$REASON"

      - name: Recover KFCC
        id: recover_kfcc
        if: ${{ steps.collect_kfcc.outcome == 'failure' && steps.decide_kfcc_recovery.outcome == 'success' && steps.decide_kfcc_recovery.outputs.eligible == 'true' }}
        continue-on-error: true
        env:
          SCOPE: ${{ inputs.kfcc_scope }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          uv run rate-monitor collect \
            --source kfcc \
            --resume auto \
            --cycle-date "${{ steps.kfcc_checkpoint.outputs.cycle_date }}" \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            ${SCOPE:+--scope "$SCOPE"}

      - name: Snapshot
        run: |
          uv run rate-monitor snapshot \
            --db work/rate_monitor.sqlite3 \
            --publish-db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json

      - name: Validate stored data
        run: uv run rate-monitor validate --db publish/rate_monitor.sqlite3

      - name: Build dashboard
        run: |
          uv run rate-monitor build-dashboard \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/dashboard.html \
            --site site/index.html \
            --summary publish/summary.json

      - name: Export full dataset
        run: |
          uv run rate-monitor export \
            --db publish/rate_monitor.sqlite3 \
            --out publish/export

      - name: Build public site
        run: |
          uv run rate-monitor build-site \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out site-public \
            --export-dir publish/export

      - name: Verify P1-A gate
        run: |
          SKIP_RAW=""
          if [ "${PUBLISH_ONLY}" = "true" ]; then
            SKIP_RAW="--no-collection"
          fi
          uv run python scripts/verify_gate.py \
            --db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json \
            --summary publish/summary.json \
            --site site/index.html \
            --raw-root data/raw \
            ${SKIP_RAW}

      - name: Upload raw and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-run-${{ github.run_id }}
          retention-days: 90
          path: |
            data/raw/
            publish/manifest.json
            publish/summary.json
            publish/export/
          if-no-files-found: warn

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: site/
          if-no-files-found: warn

      - name: Upload public site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-${{ github.run_id }}
          path: site-public/
          if-no-files-found: warn

      - name: Upload state to R2
        if: steps.storage.outputs.backend != 'github_legacy'
        continue-on-error: ${{ steps.storage.outputs.backend == 'r2_migration' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: uv run rate-monitor storage upload --db publish/rate_monitor.sqlite3

      - name: Stage rate-data payload
        env:
          BACKEND: ${{ steps.storage.outputs.backend }}
        run: |
          set -euo pipefail
          rm -rf stage && mkdir -p stage/latest
          if [ "$BACKEND" = "r2" ]; then
            echo "backend=r2 — 상태 DB를 rate-data에 싣지 않는다"
          else
            gzip -kf publish/rate_monitor.sqlite3
            cp publish/rate_monitor.sqlite3.gz stage/latest/
          fi
          cp publish/manifest.json publish/summary.json stage/latest/
          cp -r site-public stage/site-public
          cp vercel.json stage/vercel.json
          cp -r web/api stage/api

      - name: Size gate
        run: uv run python scripts/size_gate.py stage --backend ${{ steps.storage.outputs.backend }}

      - name: Volume gate
        run: |
          uv run python scripts/volume_gate.py \
            --summary publish/summary.json \
            ${{ inputs.accept_volume_drop && '--accept' || '' }}

      - name: Publish to rate-data branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin rate-data --depth=1 2>/dev/null || true
          BEFORE=$(git rev-parse origin/rate-data 2>/dev/null || echo "")

          for attempt in 1 2; do
            git checkout -q --detach 2>/dev/null || true
            git branch -D rate-data-new 2>/dev/null || true
            git checkout -q --orphan rate-data-new
            git rm -rq --cached . 2>/dev/null || true

            find . -maxdepth 1 -mindepth 1 \
              -not -name .git -not -name work -not -name publish \
              -not -name stage -not -name data -not -name site \
              -not -name site-public -exec rm -rf {} +
            rm -rf latest site site-public vercel.json api
            cp -r stage/latest stage/site-public stage/api .
            cp stage/vercel.json .

            git add -f latest site-public vercel.json api
            git commit -q -m "data: 수집 결과 갱신 (run ${{ github.run_id }})"

            if [ -n "$BEFORE" ]; then
              PUSH="git push --force-with-lease=rate-data:$BEFORE origin HEAD:rate-data"
            else
              PUSH="git push origin HEAD:rate-data"
            fi
            if $PUSH; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi

            echo "push 거부됨. 원격이 그 사이 바뀌었다. 재시도 $attempt"
            git fetch origin rate-data --depth=1 2>/dev/null || true
            BEFORE=$(git rev-parse origin/rate-data 2>/dev/null || echo "")
          done
          echo "push 재시도 실패" >&2
          exit 1
