name: verify — direct peer production calibration temp

on:
  push:
    branches: [feat/institution-funding-direct-peer-calibration-20260830]

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_REGION: ${{ vars.R2_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked

      - name: Restore authoritative production DB read-only copy
        run: |
          set -euo pipefail
          mkdir -p work publish
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          RATE_MONITOR_DB_URL=sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3 \
            uv run alembic upgrade head

      - name: Apply exact NH repair only to runner-local copy
        run: |
          uv run python -m rate_monitor.collectors.data_go_funding.cli \
            reconcile-nh-identity --db work/rate_monitor.sqlite3 \
            --json publish/local-nh-reconcile.json

      - name: Calibrate N=12,16,20 on real production population
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from rate_monitor.services.institution_funding_direct_peer_db import (
              build_direct_peer_calibration_report,
          )
          from rate_monitor.services.institution_funding_position_service import (
              build_institution_funding_positions,
          )

          db = Path('work/rate_monitor.sqlite3')
          positions = build_institution_funding_positions(db)
          nh = positions['sectors']['nh_local']
          assert nh['analysis_month'] == '2025-12', nh
          assert nh['coverage']['observed_institutions'] == 1082, nh['coverage']
          assert nh['coverage']['eligible_institutions'] == 1109, nh['coverage']

          report = build_direct_peer_calibration_report(
              db,
              candidate_counts=(12, 16, 20),
          )
          nh_report = report['sectors']['nh_local']
          assert nh_report['population_count'] == 1082, nh_report
          assert nh_report['growth_6m_available'] == 1082, nh_report
          assert set(nh_report['candidates']) == {'12', '16', '20'}
          Path('publish/direct-peer-calibration.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False))
          PY

      - name: Upload compact calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-peer-calibration-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            publish/local-nh-reconcile.json
            publish/direct-peer-calibration.json
