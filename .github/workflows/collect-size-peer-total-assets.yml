name: 수집 — Size Peer 총자산

on:
  workflow_dispatch:
    inputs:
      password:
        description: "관리자 수집 암호"
        required: true
        default: ""
      bas_ym:
        description: "두 검증 업권에 공통 적용할 재무 기준월 (YYYYMM)"
        required: true
        default: "202512"
  schedule:
    # Total-assets disclosures are slow-moving. Scheduled runs keep the
    # evidence idempotently present; advancing the common vintage stays explicit.
    - cron: "17 16 1 * *"
  pull_request:
    paths:
      - .github/workflows/collect-size-peer-total-assets.yml
      - src/rate_monitor/collectors/data_go_funding/total_assets_evidence.py
      - src/rate_monitor/collectors/data_go_funding/total_assets_transport.py
      - src/rate_monitor/collectors/data_go_funding/total_assets_persistence.py
      - src/rate_monitor/collectors/data_go_funding/identity_reconciliation.py
      - src/rate_monitor/collectors/data_go_funding/cli.py
      - src/rate_monitor/services/size_peer_two_axis.py
      - src/rate_monitor/services/size_peer_current_eligibility.py
      - src/rate_monitor/services/size_peer_similarity.py
      - tests/test_size_peer_total_assets_production_workflow.py

concurrency:
  group: rate-data-writer
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  VALIDATED_COMMON_BAS_YM: "202512"

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check collect password
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED: ${{ secrets.DASHBOARD_PASSWORD }}
          GIVEN: ${{ inputs.password }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED"
          test "$GIVEN" = "$EXPECTED"

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Resolve exact common financial month
        env:
          DISPATCH_BAS_YM: ${{ inputs.bas_ym }}
        run: |
          set -euo pipefail
          BAS_YM="${DISPATCH_BAS_YM:-$VALIDATED_COMMON_BAS_YM}"
          [[ "$BAS_YM" =~ ^[0-9]{6}$ ]]
          MONTH="${BAS_YM:4:2}"
          test "$MONTH" -ge 1 -a "$MONTH" -le 12
          echo "TOTAL_ASSETS_BAS_YM=$BAS_YM" >> "$GITHUB_ENV"
          echo "exact common financial month=$BAS_YM"

      - name: Require authoritative R2 backend
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          BACKEND=$(uv run python - <<'PY'
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          print(load_backend(Path("config/storage.yaml")).backend.value)
          PY
          )
          test "$BACKEND" = "r2"
          echo "authoritative backend=$BACKEND"

      - name: Restore production database into runner-local copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work publish data/raw
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          test -s work/rate_monitor.sqlite3

      - name: Apply migrations
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Seal existing funding rows
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib, json, sqlite3
          c = sqlite3.connect("work/rate_monitor.sqlite3")
          c.row_factory = sqlite3.Row
          rows = c.execute(
              "SELECT * FROM institution_funding_observations "
              "WHERE metric_code='deposit_liabilities_total' ORDER BY id"
          ).fetchall()
          encoded = json.dumps([dict(r) for r in rows], default=str, sort_keys=True).encode()
          payload = {"rows": len(rows), "sha256": hashlib.sha256(encoded).hexdigest()}
          assert payload["rows"] > 0
          open("publish/funding-before-assets.json", "w", encoding="utf-8").write(
              json.dumps(payload, indent=2) + "\n"
          )
          print(payload)
          PY

      - name: Collect exact-common-vintage total assets
        env:
          DATA_GO_KR_SERVICE_KEY_SB: ${{ secrets.DATA_GO_KR_SERVICE_KEY_SB }}
          DATA_GO_KR_SERVICE_KEY_NH: ${{ secrets.DATA_GO_KR_SERVICE_KEY_NH }}
        run: |
          set -euo pipefail
          uv run python -m rate_monitor.collectors.data_go_funding.cli collect-total-assets \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --bas-ym "$TOTAL_ASSETS_BAS_YM" \
            --json publish/total-assets-first-run.json

      - name: Verify metric isolation and pair-complete coverage
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib, json, sqlite3, os
          bas_ym = os.environ["TOTAL_ASSETS_BAS_YM"]
          month = f"{bas_ym[:4]}-{bas_ym[4:]}"
          c = sqlite3.connect("work/rate_monitor.sqlite3")
          c.row_factory = sqlite3.Row
          before = json.load(open("publish/funding-before-assets.json", encoding="utf-8"))
          funding = c.execute(
              "SELECT * FROM institution_funding_observations "
              "WHERE metric_code='deposit_liabilities_total' ORDER BY id"
          ).fetchall()
          encoded = json.dumps([dict(r) for r in funding], default=str, sort_keys=True).encode()
          assert len(funding) == before["rows"]
          assert hashlib.sha256(encoded).hexdigest() == before["sha256"]

          assets = c.execute(
              "SELECT source_id, COUNT(*) n FROM institution_funding_observations "
              "WHERE metric_code='total_assets' AND source_effective_month=? "
              "AND valid_to IS NULL GROUP BY source_id ORDER BY source_id",
              (month,),
          ).fetchall()
          by_source = {r["source_id"]: r["n"] for r in assets}
          assert by_source.get("data_go_savings_bank_funding", 0) > 0, by_source
          assert by_source.get("data_go_agri_coop_funding", 0) > 0, by_source

          pair_count = c.execute(
              "SELECT COUNT(*) FROM institution_funding_observations a "
              "JOIN institution_funding_observations f "
              "ON f.source_id=a.source_id "
              "AND f.source_institution_key=a.source_institution_key "
              "AND f.source_effective_month=a.source_effective_month "
              "AND f.metric_code='deposit_liabilities_total' AND f.valid_to IS NULL "
              "WHERE a.metric_code='total_assets' AND a.valid_to IS NULL "
              "AND a.source_effective_month=? "
              "AND a.institution_id IS NOT NULL AND f.institution_id=a.institution_id",
              (month,),
          ).fetchone()[0]
          assert pair_count > 0, pair_count

          koryo = c.execute(
              "SELECT metric_code, value FROM institution_funding_observations "
              "WHERE source_id='data_go_savings_bank_funding' "
              "AND source_institution_key='0010390' "
              "AND source_effective_month=? AND valid_to IS NULL "
              "AND metric_code IN ('deposit_liabilities_total','total_assets') "
              "ORDER BY metric_code",
              (month,),
          ).fetchall()
          assert {r["metric_code"] for r in koryo} == {
              "deposit_liabilities_total", "total_assets"
          }, [dict(r) for r in koryo]
          payload = {
              "financial_as_of": month,
              "funding_rows_unchanged": len(funding),
              "funding_sha256_unchanged": before["sha256"],
              "asset_rows_by_source": by_source,
              "pair_complete_mapped": pair_count,
              "koryo": [dict(r) for r in koryo],
          }
          open("publish/total-assets-readback.json", "w", encoding="utf-8").write(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
          )
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Idempotent total-assets rerun
        env:
          DATA_GO_KR_SERVICE_KEY_SB: ${{ secrets.DATA_GO_KR_SERVICE_KEY_SB }}
          DATA_GO_KR_SERVICE_KEY_NH: ${{ secrets.DATA_GO_KR_SERVICE_KEY_NH }}
        run: |
          set -euo pipefail
          uv run python -m rate_monitor.collectors.data_go_funding.cli collect-total-assets \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --bas-ym "$TOTAL_ASSETS_BAS_YM" \
            --json publish/total-assets-second-run.json
          uv run python - <<'PY'
          import json, sqlite3
          payload = json.load(open("publish/total-assets-second-run.json", encoding="utf-8"))
          for result in payload["results"]:
              assert result["stored"] == 0, result
              assert result["revisions"] == 0, result
              assert result["unchanged"] == result["institution_rows"], result
          c = sqlite3.connect("work/rate_monitor.sqlite3")
          assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert not c.execute("PRAGMA foreign_key_check").fetchall()
          print("asset idempotency + sqlite integrity ok")
          PY

      - name: Snapshot and validate
        run: |
          set -euo pipefail
          uv run rate-monitor snapshot \
            --db work/rate_monitor.sqlite3 \
            --publish-db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json
          uv run rate-monitor validate --db publish/rate_monitor.sqlite3

      - name: Persist raw total-assets evidence to R2 long-term tier
        if: ${{ github.event_name != 'pull_request' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          uv run python -m rate_monitor.services.evidence_lifecycle_service upload-raw \
            --root data/raw \
            --category institution-total-assets \
            --run-id "${{ github.run_id }}"

      - name: Upload authoritative state to R2
        if: ${{ github.event_name != 'pull_request' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: uv run rate-monitor storage upload --db publish/rate_monitor.sqlite3

      - name: Verify R2 restore byte-for-byte
        if: ${{ github.event_name != 'pull_request' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          uv run rate-monitor storage restore --dest work/size-peer-assets-from-r2.sqlite3
          cmp -s publish/rate_monitor.sqlite3 work/size-peer-assets-from-r2.sqlite3
          uv run python - <<'PY'
          import sqlite3
          c = sqlite3.connect("work/size-peer-assets-from-r2.sqlite3")
          assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert not c.execute("PRAGMA foreign_key_check").fetchall()
          n = c.execute(
              "SELECT COUNT(*) FROM institution_funding_observations "
              "WHERE metric_code='total_assets' AND valid_to IS NULL"
          ).fetchone()[0]
          assert n > 0
          print("R2 total-assets readback active rows:", n)
          PY

      - name: Upload size-peer total-assets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-peer-total-assets-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            publish/funding-before-assets.json
            publish/total-assets-first-run.json
            publish/total-assets-readback.json
            publish/total-assets-second-run.json
            publish/manifest.json
