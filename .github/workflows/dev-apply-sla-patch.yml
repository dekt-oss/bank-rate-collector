name: Temporary — apply collection SLA patch

on:
  push:
    branches: [agent/collection-sla-schedule]
    paths:
      - .github/workflows/dev-apply-sla-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed SLA patch
        run: python scripts/dev_apply_sla_patch.py
      - name: Static syntax checks
        run: |
          node --check web/api/health.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name dekt-oss
          git config user.email degackt@gmail.com
          git add .github/workflows/collect.yml src/rate_monitor/services/source_health_service.py \
            web/api/health.js web/templates/site.html tests/test_gate_contract.py \
            tests/test_collection_health.py tests/test_collection_health_ui.py \
            tests/test_collection_sla_api.py
          git commit -m "fix: align collections with 08:00 SLA"
          git push origin HEAD:agent/collection-sla-schedule
