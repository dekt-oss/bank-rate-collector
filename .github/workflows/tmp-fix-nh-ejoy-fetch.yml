name: Temporary fix NH e-joy fetch fail closed

on:
  push:
    branches: ["feat/nh-local-ejoy-max-rate-g2"]
    paths:
      - ".github/workflows/tmp-fix-nh-ejoy-fetch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nh-local-ejoy-max-rate-g2
          fetch-depth: 0
      - name: Patch helper and remove temporary shadow harness
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/rate_monitor/collectors/nh_local/parser.py")
          text = path.read_text(encoding="utf-8")
          old = '''    options: list[dict[str, Any]] = []
    warnings: list[str] = []

    for index, entry in enumerate(parse_rate_table(html)):
'''
          new = '''    options: list[dict[str, Any]] = []
    warnings: list[str] = []

    # fetch 단계에서 e-joy evidence를 먼저 읽지만, 이 보조 추출이 raw capture 자체를
    # 막아서는 안 된다. 본 상세 artifact의 schema 오류는 이후 parse_detail에서
    # 기존 계약대로 다시 검증·실패한다. 여기서는 max-rate evidence만 fail closed한다.
    if DETAIL_CAPTION not in html:
        return [], [f"e-joy 상세표 캡션 없음: brc={brc}"]

    for index, entry in enumerate(parse_rate_table(html)):
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one ejoy helper insertion point, got {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm -f .github/workflows/tmp-nh-ejoy-shadow.yml
          rm .github/workflows/tmp-fix-nh-ejoy-fetch.yml
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: NH e-joy evidence 추출을 fetch fail-closed로 제한"
          git push origin HEAD:feat/nh-local-ejoy-max-rate-g2
