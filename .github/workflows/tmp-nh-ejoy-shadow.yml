name: Temporary NH e-joy nationwide shadow

on:
  push:
    branches: ["feat/nh-local-ejoy-max-rate-g2"]
    paths:
      - ".github/workflows/tmp-nh-ejoy-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Download immutable NH nationwide artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9269227044/zip \
            -o nh.zip

      - name: Parse nationwide raw through production G2 parser
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import re
          import zipfile
          from collections import Counter
          from datetime import date
          from decimal import Decimal

          from rate_monitor.collectors.nh_local import parser as nh
          from rate_monitor.domain.enums import JoinChannel, ProductType

          pattern = re.compile(r"/rate_(\d+)_(SFDPW016[34]R)\.html$")
          files = {}
          with zipfile.ZipFile("nh.zip") as archive:
              for member in archive.namelist():
                  match = pattern.search(member)
                  if match:
                      files[(match.group(1), match.group(2))] = member

              brcs = sorted({brc for brc, _ in files})
              target_counts = Counter()
              derived_counts = Counter()
              derived_12m = 0
              trace_errors = []
              option_warning_brcs = []

              for brc in brcs:
                  deposit_member = files.get((brc, "SFDPW0163R"))
                  saving_member = files.get((brc, "SFDPW0164R"))
                  if deposit_member is None or saving_member is None:
                      raise AssertionError(f"missing detail pair for brc={brc}")

                  deposit_html = archive.read(deposit_member).decode("utf-8", "ignore")
                  saving_html = archive.read(saving_member).decode("utf-8", "ignore")
                  options, option_warnings = nh.extract_ejoy_options(deposit_html, brc=brc)
                  if option_warnings:
                      option_warning_brcs.append(brc)

                  outlet = nh.NhOutlet(brc, f"shadow-{brc}", "")
                  all_rows = []
                  for product_type, source in (
                      (ProductType.TERM_DEPOSIT, deposit_html),
                      (ProductType.INSTALLMENT_SAVINGS, saving_html),
                  ):
                      rows, _warnings = nh.parse_detail(
                          source,
                          outlet=outlet,
                          product_type=product_type,
                          as_of=date(2026, 8, 17),
                          ejoy_options=options,
                      )
                      all_rows.extend(rows)

                  for row in all_rows:
                      is_derived = (
                          row.join_channel == JoinChannel.INTERNET
                          and row.source_row_ref.endswith("/internet")
                          and row.max_rate is not None
                      )
                      if row.source_product_key in nh.EJOY_TARGET_PRODUCTS and not row.source_row_ref.endswith("/internet"):
                          target_counts[row.source_product_key] += 1
                          if row.max_rate is not None:
                              trace_errors.append(f"base max unexpectedly set: {brc} {row.source_product_key} {row.term_months}")
                      if row.source_product_key == nh.EJOY_PRODUCT_NAME and row.max_rate is not None:
                          trace_errors.append(f"option row max unexpectedly set: {brc}")
                      if not is_derived:
                          continue

                      derived_counts[row.source_product_key] += 1
                      if row.term_months == 12:
                          derived_12m += 1
                      expected_prefix = f"{brc}/SFDPW0163R/"
                      if not (row.option_source_locator or "").startswith(expected_prefix):
                          trace_errors.append(f"cross-BRC/invalid option locator: {row.option_source_locator}")
                      if row.source_institution_key != brc or row.source_outlet_key != brc:
                          trace_errors.append(f"derived identity crossed BRC: {brc}")
                      if row.extra.get("max_rate_method") != "base_plus_source_declared_ejoy_add_rate":
                          trace_errors.append(f"missing method trace: {brc}")
                      if not row.extra.get("base_source_record_hash") or not row.extra.get("option_source_record_hash"):
                          trace_errors.append(f"missing source hash trace: {brc}")
                      add_rate = Decimal(str(row.extra["ejoy_add_rate"]))
                      if row.base_rate is None or row.max_rate != row.base_rate + add_rate:
                          trace_errors.append(f"arithmetic mismatch: {brc} {row.source_product_key} {row.term_months}")

          expected_targets = {
              "정기예탁금": 38944,
              "복리식정기예탁금": 19472,
              "정기적금": 28884,
              "자유적립적금": 24070,
          }
          expected_derived = {
              "정기예탁금": 38944,
              "복리식정기예탁금": 19472,
              "정기적금": 28878,
              "자유적립적금": 24065,
          }
          assert dict(target_counts) == expected_targets, target_counts
          assert dict(derived_counts) == expected_derived, derived_counts
          assert sum(derived_counts.values()) == 111359
          assert derived_12m == 19362
          assert option_warning_brcs == []
          assert trace_errors == [], trace_errors[:20]
          assert derived_counts.get("자유로부금", 0) == 0

          result = {
              "detail_brcs": len(brcs),
              "target_rows": dict(target_counts),
              "derived_internet_max_rows": dict(derived_counts),
              "derived_total": sum(derived_counts.values()),
              "derived_12m": derived_12m,
              "option_warning_brcs": option_warning_brcs,
              "trace_error_count": len(trace_errors),
          }
          print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
          print("NH e-joy nationwide production-parser shadow: PASS")
          PY
