name: Search D1 legacy-test patch

on:
  push:
    branches: ["feat/search-main-group-toggle-empty-state-20260824"]
    paths:
      - "scripts/_apply_search_d1_legacy_test_patch.py"
      - ".github/workflows/search-d1-legacy-test-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact legacy-test patch
        run: python scripts/_apply_search_d1_legacy_test_patch.py
      - name: Validate and commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git diff --check
          git diff -- tests/test_site_ui_v4.py
          test -n "$(git status --porcelain -- tests/test_site_ui_v4.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_site_ui_v4.py
          git commit -m "test: align Search all-selection contract with D1"
          git push origin "HEAD:${BRANCH}"
