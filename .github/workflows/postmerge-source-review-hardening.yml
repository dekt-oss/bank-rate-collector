name: Apply source discrepancy post-merge review hardening

on:
  push:
    branches: ["feat/source-discrepancy-postmerge-review-hardening-20260824"]
    paths:
      - ".github/workflows/postmerge-source-review-hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-discrepancy-postmerge-review-hardening-20260824
          fetch-depth: 0
      - name: Harden ambiguity reporting and remove helper
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          service = Path("src/rate_monitor/services/source_discrepancy_service.py")
          text = service.read_text(encoding="utf-8")

          old = '''def _rows_by_base(\n    mapping: dict[ProductKey, dict[str, Any]],\n) -> dict[BaseProductKey, list[dict[str, Any]]]:\n    grouped: dict[BaseProductKey, list[dict[str, Any]]] = defaultdict(list)\n    for row in mapping.values():\n        grouped[_base_product_key(row)].append(row)\n    return grouped\n\n\ndef _freshness'''
          new = '''def _rows_by_base(\n    mapping: dict[ProductKey, dict[str, Any]],\n) -> dict[BaseProductKey, list[dict[str, Any]]]:\n    grouped: dict[BaseProductKey, list[dict[str, Any]]] = defaultdict(list)\n    for row in mapping.values():\n        grouped[_base_product_key(row)].append(row)\n    return grouped\n\n\ndef _rows_by_base_with_ambiguities(\n    mapping: dict[ProductKey, dict[str, Any]],\n    ambiguities: dict[ProductKey, list[dict[str, Any]]],\n) -> dict[BaseProductKey, list[dict[str, Any]]]:\n    \"\"\"Official wildcard matching에서도 차단된 variant를 없는 것처럼 취급하지 않는다.\"\"\"\n    grouped = _rows_by_base(mapping)\n    for candidates in ambiguities.values():\n        for row in candidates:\n            grouped[_base_product_key(row)].append(row)\n    return grouped\n\n\ndef _freshness'''
          assert text.count(old) == 1, "rows-by-base target not found"
          text = text.replace(old, new, 1)

          old = '''def _dimension_ambiguity_record(\n    key: ProductKey,\n    candidates: list[dict[str, Any]],\n    *,\n    side: str,\n    as_of: datetime,\n) -> dict[str, Any]:\n'''
          new = '''def _dimension_ambiguity_record(\n    key: ProductKey,\n    candidates: list[dict[str, Any]],\n    *,\n    side: str,\n    as_of: datetime,\n    counterpart: dict[str, Any] | None = None,\n) -> dict[str, Any]:\n'''
          assert text.count(old) == 1, "ambiguity signature target not found"
          text = text.replace(old, new, 1)

          old = '''        "candidate_variants": [_candidate_variant(item) for item in candidates],\n        "provenance": [_provenance(item, as_of) for item in candidates],\n        "reason": (\n'''
          new = '''        "candidate_variants": [_candidate_variant(item) for item in candidates],\n        "provenance": [_provenance(item, as_of) for item in candidates],\n        "counterpart_side": "secondary" if side == "primary" else "primary",\n        "counterpart": _provenance(counterpart, as_of) if counterpart is not None else None,\n        "reason": (\n'''
          assert text.count(old) == 1, "ambiguity payload target not found"
          text = text.replace(old, new, 1)

          old = '''    primary_by_base = _rows_by_base(primary)\n    secondary_by_base = _rows_by_base(secondary)\n    dimension_ambiguities = [\n        *(\n            _dimension_ambiguity_record(key, candidates, side="primary", as_of=generated_at)\n            for key, candidates in primary_ambiguous.items()\n        ),\n        *(\n            _dimension_ambiguity_record(key, candidates, side="secondary", as_of=generated_at)\n            for key, candidates in secondary_ambiguous.items()\n        ),\n    ]\n'''
          new = '''    primary_by_base = _rows_by_base(primary)\n    secondary_by_base = _rows_by_base(secondary)\n    primary_official_by_base = _rows_by_base_with_ambiguities(primary, primary_ambiguous)\n    secondary_official_by_base = _rows_by_base_with_ambiguities(secondary, secondary_ambiguous)\n    dimension_ambiguities = [\n        *(\n            _dimension_ambiguity_record(\n                key,\n                candidates,\n                side="primary",\n                as_of=generated_at,\n                counterpart=secondary.get(key),\n            )\n            for key, candidates in primary_ambiguous.items()\n        ),\n        *(\n            _dimension_ambiguity_record(\n                key,\n                candidates,\n                side="secondary",\n                as_of=generated_at,\n                counterpart=primary.get(key),\n            )\n            for key, candidates in secondary_ambiguous.items()\n        ),\n    ]\n'''
          assert text.count(old) == 1, "build ambiguity target not found"
          text = text.replace(old, new, 1)

          old = '''    evidence_comparisons = _compare_official_evidence(\n        evidence,\n        primary_by_base,\n        secondary_by_base,\n        generated_at,\n    )\n'''
          new = '''    evidence_comparisons = _compare_official_evidence(\n        evidence,\n        primary_official_by_base,\n        secondary_official_by_base,\n        generated_at,\n    )\n'''
          assert text.count(old) == 1, "official comparison target not found"
          text = text.replace(old, new, 1)
          service.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_source_discrepancy_payment_ambiguity.py")
          text = test_path.read_text(encoding="utf-8")
          old = '''from __future__ import annotations\n\nfrom rate_monitor.services.source_discrepancy_service import _representatives\n'''
          new = '''from __future__ import annotations\n\nfrom datetime import UTC, datetime\n\nfrom rate_monitor.services.source_discrepancy_service import (\n    _dimension_ambiguity_record,\n    _representatives,\n    _rows_by_base_with_ambiguities,\n    _select_official_candidate,\n)\n'''
          assert text.count(old) == 1, "test import target not found"
          text = text.replace(old, new, 1)
          addition = '''\n\ndef test_official_wildcard_cannot_bypass_payment_method_ambiguity() -> None:\n    branch_s = _row(payment_method="S", rate="2.10")\n    branch_f = _row(payment_method="F", rate="3.05")\n    internet = _row(payment_method=None, rate="2.50")\n    internet["join_channel"] = "internet"\n\n    representatives, ambiguous = _representatives([branch_s, branch_f, internet])\n    candidates_by_base = _rows_by_base_with_ambiguities(representatives, ambiguous)\n    candidates = next(iter(candidates_by_base.values()))\n\n    matched, meta = _select_official_candidate(\n        {"join_channel": "any", "interest_method": "simple"},\n        candidates,\n    )\n\n    assert matched is None\n    assert meta["status"] == "ambiguous_variant"\n    assert {item["join_channel"] for item in meta["candidate_variants"]} == {\n        "branch",\n        "internet",\n    }\n\n\ndef test_dimension_ambiguity_preserves_non_ambiguous_counterpart() -> None:\n    candidates = [\n        _row(payment_method="S", rate="2.10"),\n        _row(payment_method="F", rate="3.05"),\n    ]\n    _, ambiguous = _representatives(candidates)\n    key, blocked = next(iter(ambiguous.items()))\n    counterpart = _row(payment_method=None, rate="2.10")\n    counterpart["source_id"] = "fsb"\n\n    record = _dimension_ambiguity_record(\n        key,\n        blocked,\n        side="secondary",\n        as_of=datetime(2026, 8, 24, tzinfo=UTC),\n        counterpart=counterpart,\n    )\n\n    assert record["counterpart_side"] == "primary"\n    assert record["counterpart"]["source_id"] == "fsb"\n    assert record["counterpart"]["base_rate"] == "2.10"\n    assert record["counterpart"]["max_rate"] == "2.10"\n'''
          assert "test_official_wildcard_cannot_bypass_payment_method_ambiguity" not in text
          test_path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")

          evidence_path = Path("docs/evidence/source-discrepancy/20260823-official-savings-bank.json")
          payload = json.loads(evidence_path.read_text(encoding="utf-8"))
          checksum = "27fac90b077761ed4a04475b45452acf878574d4c7ef89fd92cb152e21747a6a"
          changed = 0
          for record in payload["records"]:
              if record.get("institution") != "대백저축은행":
                  continue
              if record.get("capture_method") != "live_http_artifact":
                  continue
              record["capture_artifact_sha256"] = checksum
              changed += 1
          assert changed == 4, f"expected 4 Daebaek live evidence records, got {changed}"
          evidence_path.write_text(\n              json.dumps(payload, ensure_ascii=False, indent=2) + "\\n",\n              encoding="utf-8",\n          )

          workflow = Path(".github/workflows/source-discrepancy-audit.yml")
          text = workflow.read_text(encoding="utf-8")
          old = '''              assert record.get("capture_artifact_id") == "9492104054"\n'''
          new = '''              assert record.get("capture_artifact_id") == "9492104054"\n              assert record.get("capture_artifact_sha256") == (\n                  "27fac90b077761ed4a04475b45452acf878574d4c7ef89fd92cb152e21747a6a"\n              )\n'''
          assert text.count(old) == 1, "workflow checksum assertion target not found"
          text = text.replace(old, new, 1)
          workflow.write_text(text, encoding="utf-8")

          spec = Path("docs/specs/20260823-source-discrepancy-payment-ambiguity-v4.md")
          text = spec.read_text(encoding="utf-8").rstrip()
          appendix = '''\n\n## 10. Post-merge review hardening (2026-08-24)\n\n- official evidence가 `any`/wildcard facet을 사용할 때도 compatible한 payment-method ambiguity 후보를 candidate set에서 제거하지 않는다. ambiguity와 정상 대표행이 함께 compatible하면 `ambiguous_variant`로 fail-closed한다.\n- 한쪽 source가 ambiguity로 차단되고 반대쪽 source에 정상 대표행이 있으면 `dimension_ambiguities[].counterpart`에 그 반대편 raw/source provenance를 보존한다.\n- `live_http_artifact` evidence는 artifact ID뿐 아니라 artifact SHA-256도 dated evidence record와 grouped report에 보존한다.\n\n이 보강 역시 canonical 값이나 source authority를 변경하지 않는다.\n'''
          if "## 10. Post-merge review hardening" not in text:
              text += appendix
          spec.write_text(text + "\n", encoding="utf-8")
          PY
          git rm .github/workflows/postmerge-source-review-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/rate_monitor/services/source_discrepancy_service.py \
            tests/test_source_discrepancy_payment_ambiguity.py \
            docs/evidence/source-discrepancy/20260823-official-savings-bank.json \
            .github/workflows/source-discrepancy-audit.yml \
            docs/specs/20260823-source-discrepancy-payment-ambiguity-v4.md
          git commit -m "fix: close source discrepancy post-merge review gaps"
          git push origin HEAD:feat/source-discrepancy-postmerge-review-hardening-20260824
