name: Performance baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/browser_perf.mjs"
      - ".github/workflows/performance-baseline.yml"

permissions:
  contents: read

jobs:
  browser-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright audit dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Measure current production in Chromium
        env:
          PRODUCTION_URL: https://bank-rate-collector.vercel.app
        run: node scripts/browser_perf.mjs

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-${{ github.run_id }}
          path: |
            performance-baseline.json
            performance-baseline.md
          retention-days: 30
          if-no-files-found: warn
