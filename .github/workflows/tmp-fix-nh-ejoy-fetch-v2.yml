name: Temporary apply NH e-joy fetch fix v2

on:
  push:
    branches: ["feat/nh-local-ejoy-max-rate-g2"]
    paths:
      - "scripts/tmp_fix_nh_ejoy_fetch.py"
      - ".github/workflows/tmp-fix-nh-ejoy-fetch-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nh-local-ejoy-max-rate-g2
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/tmp_fix_nh_ejoy_fetch.py
      - name: Commit parser fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rate_monitor/collectors/nh_local/parser.py
          git diff --cached --check
          git commit -m "fix: NH e-joy evidence 추출을 fetch fail-closed로 제한"
          git push origin HEAD:feat/nh-local-ejoy-max-rate-g2
