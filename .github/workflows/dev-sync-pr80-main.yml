name: Temporary — sync PR 80 with main

on:
  push:
    branches: [agent/collection-sla-schedule]
    paths:
      - .github/workflows/dev-sync-pr80-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collection-sla-schedule
          fetch-depth: 0
      - name: Merge latest main into PR branch
        run: |
          git config user.name "dekt-oss"
          git config user.email "degackt@gmail.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/dev-sync-pr80-main.yml
          git commit -m "chore: remove temporary PR 80 sync workflow"
          git push origin HEAD:agent/collection-sla-schedule
