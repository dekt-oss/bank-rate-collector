name: Finalize NH resumable workflow

on:
  push:
    branches:
      - agent/nh-resumable-acquisition-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nh-resumable-acquisition-v1
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Wire one-shot NH recovery graph
        run: |
          python - <<'PY'
          from pathlib import Path

          def gh(expression: str) -> str:
              return "$" + "{{ " + expression + " }}"

          p = Path('.github/workflows/collect.yml')
          text = p.read_text(encoding='utf-8')
          start_marker = '      - name: Collect NH local\n'
          end_marker = '      # CLI 명령으로 부른다.'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('NH workflow block markers not found')

          source_guard = gh(
              "inputs.skip_nh_local != true && env.PUBLISH_ONLY != 'true' "
              "&& env.KFCC_ONLY != 'true'"
          )
          first_failed = gh("steps.collect_nh_local.outcome == 'failure'")
          recover_guard = gh(
              "steps.collect_nh_local.outcome == 'failure' "
              "&& steps.decide_nh_recovery.outcome == 'success' "
              "&& steps.decide_nh_recovery.outputs.eligible == 'true'"
          )
          cycle_expr = gh('steps.nh_checkpoint.outputs.cycle_date')
          fingerprint_expr = gh('steps.nh_checkpoint.outputs.fingerprint')
          contract_expr = gh('steps.nh_checkpoint.outputs.contract_version')

          r2 = [
              '          R2_ACCESS_KEY_ID: ' + gh('secrets.R2_ACCESS_KEY_ID'),
              '          R2_SECRET_ACCESS_KEY: ' + gh('secrets.R2_SECRET_ACCESS_KEY'),
              '          R2_ACCOUNT_ID: ' + gh('vars.R2_ACCOUNT_ID'),
              '          R2_BUCKET: ' + gh('vars.R2_BUCKET'),
              '          R2_ENDPOINT: ' + gh('vars.R2_ENDPOINT'),
              '          R2_REGION: ' + gh('vars.R2_REGION'),
          ]
          lines = [
              '      - name: Prepare NH checkpoint context',
              '        id: nh_checkpoint',
              '        if: ' + source_guard,
              '        env:',
              '          SCOPE: ' + gh('inputs.nh_local_scope'),
              '          GITHUB_TOKEN: ' + gh('secrets.GITHUB_TOKEN'),
              '        run: |',
              '          set -euo pipefail',
              '          mkdir -p work',
              '          uv run rate-monitor-checkpoint prepare-context \\',
              '            --source nh_local \\',
              '            ${SCOPE:+--scope "$SCOPE"} \\',
              '            --json work/nh-checkpoint-context.json >/dev/null',
              '          CYCLE_DATE=$(python -c "import json; print(json.load(open(\'work/nh-checkpoint-context.json\'))[\'cycle_date_kst\'])")',
              '          FINGERPRINT=$(python -c "import json; print(json.load(open(\'work/nh-checkpoint-context.json\'))[\'request_fingerprint\'])")',
              '          CONTRACT=$(python -c "import json; print(json.load(open(\'work/nh-checkpoint-context.json\'))[\'acquisition_contract_version\'])")',
              '          echo "cycle_date=$CYCLE_DATE" >> "$GITHUB_OUTPUT"',
              '          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"',
              '          echo "contract_version=$CONTRACT" >> "$GITHUB_OUTPUT"',
              '',
              '      - name: Collect NH local',
              '        id: collect_nh_local',
              '        if: ' + source_guard,
              '        continue-on-error: true',
              '        env:',
              '          SCOPE: ' + gh('inputs.nh_local_scope'),
              *r2,
              '        run: |',
              '          uv run rate-monitor collect \\',
              '            --source nh_local \\',
              '            --resume auto \\',
              '            --cycle-date "' + cycle_expr + '" \\',
              '            --db work/rate_monitor.sqlite3 \\',
              '            --raw-root data/raw \\',
              '            ${SCOPE:+--scope "$SCOPE"}',
              '',
              '      - name: Decide NH recovery',
              '        id: decide_nh_recovery',
              '        if: ' + first_failed,
              '        continue-on-error: true',
              '        env:',
              *r2,
              '        run: |',
              '          set -euo pipefail',
              '          uv run rate-monitor-checkpoint recovery-decision \\',
              '            --source nh_local \\',
              '            --cycle-date "' + cycle_expr + '" \\',
              '            --request-fingerprint "' + fingerprint_expr + '" \\',
              '            --acquisition-contract-version "' + contract_expr + '" \\',
              '            --attempt-failed \\',
              '            --json work/nh-recovery-decision.json >/dev/null',
              '          ELIGIBLE=$(python -c "import json; print(str(json.load(open(\'work/nh-recovery-decision.json\'))[\'eligible\']).lower())")',
              '          REASON=$(python -c "import json; print(json.load(open(\'work/nh-recovery-decision.json\'))[\'reason_code\'])")',
              '          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"',
              '          echo "reason=$REASON" >> "$GITHUB_OUTPUT"',
              '          echo "NH recovery eligible=$ELIGIBLE reason=$REASON"',
              '',
              '      - name: Recover NH local',
              '        id: recover_nh_local',
              '        if: ' + recover_guard,
              '        continue-on-error: true',
              '        env:',
              '          SCOPE: ' + gh('inputs.nh_local_scope'),
              *r2,
              '        run: |',
              '          uv run rate-monitor collect \\',
              '            --source nh_local \\',
              '            --resume auto \\',
              '            --cycle-date "' + cycle_expr + '" \\',
              '            --db work/rate_monitor.sqlite3 \\',
              '            --raw-root data/raw \\',
              '            ${SCOPE:+--scope "$SCOPE"}',
              '',
          ]
          block = '\n'.join(lines) + '\n'
          p.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY

      - name: Verify final graph
        run: |
          uv sync --locked
          uv run ruff check src tests scripts
          uv run pytest -q
          RATE_MONITOR_DB_URL=sqlite+pysqlite:///${{ runner.temp }}/nh-resume-final.sqlite3 uv run alembic upgrade head

      - name: Create connector-owned final commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-nh-resumable-integration.yml
          git add -A
          git commit -m "feat: wire NH checkpoint recovery workflow"
          FINAL_COMMIT=$(git rev-parse HEAD)
          echo "FINAL_COMMIT=$FINAL_COMMIT"
          git push origin HEAD:agent/nh-resumable-acquisition-v1 || true
