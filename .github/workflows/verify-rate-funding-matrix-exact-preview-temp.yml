name: verify — Rate Funding Matrix exact preview temp

on:
  push:
    branches:
      - verify/rate-funding-matrix-exact-preview-20260830

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked
      - name: Restore authoritative production R2 database
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work/site-public
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          test -s work/rate_monitor.sqlite3
      - name: Build exact-source Matrix preview
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from rate_monitor.services.institution_funding_position_service import build_institution_funding_positions
          from rate_monitor.services.rate_funding_matrix_presentation import inject_rate_funding_matrix
          from rate_monitor.services.rate_funding_matrix_service import build_rate_funding_matrix

          db=Path('work/rate_monitor.sqlite3')
          positions=build_institution_funding_positions(db)
          matrix=build_rate_funding_matrix(db, funding_positions=positions)
          savings=matrix['sectors']['savings_bank']; nh=matrix['sectors']['nh_local']
          assert savings['status']=='historical_rate_unavailable' and savings['current_rate_institutions']>0
          assert nh['status']=='rate_data_unavailable' and nh['current_rate_institutions']==0
          payload=json.dumps({'strategy':{'rate_funding_matrix':matrix}},ensure_ascii=False,default=str).replace('</','<\\/')
          html=f'''<!doctype html><html><head><meta charset="utf-8"><style>:root{{--muted:#667;--panel2:#fff;--line:#ddd;--green:#285;--gold:#986;--ink:#111;--soft:#667;--red:#a33;--mono:monospace;--sans:sans-serif}}body{{font-family:sans-serif;margin:20px}}.card{{display:block}}</style></head><body><div id="institution-funding-position"></div><script id="rate-monitor-data" type="application/json">{payload}</script></body></html>'''
          rendered=inject_rate_funding_matrix(html)
          Path('work/site-public/strategy.html').write_text(rendered,encoding='utf-8')
          Path('work/rate-funding-matrix-exact.json').write_text(json.dumps(matrix,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
          PY
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser runner
        run: |
          set -euo pipefail
          command -v google-chrome
          npm install --no-save --package-lock=false @playwright/test@1.61.1
          node --check scripts/rate_funding_matrix_runtime_smoke.js
      - name: Run desktop and mobile Chrome smoke
        env:
          STRATEGY_PREVIEW_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory work/site-public > work/matrix-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/strategy.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/rate_funding_matrix_runtime_smoke.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-funding-matrix-exact-preview-${{ github.run_id }}
          path: |
            work/rate-funding-matrix-exact.json
            work/rate-funding-matrix-*.png
            work/matrix-http.log
          retention-days: 30
          if-no-files-found: warn
