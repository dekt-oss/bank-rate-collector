name: Strategy main production-data runtime E2E

on:
  push:
    branches:
      - main
      - "feat/strategy-main-runtime-e2e-*"
      - "feat/strategy-ux-*"
      - "feat/unify-main-strategy-production-*"
    paths:
      - "src/rate_monitor/services/strategy_service.py"
      - "src/rate_monitor/services/deposit_pricing_external_feature_service.py"
      - "src/rate_monitor/services/strategy_external_context_service.py"
      - "src/rate_monitor/services/external_market_context_presentation.py"
      - "src/rate_monitor/services/strategy_decision_cockpit.py"
      - "src/rate_monitor/services/strategy_workspace_presentation.py"
      - "src/rate_monitor/services/strategy_light_theme_presentation.py"
      - "src/rate_monitor/services/strategy_brand_theme_presentation.py"
      - "src/rate_monitor/services/market_intelligence_service.py"
      - "src/rate_monitor/services/market_intelligence_presentation.py"
      - "src/rate_monitor/services/preference_intelligence_service.py"
      - "src/rate_monitor/services/preference_intelligence_presentation.py"
      - "src/rate_monitor/services/site_service.py"
      - "web/templates/strategy.html"
      - "web/templates/site.html"
      - "web/assets/**"
      - "config/**"
      - "migrations/**"
      - "scripts/strategy_preview_smoke.js"
      - "scripts/strategy_main_runtime_external_context_smoke.js"
      - "scripts/strategy_workspace_smoke.js"
      - "scripts/production_smoke.py"
      - "tests/test_strategy_workspace_presentation.py"
      - "tests/test_strategy_light_theme_presentation.py"
      - "tests/test_strategy_brand_theme_presentation.py"
      - "tests/test_strategy_main_runtime_e2e_workflow_contract.py"
      - "tests/test_strategy_production_release.py"
      - ".github/workflows/collect.yml"
      - ".github/workflows/collect-savings-fast.yml"
      - ".github/workflows/nh-attempt.yml"
      - ".github/workflows/production-smoke.yml"
      - "docs/specs/20260819-strategy-light-theme-ux-v2.md"
      - ".github/workflows/strategy-main-runtime-e2e.yml"
  workflow_dispatch:

# Production DB is restored into a runner-local copy and never written back.
# This E2E keeps release validation isolated from the canonical production writer:
# it exercises the exact code against real data without publishing from this job.
concurrency:
  group: strategy-main-runtime-e2e
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Publish runtime E2E locator
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=strategy-main-runtime-e2e \
            -f description="Strategy production-data runtime E2E running" \
            -f target_url="$TARGET_URL"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore current production database into local copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          print(load_backend(Path('config/storage.yaml')).backend.value)
          ")
          echo "runtime E2E source backend=$BACKEND"

          if [ "$BACKEND" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          else
            git fetch --force origin \
              +rate-data:refs/remotes/origin/rate-data --depth=1
            git show refs/remotes/origin/rate-data:latest/rate_monitor.sqlite3.gz \
              > work/rate_monitor.sqlite3.gz
            gunzip work/rate_monitor.sqlite3.gz
          fi

          test -s work/rate_monitor.sqlite3
          echo "restored bytes=$(stat -c%s work/rate_monitor.sqlite3)"

      - name: Apply migrations to runner-local copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Build isolated Strategy site from production data
        env:
          RATE_MONITOR_STRATEGY_DASHBOARD: "1"
        run: |
          set -euo pipefail
          uv run rate-monitor build-site \
            --db work/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out work/site-public

          test -s work/site-public/strategy.html
          test -s work/site-public/data/strategy-table.json
          grep -q 'id="external-market-context-script"' work/site-public/strategy.html
          grep -q 'id="strategy-workspace-script"' work/site-public/strategy.html
          grep -q 'id="strategy-light-theme-script"' work/site-public/strategy.html
          grep -q 'id="strategy-brand-theme-script"' work/site-public/strategy.html

      - name: Assert populated external feature payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          html = Path("work/site-public/strategy.html").read_text(encoding="utf-8")
          marker = '<script id="rate-monitor-data" type="application/json">'
          start = html.index(marker) + len(marker)
          end = html.index("</script>", start)
          payload = json.loads(html[start:end].replace("<\\/", "</"))
          features = payload["strategy"]["external_features"]
          assert features["status"] == "ready", features
          assert features["policy_rate"]["status"] == "ready", features["policy_rate"]
          assert features["policy_rate"]["value"] is not None

          market = features["deposit_market"]
          assert market["status"] == "ready", market
          rates = market["bank_rates"]
          for key in ("primary_realized_deposit_rate", "term_deposit_1y_rate"):
              item = rates[key]
              assert item["status"] == "ready", (key, item)
              assert item["value"] is not None, (key, item)

          flows = market["sector_balances"]
          for key in ("savings_bank", "credit_union", "kfcc", "broad_mutual_finance"):
              item = flows[key]
              assert item["status"] == "ready", (key, item)
              assert item["balance_trillion_krw"] is not None, (key, item)
              assert item["mom_change_pct"] is not None, (key, item)

          evidence = {
              "source_sha": "${{ github.sha }}",
              "external_features": features,
          }
          Path("work/strategy-runtime-external-features.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "external_features=ready",
              "policy_rate=", features["policy_rate"]["value"],
              "bank_primary=", rates["primary_realized_deposit_rate"]["value"],
              "bank_12m=", rates["term_deposit_1y_rate"]["value"],
          )
          for key, item in flows.items():
              print(key, "balance=", item.get("balance_trillion_krw"), "mom=", item.get("mom_change_pct"))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright runner
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          npm install --no-save --package-lock=false @playwright/test@1.61.1
          node --check scripts/strategy_preview_smoke.js
          node --check scripts/strategy_main_runtime_external_context_smoke.js
          node --check scripts/strategy_workspace_smoke.js

      - name: Run desktop and mobile Chrome smoke against local build
        env:
          STRATEGY_PREVIEW_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory work/site-public \
            > work/strategy-main-runtime-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/strategy.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/strategy.html >/dev/null
          node scripts/strategy_preview_smoke.js
          node scripts/strategy_main_runtime_external_context_smoke.js
          node scripts/strategy_workspace_smoke.js

      - name: Upload runtime E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-main-runtime-e2e-${{ github.run_id }}
          path: |
            work/strategy-runtime-external-features.json
            work/strategy-main-runtime-*.png
            work/strategy-smoke-*.png
            work/strategy-main-runtime-http.log
          retention-days: 30
          if-no-files-found: warn

      - name: Publish runtime E2E conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="Strategy production-data runtime E2E passed"
          else
            STATE=failure
            DESCRIPTION="Strategy production-data runtime E2E failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context=strategy-main-runtime-e2e \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"