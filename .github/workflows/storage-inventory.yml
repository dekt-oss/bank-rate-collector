name: Storage inventory (R2, read-only)

# R2 버킷에 무엇이 얼마나 쌓였는지 계열별로 센다.
#
# **읽기만 한다.** 목록 조회(list_objects_v2)만 하고 올리기·지우기·포인터
# 변경은 하지 않는다. 그래서 rate-data-writer 동시성 그룹에 들어가지 않고,
# 수집이 도는 중에도 돌릴 수 있다. 보관 정책을 정하기 전에 숫자를 보는 자리다.

on:
  workflow_dispatch:
  # One-shot: 이 PR 브랜치에서 처음 한 번 실측하기 위한 트리거. 실측 뒤 지운다.
  push:
    branches:
      - claude/optimistic-allen-yj0ti3
    paths:
      - ".github/workflows/storage-inventory.yml"

concurrency:
  group: storage-inventory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_REGION: ${{ vars.R2_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Count objects by family
        run: |
          set -euo pipefail
          uv run rate-monitor storage inventory --json-out work/r2-inventory.json \
            | tee work-inventory.txt
          {
            echo '## R2 inventory'
            echo '```'
            cat work-inventory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory JSON
        uses: actions/upload-artifact@v4
        with:
          name: r2-inventory-${{ github.run_id }}
          path: work/r2-inventory.json
          retention-days: 30
