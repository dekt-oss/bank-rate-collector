name: Inflow Engine Contract

on:
  push:
    branches: ["**"]
    paths:
      - "src/rate_monitor/services/inflow_prediction_service.py"
      - "src/rate_monitor/services/inflow_public_forecast_contract.py"
      - "src/rate_monitor/services/internal_calibration_intake_service.py"
      - "src/rate_monitor/services/inflow_calibration_protocol.py"
      - "tests/test_inflow_prediction_service.py"
      - "tests/test_inflow_prediction_parity.py"
      - "tests/test_inflow_public_forecast_contract.py"
      - "tests/test_inflow_model_documentation_contract.py"
      - "tests/test_internal_calibration_intake_service.py"
      - "tests/test_inflow_calibration_protocol.py"
      - "tests/data/inflow_parity_vectors.json"
      - "docs/specs/20260822-inflow-structural-v1-calculation-guide.md"
      - "docs/specs/20260822-inflow-structural-v1-evidence-registry.md"
      - "docs/specs/20260825-private-inflow-calibration-protocol-v1.md"
      - "web/templates/strategy.html"
      - ".github/workflows/inflow-engine-contract.yml"
  pull_request:
    paths:
      - "src/rate_monitor/services/inflow_prediction_service.py"
      - "src/rate_monitor/services/inflow_public_forecast_contract.py"
      - "src/rate_monitor/services/internal_calibration_intake_service.py"
      - "src/rate_monitor/services/inflow_calibration_protocol.py"
      - "tests/test_inflow_prediction_service.py"
      - "tests/test_inflow_prediction_parity.py"
      - "tests/test_inflow_public_forecast_contract.py"
      - "tests/test_inflow_model_documentation_contract.py"
      - "tests/test_internal_calibration_intake_service.py"
      - "tests/test_inflow_calibration_protocol.py"
      - "tests/data/inflow_parity_vectors.json"
      - "docs/specs/20260822-inflow-structural-v1-calculation-guide.md"
      - "docs/specs/20260822-inflow-structural-v1-evidence-registry.md"
      - "docs/specs/20260825-private-inflow-calibration-protocol-v1.md"
      - "web/templates/strategy.html"
      - ".github/workflows/inflow-engine-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint inflow engine boundary
        run: |
          uv run ruff check \
            src/rate_monitor/services/inflow_prediction_service.py \
            src/rate_monitor/services/inflow_public_forecast_contract.py \
            src/rate_monitor/services/internal_calibration_intake_service.py \
            src/rate_monitor/services/inflow_calibration_protocol.py \
            tests/test_inflow_prediction_service.py \
            tests/test_inflow_prediction_parity.py \
            tests/test_inflow_public_forecast_contract.py \
            tests/test_inflow_model_documentation_contract.py \
            tests/test_internal_calibration_intake_service.py \
            tests/test_inflow_calibration_protocol.py

      - name: Test inflow engine contracts
        run: |
          uv run pytest -q \
            tests/test_inflow_prediction_service.py \
            tests/test_inflow_prediction_parity.py \
            tests/test_inflow_public_forecast_contract.py \
            tests/test_inflow_model_documentation_contract.py \
            tests/test_internal_calibration_intake_service.py \
            tests/test_inflow_calibration_protocol.py
