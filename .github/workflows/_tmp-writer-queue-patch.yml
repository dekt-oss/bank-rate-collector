name: Temporary writer queue patch

on:
  push:
    branches: ["fix/writer-queue-preserve-nh"]
    paths:
      - ".github/workflows/_tmp-writer-queue-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/writer-queue-preserve-nh

      - name: Patch shared writer concurrency and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('.github/workflows/collect.yml'),
              Path('.github/workflows/collect-nh.yml'),
              Path('.github/workflows/collect-savings-fast.yml'),
              Path('.github/workflows/storage-check.yml'),
          ]
          old = "  group: rate-data-writer\n  cancel-in-progress: false\n"
          new = "  group: rate-data-writer\n  queue: max\n  cancel-in-progress: false\n"
          for path in targets:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one writer concurrency block, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = '''from pathlib import Path

import yaml


WRITER_GROUP = "rate-data-writer"
EXPECTED_WRITER_WORKFLOWS = {
    "collect.yml",
    "collect-nh.yml",
    "collect-savings-fast.yml",
    "storage-check.yml",
}


def test_rate_data_writer_workflows_preserve_pending_queue() -> None:
    matched: set[str] = set()
    for path in Path(".github/workflows").glob("*.yml"):
        workflow = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
        concurrency = workflow.get("concurrency")
        if not isinstance(concurrency, dict) or concurrency.get("group") != WRITER_GROUP:
            continue
        matched.add(path.name)
        assert concurrency.get("queue") == "max", path
        assert concurrency.get("cancel-in-progress") is False, path

    assert matched == EXPECTED_WRITER_WORKFLOWS
'''
          Path('tests/test_writer_workflow_concurrency.py').write_text(test, encoding='utf-8')
          Path('.github/workflows/_tmp-writer-queue-patch.yml').unlink()
          PY

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows tests/test_writer_workflow_concurrency.py
          git commit -m "fix: preserve queued rate-data writers"
          git push origin HEAD:fix/writer-queue-preserve-nh
