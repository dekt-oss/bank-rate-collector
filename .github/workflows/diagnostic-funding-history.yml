name: Diagnostic — Data.go institution funding history

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: "Backfill start month (YYYYMM)"
        required: false
        default: "201801"
      end_month:
        description: "Backfill end month (YYYYMM)"
        required: false
        default: "202606"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Create runner-local database
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/history-probe.sqlite3
        run: |
          set -euo pipefail
          mkdir -p work data/raw publish
          uv run alembic upgrade head

      - name: Collect historical institution funding
        id: collect
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY_SB: ${{ secrets.DATA_GO_KR_SERVICE_KEY_SB }}
          DATA_GO_KR_SERVICE_KEY_SH: ${{ secrets.DATA_GO_KR_SERVICE_KEY_SH }}
          DATA_GO_KR_SERVICE_KEY_NH: ${{ secrets.DATA_GO_KR_SERVICE_KEY_NH }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          DATA_GO_FUNDING_TIMEOUT_SECONDS: "45"
          START_MONTH: ${{ inputs.start_month || '201801' }}
          END_MONTH: ${{ inputs.end_month || '202606' }}
        run: |
          set -euo pipefail
          uv run python -m rate_monitor.collectors.data_go_funding.cli collect \
            --db work/history-probe.sqlite3 \
            --raw-root data/raw \
            --start-month "$START_MONTH" \
            --end-month "$END_MONTH" \
            --json publish/history-collect.json

      - name: Audit historical continuity
        if: always()
        run: |
          set -euo pipefail
          uv run python -m rate_monitor.collectors.data_go_funding.cli audit \
            --db work/history-probe.sqlite3 \
            --windows 24,36 \
            --json publish/history-audit.json
          uv run python -m rate_monitor.collectors.data_go_funding.cli counts \
            --db work/history-probe.sqlite3 > publish/history-counts.json
          uv run python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect("work/history-probe.sqlite3")
          db.row_factory = sqlite3.Row
          rows = db.execute(
              "SELECT source_id, MIN(source_effective_month) earliest, "
              "MAX(source_effective_month) latest, COUNT(DISTINCT source_effective_month) months, "
              "COUNT(*) active_rows FROM institution_funding_observations "
              "WHERE valid_to IS NULL GROUP BY source_id ORDER BY source_id"
          ).fetchall()
          payload = {
              "integrity_check": db.execute("PRAGMA integrity_check").fetchone()[0],
              "foreign_key_violations": len(db.execute("PRAGMA foreign_key_check").fetchall()),
              "sources": [dict(row) for row in rows],
          }
          open("publish/history-readback.json", "w", encoding="utf-8").write(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload read-only history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institution-funding-history-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            data/raw/
            publish/history-collect.json
            publish/history-audit.json
            publish/history-counts.json
            publish/history-readback.json

      - name: Preserve required-source failure signal
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          if [[ "$COLLECT_OUTCOME" != "success" ]]; then
            echo "Historical probe preserved partial evidence but required source/month was incomplete."
            exit 1
          fi
