name: Relative Pricing R2 historical funding evidence

on:
  push:
    branches:
      - "evidence/relative-pricing-r2-funding-*"
    paths:
      - ".github/workflows/relative-pricing-r2-funding-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-funding-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore production database into runner-local copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          test -s work/rate_monitor.sqlite3

      - name: Apply migrations to runner-local copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Audit point-in-time funding coverage as of 2026-08-31
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import sqlite3
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path

          from rate_monitor.services.institution_funding_read_model_db import (
              FUNDING_METRIC_CODE,
              VERIFIED_IDENTITY_STATUSES,
          )
          from rate_monitor.services.strategy_service_base import OUR_INSTITUTION_NAME

          DB = Path("work/rate_monitor.sqlite3")
          OUT = Path("work/r2-historical-funding-evidence.json")
          CUTOFF = datetime(2026, 8, 31, 23, 59, 59)

          def dt(value):
              text = str(value or "").strip()
              if not text:
                  return None
              parsed = datetime.fromisoformat(text.replace("Z", "+00:00"))
              if parsed.tzinfo is not None:
                  parsed = parsed.replace(tzinfo=None)
              return parsed

          conn = sqlite3.connect(DB)
          conn.row_factory = sqlite3.Row
          try:
              anchor = conn.execute(
                  """
                  SELECT id
                  FROM institutions
                  WHERE sector = 'savings_bank'
                    AND canonical_name = ?
                    AND active = 1
                  ORDER BY id
                  """,
                  (OUR_INSTITUTION_NAME,),
              ).fetchall()
              if len(anchor) != 1:
                  raise RuntimeError(f"anchor identity rows={len(anchor)}")
              anchor_id = str(anchor[0]["id"])

              rows = conn.execute(
                  """
                  SELECT id, institution_id, source_id, source_institution_key,
                         source_effective_month, value, identity_status,
                         observed_at, valid_from, valid_to, revision
                  FROM institution_funding_observations
                  WHERE sector = 'savings_bank'
                    AND metric_code = ?
                  ORDER BY source_effective_month, source_institution_key, revision
                  """,
                  (FUNDING_METRIC_CODE,),
              ).fetchall()
          finally:
              conn.close()

          exact_statuses = set(VERIFIED_IDENTITY_STATUSES)
          known = []
          for row in rows:
              valid_from = dt(row["valid_from"])
              valid_to = dt(row["valid_to"])
              observed_at = dt(row["observed_at"])
              if valid_from is None or valid_from > CUTOFF:
                  continue
              if valid_to is not None and valid_to <= CUTOFF:
                  continue
              if observed_at is None or observed_at > CUTOFF:
                  continue
              known.append(row)

          exact_known = [
              row
              for row in known
              if row["institution_id"] is not None
              and str(row["identity_status"]) in exact_statuses
          ]
          current_active = [row for row in rows if row["valid_to"] is None]

          month_all = Counter(str(row["source_effective_month"]) for row in known)
          month_exact = Counter(str(row["source_effective_month"]) for row in exact_known)
          month_exact_inst = defaultdict(set)
          for row in exact_known:
              month_exact_inst[str(row["source_effective_month"])].add(
                  str(row["institution_id"])
              )

          duplicate_keys = Counter(
              (str(row["institution_id"]), str(row["source_effective_month"]))
              for row in exact_known
          )
          duplicate_keys = {
              f"{institution_id}|{month}": count
              for (institution_id, month), count in duplicate_keys.items()
              if count > 1
          }

          months = sorted(month_all)
          latest_known_month = months[-1] if months else None
          latest_exact_ids = (
              sorted(month_exact_inst[latest_known_month]) if latest_known_month else []
          )
          anchor_by_month = {}
          for month in months:
              anchor_rows = [
                  row
                  for row in exact_known
                  if str(row["source_effective_month"]) == month
                  and str(row["institution_id"]) == anchor_id
              ]
              anchor_by_month[month] = [
                  {
                      "value": str(row["value"]),
                      "source_id": str(row["source_id"]),
                      "identity_status": str(row["identity_status"]),
                      "observed_at": str(row["observed_at"]),
                      "valid_from": str(row["valid_from"]),
                      "valid_to": row["valid_to"],
                      "revision": int(row["revision"]),
                  }
                  for row in anchor_rows
              ]

          payload = {
              "knowledge_as_of": CUTOFF.isoformat(sep=" "),
              "sector": "savings_bank",
              "metric_code": FUNDING_METRIC_CODE,
              "contract": {
                  "nearest_month_interpolation": False,
                  "missing_as_zero": False,
                  "future_revision_allowed": False,
                  "future_observation_allowed": False,
                  "production_write": False,
              },
              "all_revision_rows": len(rows),
              "current_active_rows": len(current_active),
              "known_at_cutoff_rows": len(known),
              "exact_known_at_cutoff_rows": len(exact_known),
              "source_ids_known_at_cutoff": sorted(
                  {str(row["source_id"]) for row in known}
              ),
              "identity_status_counts_known_at_cutoff": dict(
                  sorted(Counter(str(row["identity_status"]) for row in known).items())
              ),
              "months_known_at_cutoff": months,
              "rows_by_month_known_at_cutoff": dict(sorted(month_all.items())),
              "exact_rows_by_month_known_at_cutoff": dict(sorted(month_exact.items())),
              "exact_institutions_by_month_known_at_cutoff": {
                  month: len(month_exact_inst[month]) for month in months
              },
              "latest_known_month": latest_known_month,
              "latest_known_month_exact_institution_count": len(latest_exact_ids),
              "duplicate_exact_institution_month_keys": duplicate_keys,
              "anchor_institution_id": anchor_id,
              "anchor_exact_rows_by_month": anchor_by_month,
              "historical_funding_gate": (
                  "evidence_ready"
                  if latest_known_month and not duplicate_keys
                  else "blocked"
              ),
          }
          OUT.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print(OUT.read_text(encoding="utf-8"))
          PY

      - name: Upload R2 historical funding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relative-pricing-r2-funding-${{ github.run_id }}
          path: work/r2-historical-funding-evidence.json
          retention-days: 30
          if-no-files-found: error
