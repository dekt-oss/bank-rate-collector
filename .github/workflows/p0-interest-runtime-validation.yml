name: P0 interest runtime validation

on:
  push:
    branches: [agent/p0-interest-method-evidence]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore production database copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work publish
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3

      - name: Capture pre-migration baseline
        run: |
          uv run python - <<'PY' | tee work/baseline.txt
          import json, sqlite3
          conn = sqlite3.connect('work/rate_monitor.sqlite3')
          counts = dict(conn.execute('''
              SELECT v.interest_method, COUNT(*)
                FROM product_variants v
                JOIN products p ON p.id=v.product_id
                JOIN institutions i ON i.id=p.institution_id
               WHERE i.sector='nh_local'
               GROUP BY v.interest_method
          '''))
          bonus_compound = conn.execute('''
              SELECT COUNT(*)
                FROM product_variants v
                JOIN products p ON p.id=v.product_id
                JOIN institutions i ON i.id=p.institution_id
               WHERE i.sector='nh_local'
                 AND p.name='e-joy 인터넷예금 우대금리'
                 AND v.interest_method='compound'
          ''').fetchone()[0]
          baseline = {
              'nh_interest': counts,
              'bonus_compound': bonus_compound,
              'variants': conn.execute('SELECT COUNT(*) FROM product_variants').fetchone()[0],
              'observations': conn.execute('SELECT COUNT(*) FROM rate_observations').fetchone()[0],
          }
          print(json.dumps(baseline, ensure_ascii=False, indent=2))
          open('work/baseline.json','w',encoding='utf-8').write(json.dumps(baseline))
          PY

      - name: Apply P0-3 migration
        run: uv run alembic upgrade head | tee work/migration.txt

      - name: Verify migration invariants
        run: |
          uv run python - <<'PY' | tee work/post-migration.txt
          import json, sqlite3
          baseline = json.load(open('work/baseline.json', encoding='utf-8'))
          conn = sqlite3.connect('work/rate_monitor.sqlite3')
          counts = dict(conn.execute('''
              SELECT v.interest_method, COUNT(*)
                FROM product_variants v
                JOIN products p ON p.id=v.product_id
                JOIN institutions i ON i.id=p.institution_id
               WHERE i.sector='nh_local'
               GROUP BY v.interest_method
          '''))
          variants = conn.execute('SELECT COUNT(*) FROM product_variants').fetchone()[0]
          observations = conn.execute('SELECT COUNT(*) FROM rate_observations').fetchone()[0]
          bonus_compound = conn.execute('''
              SELECT COUNT(*)
                FROM product_variants v
                JOIN products p ON p.id=v.product_id
                JOIN institutions i ON i.id=p.institution_id
               WHERE i.sector='nh_local'
                 AND p.name='e-joy 인터넷예금 우대금리'
                 AND v.interest_method='compound'
          ''').fetchone()[0]
          duplicate_keys = conn.execute('''
              SELECT COUNT(*) FROM (
                SELECT variant_key FROM product_variants
                GROUP BY variant_key HAVING COUNT(*) > 1
              )
          ''').fetchone()[0]

          expected_unknown = (
              baseline['nh_interest'].get('unknown', 0)
              + baseline['nh_interest'].get('simple', 0)
              + baseline['bonus_compound']
          )
          expected_compound = (
              baseline['nh_interest'].get('compound', 0) - baseline['bonus_compound']
          )
          print('after', counts)
          print('variants', variants, 'observations', observations, 'duplicate_keys', duplicate_keys)
          assert counts.get('simple', 0) == 0
          assert counts.get('unknown', 0) == expected_unknown
          assert counts.get('compound', 0) == expected_compound
          assert bonus_compound == 0
          assert variants == baseline['variants']
          assert observations == baseline['observations']
          assert duplicate_keys == 0
          PY

      - name: Validate migrated database
        run: uv run rate-monitor validate --db work/rate_monitor.sqlite3 | tee work/validate-migrated.txt

      - name: Collect live NH Busan with strict parser
        run: |
          set -euo pipefail
          uv run rate-monitor collect \
            --source nh_local \
            --scope 부산 \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw | tee work/collect.txt

      - name: Verify no variant explosion and current-run semantics
        run: |
          uv run python - <<'PY' | tee work/post-collection.txt
          import json, sqlite3
          baseline = json.load(open('work/baseline.json', encoding='utf-8'))
          conn = sqlite3.connect('work/rate_monitor.sqlite3')
          variants = conn.execute('SELECT COUNT(*) FROM product_variants').fetchone()[0]
          latest = conn.execute('''
              SELECT id, parsed_count, valid_count, warning_count, error_count
                FROM collection_runs
               WHERE source_id='nh_local'
               ORDER BY started_at DESC LIMIT 1
          ''').fetchone()
          run_id, parsed, valid, warnings, errors = latest
          current = dict(conn.execute('''
              SELECT v.interest_method, COUNT(*)
                FROM rate_observations o
                JOIN product_variants v ON v.id=o.variant_id
               WHERE o.last_run_id=?
               GROUP BY v.interest_method
          ''', (run_id,)))
          ejoy = dict(conn.execute('''
              SELECT v.interest_method, COUNT(*)
                FROM rate_observations o
                JOIN product_variants v ON v.id=o.variant_id
                JOIN products p ON p.id=v.product_id
               WHERE o.last_run_id=? AND p.name='e-joy 인터넷예금 우대금리'
               GROUP BY v.interest_method
          ''', (run_id,)))
          print('run', run_id, 'parsed', parsed, 'valid', valid, 'warnings', warnings, 'errors', errors)
          print('current interest', current)
          print('e-joy interest', ejoy)
          print('variants before/after', baseline['variants'], variants)
          assert errors == 0 and parsed == valid
          assert current.get('simple', 0) == 0
          assert ejoy.get('unknown', 0) > 0 and ejoy.get('compound', 0) == 0
          assert current.get('compound', 0) > 0
          assert current.get('unknown', 0) > 0
          assert variants == baseline['variants'], 'interest correction created new variants'
          PY

      - name: Snapshot and full gates
        run: |
          set -euo pipefail
          uv run rate-monitor snapshot \
            --db work/rate_monitor.sqlite3 \
            --publish-db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json
          uv run rate-monitor validate --db publish/rate_monitor.sqlite3 | tee work/validate-snapshot.txt
          uv run rate-monitor build-dashboard \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/dashboard.html \
            --site site/index.html \
            --summary publish/summary.json
          uv run rate-monitor export \
            --db publish/rate_monitor.sqlite3 \
            --out publish/export
          uv run rate-monitor build-site \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out site-public \
            --export-dir publish/export
          uv run python scripts/verify_gate.py \
            --db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json \
            --summary publish/summary.json \
            --site site/index.html \
            --raw-root data/raw | tee work/gate.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-interest-runtime-${{ github.run_id }}
          path: |
            work/*.txt
            work/baseline.json
            publish/summary.json
            publish/manifest.json
          retention-days: 7
          if-no-files-found: warn
