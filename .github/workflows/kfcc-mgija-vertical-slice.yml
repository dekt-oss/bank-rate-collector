name: KFCC / MG Ija vertical-slice evidence (read-only)

on:
  push:
    branches: [diagnostic/kfcc-mgija-slice-20261026]

permissions:
  contents: read

jobs:
  mgija-slice:
    if: github.ref == 'refs/heads/diagnostic/kfcc-mgija-slice-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe only two public MG Ija pages
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.request, urllib.error
          from urllib.parse import urljoin

          user_agent = "bank-rate-collector-readonly-diagnostic/1 (public single-page check)"
          for path in ("/", "/rates/time-deposit"):
              req = urllib.request.Request("https://mgija.com" + path,
                                           headers={"User-Agent": user_agent, "Accept": "text/html"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(1_500_000)
                      status = response.status
                      headers = dict(response.headers.items())
              except urllib.error.HTTPError as exc:
                  status, body, headers = exc.code, exc.read(4096), dict(exc.headers.items())
              except Exception as exc:
                  print("SLICE " + json.dumps({"path": path, "error": type(exc).__name__,
                                               "message": str(exc)[:200]}, ensure_ascii=False))
                  continue
              text = body.decode("utf-8", "replace")
              srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text)
              root_markers = {key: bool(re.search(expr, text, re.I)) for key,expr in {
                  "embedded_next_data": r"__NEXT_DATA__",
                  "rendered_rates": r"MG더뱅킹정기예금|정기예탁금|MG더뱅킹정기적금",
                  "zero_banks": r"전체 금고",
                  "last_updated": r"업데이트|수집.*(시각|일시)|기준일",
                  "loading": r"불러오는 중|Loading",
              }.items()}
              print("SLICE " + json.dumps({
                  "path": path, "status": status,
                  "bytes": len(body),
                  "sha256_prefix": hashlib.sha256(body).hexdigest()[:16],
                  "content_type": headers.get("Content-Type", headers.get("content-type", "")),
                  "markers": root_markers,
                  "scripts_count": len(srcs),
                  "script_sources": [urljoin("https://mgija.com" + path, s) for s in srcs[:10]],
                  "visible_context": html.unescape(re.sub(r"<[^>]+>", " ", text))[:380].replace("\n", " "),
              }, ensure_ascii=False))
              if status == 200 and path == "/rates/time-deposit":
                  from html.parser import HTMLParser
                  class Visible(HTMLParser):
                      def __init__(self):
                          super().__init__(); self.d=[]; self.skip=0
                      def handle_starttag(self, tag, attrs):
                          if tag in ("script","style"): self.skip+=1
                      def handle_endtag(self, tag):
                          if tag in ("script","style") and self.skip>0: self.skip-=1
                      def handle_data(self, data):
                          if not self.skip and data.strip(): self.d.append(data.strip())
                  parser=Visible();parser.feed(text)
                  rendered=" | ".join(parser.d)
                  terms=("MG더뱅킹정기예금", "서울미래", "부산", "기준일", "수집일", "업데이트", "금리", "12개월")
                  snippets={}
                  for word in terms:
                      at=rendered.find(word)
                      snippets[word]=rendered[max(0,at-75):at+180] if at>=0 else None
                  date_matches=re.findall(r"(?:2026[-/.]1[0-2][-/.][0-3][0-9]|2026-10-26T[^\\s<]*)",text)[:8]
                  links=re.findall(r'href="([^"]+)"',text)
                  print("SLICE_DETAIL "+json.dumps({
                      "visible_len": len(rendered),
                      "visible_beginning": rendered[:1600],
                      "snippets": snippets,
                      "date_samples": date_matches,
                      "links_sample": links[:15],
                      "plain_bank_mentions": rendered.count("새마을금고"),
                      "flight_embedded": "self.__next_f.push" in text,
                  },ensure_ascii=False))
              if status in (400, 401, 403, 429) or "Request Blocked" in text:
                  break
          PY

      - name: Browser-render one public deposit list (no login / no bulk fetch)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
          python - <<'PY'
          import json, re, shutil
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              options={"headless":True}
              executable=shutil.which("google-chrome") or shutil.which("chromium")
              if executable: options["executable_path"]=executable
              browser=pw.chromium.launch(**options)
              page=browser.new_page()
              api=[]
              def observe(response):
                  parsed=urlparse(response.url)
                  if parsed.hostname in ("mgija.com", "www.mgija.com") and "/api/" in parsed.path:
                      api.append({"path":parsed.path, "status":response.status})
              page.on("response",observe)
              try:
                  response=page.goto("https://mgija.com/rates/time-deposit", wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(9000)
                  body=page.locator("body").inner_text(timeout=10000)
                  rows=page.locator("table tbody tr")
                  row_samples=[rows.nth(i).inner_text()[:240] for i in range(min(rows.count(),3))]
                  signals={word:body.find(word)>=0 for word in
                           ("불러오는 중", "서울미래", "MG더뱅킹정기예금", "부산", "12개월",
                            "기준일", "수집일", "업데이트", "데이터가 없습니다")}
                  first_row_html=rows.first.evaluate("(node) => node.outerHTML.slice(0, 1600)") if rows.count() else ""
                  busan_nodes=page.get_by_text("부산",exact=True)
                  busan_examples=[]
                  for idx in range(min(3,busan_nodes.count())):
                      busan_examples.append(busan_nodes.nth(idx).evaluate("(el) => el.outerHTML.slice(0, 450)"))
                  selects=page.locator("select")
                  select_examples=[]
                  for idx in range(min(4,selects.count())):
                      select_examples.append(selects.nth(idx).evaluate("(el) => el.outerHTML.slice(0, 450)"))
                  print("BROWSER_STRUCTURE "+json.dumps({
                      "first_row_html":first_row_html,
                      "busan_nodes":busan_nodes.count(),
                      "busan_examples":busan_examples,
                      "select_count":selects.count(),
                      "select_examples":select_examples,
                  },ensure_ascii=False))
                  if selects.count() > 0:
                      selects.first.select_option("부산",timeout=3000)
                      page.wait_for_timeout(2500)
                      changed=page.locator("body").inner_text()
                      changed_rows=page.locator("table tbody tr")
                      print("BROWSER_BUSAN "+json.dumps({
                          "url":page.url,
                          "rows":changed_rows.count(),
                          "first_two":[changed_rows.nth(i).inner_text()[:230] for i in range(min(2,changed_rows.count()))],
                          "search_result_context":changed[changed.find("검색 결과"):changed.find("검색 결과")+95] if "검색 결과" in changed else None,
                      },ensure_ascii=False))
                  print("BROWSER_SLICE "+json.dumps({
                      "status":response.status if response else None,
                      "title":page.title(),
                      "url":page.url,
                      "visible_length":len(body),
                      "visible_excerpt":body[:2600],
                      "tr_count":rows.count(),
                      "row_samples":row_samples,
                      "signals":signals,
                      "api_requests":api[:15],
                  },ensure_ascii=False))
              finally:
                  browser.close()
          PY
