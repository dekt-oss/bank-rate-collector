name: Inspect P1 warning reasons

on:
  push:
    branches: [agent/p1-collection-health]
    paths: [.github/workflows/p1-health-warning-evidence.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-collection-health
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Restore production state read-only
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          mkdir -p work
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
      - name: Print latest warning evidence
        run: |
          uv run python - <<'PY'
          import sqlite3
          conn = sqlite3.connect('work/rate_monitor.sqlite3')
          conn.row_factory = sqlite3.Row
          for source in ('cu','fsb','nh_local','kfcc','finlife_savings_bank'):
              run = conn.execute(
                  "SELECT id,status,started_at,warning_count,error_count,message FROM collection_runs WHERE source_id=? ORDER BY started_at DESC LIMIT 1",
                  (source,),
              ).fetchone()
              print('\n===', source, dict(run) if run else None)
              if not run:
                  continue
              print('review_items:')
              for row in conn.execute(
                  "SELECT issue_type,severity,message,COUNT(*) AS n FROM review_items WHERE run_id=? GROUP BY issue_type,severity,message ORDER BY n DESC,message",
                  (run['id'],),
              ):
                  print(dict(row))
              print('row validation warnings/errors:')
              for row in conn.execute(
                  "SELECT validation_status,validation_message,COUNT(*) AS n FROM rate_observations WHERE last_run_id=? AND validation_status!='valid' GROUP BY validation_status,validation_message ORDER BY n DESC,validation_message",
                  (run['id'],),
              ):
                  print(dict(row))
          conn.close()
          PY
