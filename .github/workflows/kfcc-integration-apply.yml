name: Apply KFCC resumable integration

on:
  push:
    branches: [agent/kfcc-resumable-acquisition-v1]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kfcc-resumable-acquisition-v1
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Apply targeted workflow patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/collect.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          input_marker = '''      kfcc_scope:
            description: "새마을금고 수집 범위 (config/regions.yaml)"
            type: choice
            required: false
            default: "전국"
            options: ["전국", "수도권", "부산"]
          '''
          input_replacement = input_marker + '''      kfcc_resume_mode:
            description: "새마을금고 checkpoint. 보통 auto, 같은 날 새로 받으려면 fresh"
            type: choice
            required: false
            default: "auto"
            options: ["auto", "fresh"]
          '''
          if '      kfcc_resume_mode:\n' not in workflow:
              if input_marker not in workflow:
                  raise SystemExit('kfcc_scope input marker not found')
              workflow = workflow.replace(input_marker, input_replacement, 1)

          start = workflow.index('      - name: Collect KFCC\n')
          end = workflow.index('\n\n      # 농·축협.', start)
          kfcc_block = '''      - name: Prepare KFCC checkpoint context
            id: kfcc_checkpoint
            if: ${{ inputs.skip_kfcc != true && env.PUBLISH_ONLY != 'true'
              && env.SKIP_KFCC_THIS_RUN != 'true' }}
            env:
              SCOPE: ${{ inputs.kfcc_scope }}
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              set -euo pipefail
              mkdir -p work
              uv run rate-monitor-checkpoint prepare-context \\
                --source kfcc \\
                ${SCOPE:+--scope "$SCOPE"} \\
                --json work/kfcc-checkpoint-context.json >/dev/null
              CYCLE_DATE=$(python -c "import json; print(json.load(open('work/kfcc-checkpoint-context.json'))['cycle_date_kst'])")
              FINGERPRINT=$(python -c "import json; print(json.load(open('work/kfcc-checkpoint-context.json'))['request_fingerprint'])")
              CONTRACT=$(python -c "import json; print(json.load(open('work/kfcc-checkpoint-context.json'))['acquisition_contract_version'])")
              echo "cycle_date=$CYCLE_DATE" >> "$GITHUB_OUTPUT"
              echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
              echo "contract_version=$CONTRACT" >> "$GITHUB_OUTPUT"

          - name: Collect KFCC
            id: collect_kfcc
            if: ${{ inputs.skip_kfcc != true && env.PUBLISH_ONLY != 'true'
              && env.SKIP_KFCC_THIS_RUN != 'true' }}
            continue-on-error: true
            env:
              SCOPE: ${{ inputs.kfcc_scope }}
              RESUME_MODE: ${{ inputs.kfcc_resume_mode || 'auto' }}
              R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
              R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
              R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
              R2_BUCKET: ${{ vars.R2_BUCKET }}
              R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
              R2_REGION: ${{ vars.R2_REGION }}
            run: |
              uv run rate-monitor collect \\
                --source kfcc \\
                --resume "$RESUME_MODE" \\
                --cycle-date "${{ steps.kfcc_checkpoint.outputs.cycle_date }}" \\
                --db work/rate_monitor.sqlite3 \\
                --raw-root data/raw \\
                ${SCOPE:+--scope "$SCOPE"}

          - name: Decide KFCC recovery
            id: decide_kfcc_recovery
            if: ${{ steps.collect_kfcc.outcome == 'failure' }}
            continue-on-error: true
            env:
              R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
              R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
              R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
              R2_BUCKET: ${{ vars.R2_BUCKET }}
              R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
              R2_REGION: ${{ vars.R2_REGION }}
            run: |
              set -euo pipefail
              uv run rate-monitor-checkpoint recovery-decision \\
                --source kfcc \\
                --cycle-date "${{ steps.kfcc_checkpoint.outputs.cycle_date }}" \\
                --request-fingerprint "${{ steps.kfcc_checkpoint.outputs.fingerprint }}" \\
                --acquisition-contract-version "${{ steps.kfcc_checkpoint.outputs.contract_version }}" \\
                --attempt-failed \\
                --json work/kfcc-recovery-decision.json >/dev/null
              ELIGIBLE=$(python -c "import json; print(str(json.load(open('work/kfcc-recovery-decision.json'))['eligible']).lower())")
              REASON=$(python -c "import json; print(json.load(open('work/kfcc-recovery-decision.json'))['reason_code'])")
              echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
              echo "reason=$REASON" >> "$GITHUB_OUTPUT"
              echo "KFCC recovery eligible=$ELIGIBLE reason=$REASON"

          - name: Recover KFCC
            id: recover_kfcc
            if: ${{ steps.collect_kfcc.outcome == 'failure' && steps.decide_kfcc_recovery.outcome == 'success' && steps.decide_kfcc_recovery.outputs.eligible == 'true' }}
            continue-on-error: true
            env:
              SCOPE: ${{ inputs.kfcc_scope }}
              R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
              R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
              R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
              R2_BUCKET: ${{ vars.R2_BUCKET }}
              R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
              R2_REGION: ${{ vars.R2_REGION }}
            run: |
              uv run rate-monitor collect \\
                --source kfcc \\
                --resume auto \\
                --cycle-date "${{ steps.kfcc_checkpoint.outputs.cycle_date }}" \\
                --db work/rate_monitor.sqlite3 \\
                --raw-root data/raw \\
                ${SCOPE:+--scope "$SCOPE"}
          '''
          workflow = workflow[:start] + kfcc_block + workflow[end:]
          workflow_path.write_text(workflow, encoding='utf-8')

          cli_path = Path('src/rate_monitor/cli.py')
          cli = cli_path.read_text(encoding='utf-8')
          bad = 'export.add_argument("--db", default="publish/export")'
          good = 'export.add_argument("--db", default="publish/rate_monitor.sqlite3")'
          if bad in cli:
              cli = cli.replace(bad, good, 1)
          cli_path.write_text(cli, encoding='utf-8')
          PY

      - name: Validate focused integration
        run: |
          uv run ruff check src tests
          uv run pytest -q \
            tests/test_kfcc_resumable.py \
            tests/test_kfcc_checkpoint_cli.py \
            tests/test_kfcc_retry.py \
            tests/test_nh_local_resumable.py \
            tests/test_nh_checkpoint_cli.py \
            tests/test_gate_contract.py

      - name: Commit targeted patch and remove helper workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kfcc-integration-apply.yml
          git add .github/workflows/collect.yml src/rate_monitor/cli.py
          git diff --cached --check
          git commit -m "feat: wire KFCC checkpoint recovery workflow"
          git push origin HEAD:agent/kfcc-resumable-acquisition-v1
