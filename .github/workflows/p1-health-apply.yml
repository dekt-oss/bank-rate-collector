name: Apply P1 collection health

on:
  push:
    branches: [agent/p1-collection-health]
    paths: [.github/workflows/p1-health-apply.yml]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-collection-health

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Apply patch
        run: |
          uv run python scripts/_tmp_apply_p1_health.py
          rm scripts/_tmp_apply_p1_health.py
          rm .github/workflows/p1-health-apply.yml

      - name: Diff sanity
        run: |
          git diff --check
          git status --short

      - name: Lint
        run: uv run ruff check .

      - name: Endpoint syntax
        run: node --check web/api/health.js

      - name: Targeted tests
        run: |
          uv run pytest -q \
            tests/test_collection_health.py \
            tests/test_collection_health_ui.py \
            tests/test_snapshot_and_dashboard.py \
            tests/test_site_service.py \
            tests/test_collect_endpoint.py

      - name: Full test suite
        run: uv run pytest -q

      - name: Migration applies to empty database
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/p1-health-empty.sqlite3
        run: |
          mkdir -p work
          uv run alembic upgrade head

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add collection health traffic lights"
          git push origin HEAD:agent/p1-collection-health
