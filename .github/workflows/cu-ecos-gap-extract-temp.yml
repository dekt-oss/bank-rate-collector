name: recon — 신협 ECOS 괴리 evidence 추출

on:
  push:
    branches: [recon/cu-ecos-gap-20260830]

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: ${{ contains(github.event.head_commit.message, '[cu-ecos-gap-extract]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download nationwide candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: cu-funding-nationwide-candidate-33251704349
          path: candidate
          github-token: ${{ github.token }}
          run-id: 33251704349

      - name: Print compact collection and QC evidence
        run: |
          set -euo pipefail
          echo '=== backfill ==='
          cat candidate/publish/cu-funding-nationwide-backfill.json
          echo '=== qc ==='
          cat candidate/publish/cu-funding-candidate-qc.json
          echo '=== idempotency ==='
          cat candidate/publish/cu-funding-bounded-idempotency.json

      - name: Build month coverage and schema inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db = Path('candidate/publish/rate_monitor.sqlite3')
          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row
          tables = [r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
          inventory = {}
          for table in tables:
              cols = [r[1] for r in conn.execute(f'PRAGMA table_info("{table}")')]
              if any(token in table.lower() for token in ('fund', 'macro', 'ecos')):
                  inventory[table] = cols

          rows = conn.execute('''
              SELECT sector, source_effective_month AS month,
                     COUNT(DISTINCT institution_id) AS institutions,
                     SUM(CAST(value AS REAL)) AS balance_sum
              FROM institution_funding_observations
              WHERE valid_to IS NULL
                AND institution_id IS NOT NULL
                AND identity_status = 'exact'
              GROUP BY sector, source_effective_month
              ORDER BY sector, source_effective_month
          ''').fetchall()
          payload = {
              'schema_inventory': inventory,
              'institution_month_coverage': [dict(r) for r in rows],
          }
          Path('cu-ecos-gap-extract.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: cu-ecos-gap-extract-${{ github.run_id }}
          retention-days: 14
          path: cu-ecos-gap-extract.json
