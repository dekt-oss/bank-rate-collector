name: Maintenance — apply CU year-format source fix

on:
  push:
    branches:
      - feat/cu-funding-disclosure-20260829
    paths:
      - .github/workflows/patch-cu-funding-year-format.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cu-funding-disclosure-20260829
      - name: Apply evidence-backed year parser fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/rate_monitor/collectors/cu/funding.py')
          text = path.read_text(encoding='utf-8')
          old = '_YEAR = re.compile(r"(20\\d{2})\\s*년도")'
          new = '_YEAR = re.compile(r"(20\\d{2})\\s*년(?:도)?")'
          if old not in text:
              raise SystemExit('expected year regex not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-cu-funding-year-format.yml
      - name: Commit source-contract fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rate_monitor/collectors/cu/funding.py .github/workflows/patch-cu-funding-year-format.yml
          git commit -m "fix: accept CU disclosure 년 and 년도 year formats"
          git push origin HEAD:feat/cu-funding-disclosure-20260829
