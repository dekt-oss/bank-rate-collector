name: H2 Browser Verify

on:
  push:
    branches:
      - feat/strategy-dashboard-mutual-finance-h2
    paths:
      - .github/workflows/h2-browser-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch generated strategy preview
        run: |
          git fetch origin strategy-preview
          PREVIEW_MSG="$(git log -1 --format=%B origin/strategy-preview)"
          echo "$PREVIEW_MSG"
          echo "$PREVIEW_MSG" | grep -F 'preview: strategy dashboard from f18d44e638ce66e754095c72a182bb4ccc926eb7'
          git worktree add /tmp/strategy-preview origin/strategy-preview
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/h2-browser
          cd /tmp/h2-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify H2 mode interactions at desktop and mobile
        run: |
          cd /tmp/strategy-preview/site-public
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/h2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat >/tmp/h2-browser/verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          for (const viewport of [{width:1280,height:900,name:'desktop'},{width:390,height:844,name:'mobile'}]) {
            const page = await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
            const errors=[];
            page.on('console', msg=>{ if(msg.type()==='error') errors.push(`console:${msg.text()}`); });
            page.on('pageerror', err=>errors.push(`page:${err.message}`));
            await page.goto('http://127.0.0.1:8765/strategy.html',{waitUntil:'networkidle'});
            await page.locator('#scope-pill').waitFor();
            if ((await page.locator('#scope-pill').textContent())?.trim() !== '저축은행') throw new Error(`${viewport.name}: default mode mismatch`);
            if (!(await page.locator('[data-sector="kfcc"]').isDisabled())) throw new Error(`${viewport.name}: KFCC must be disabled`);
            if (!(await page.locator('[data-sector="nh_local"]').isDisabled())) throw new Error(`${viewport.name}: NH must be disabled`);
            if (await page.locator('[data-sector="cu"]').isDisabled()) throw new Error(`${viewport.name}: CU unexpectedly disabled`);

            await page.locator('[data-market-mode="mutual_finance"]').click();
            if ((await page.locator('#scope-pill').textContent())?.trim() !== '상호금융') throw new Error(`${viewport.name}: mutual mode label mismatch`);
            if (!(await page.locator('#market-flow').getAttribute('hidden') !== null)) throw new Error(`${viewport.name}: savings history visible in mutual-only`);
            if (!(await page.locator('#map-card').getAttribute('hidden') !== null)) throw new Error(`${viewport.name}: savings map visible in mutual-only`);
            if (!(await page.locator('#sim-form').getAttribute('hidden') !== null)) throw new Error(`${viewport.name}: savings simulator visible in mutual-only`);
            if (await page.locator('#sim-scope-warning').getAttribute('hidden') !== null) throw new Error(`${viewport.name}: simulator warning hidden`);
            const status=(await page.locator('#scope-status').textContent())||'';
            for (const text of ['최고금리 기준','신협 최고금리','신협 6개월 공시 데이터 없음','새마을금고','농·축협']) {
              if (!status.includes(text)) throw new Error(`${viewport.name}: missing status text ${text}`);
            }

            await page.locator('[data-market-mode="combined"]').click();
            if ((await page.locator('#scope-pill').textContent())?.trim() !== '저축은행 + 상호금융') throw new Error(`${viewport.name}: combined mode label mismatch`);
            if (await page.locator('#market-flow').getAttribute('hidden') !== null) throw new Error(`${viewport.name}: savings history hidden in combined`);
            if (await page.locator('#map-card').getAttribute('hidden') !== null) throw new Error(`${viewport.name}: savings map hidden in combined`);
            if (await page.locator('#sim-form').getAttribute('hidden') !== null) throw new Error(`${viewport.name}: simulator hidden in combined`);
            if (errors.length) throw new Error(`${viewport.name}: ${errors.join(' | ')}`);
            await page.screenshot({path:`/tmp/h2-${viewport.name}.png`,fullPage:true});
            console.log(`PASS ${viewport.name}: modes/disabled/no-data/visibility/console`);
            await page.close();
          }
          await browser.close();
          JS
          cd /tmp/h2-browser
          node verify.mjs
      - name: Remove one-off browser workflow
        if: success()
        run: |
          rm .github/workflows/h2-browser-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: H2 browser verify harness 정리"
          git push origin HEAD:feat/strategy-dashboard-mutual-finance-h2
