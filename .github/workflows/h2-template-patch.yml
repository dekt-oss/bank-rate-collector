name: H2 Strategy Template Patch

on:
  push:
    branches:
      - feat/strategy-dashboard-mutual-finance-h2
    paths:
      - scripts/patch_strategy_h2.py
      - .github/workflows/h2-template-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic H2 patch
        run: python scripts/patch_strategy_h2.py
      - name: Verify inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/templates/strategy.html').read_text(encoding='utf-8')
          marker = '<script id="rate-monitor-data" type="application/json"></script>'
          data_end = html.index(marker) + len(marker)
          script_start = html.index('<script>', data_end) + len('<script>')
          script_end = html.index('</script>', script_start)
          Path('/tmp/strategy-h2.js').write_text(html[script_start:script_end], encoding='utf-8')
          PY
          node --check /tmp/strategy-h2.js
      - name: Remove one-off patch harness
        run: rm scripts/patch_strategy_h2.py .github/workflows/h2-template-patch.yml
      - name: Commit patched template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 전략 대시보드 상호금융 선택 UI"
          git push origin HEAD:feat/strategy-dashboard-mutual-finance-h2
