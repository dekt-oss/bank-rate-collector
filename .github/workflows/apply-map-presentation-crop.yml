name: Apply strategy map presentation crop

on:
  push:
    branches:
      - feat/strategy-dashboard-korea-map
    paths:
      - .github/workflows/apply-map-presentation-crop.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/strategy-dashboard-korea-map
          fetch-depth: 0

      - name: Apply mainland + Jeju presentation viewport
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/rate_monitor/services/site_service.py")
          text = path.read_text(encoding="utf-8")
          old = "            'setAttribute(\"viewBox\",\"0 0 800 759\")',\n"
          new = (
              "            'setAttribute(\"viewBox\",\"0 0 800 759\");'\n"
              "            '$(\"geo-map\").setAttribute(\"viewBox\",\"120 0 500 759\")',\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one strategy map viewBox target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_strategy_map_presentation.py")
          test_path.write_text(
              '''"""전국 전략 지도의 모바일 presentation viewport 계약."""\n\n'
              'from pathlib import Path\n\n'
              'from rate_monitor.services.site_service import adapt_strategy_korea_map_template\n\n'
              'TEMPLATE = Path("web/templates/strategy.html")\n\n\n'
              'def test_national_map_crops_remote_islands_but_keeps_mainland_and_jeju() -> None:\n'
              '    html = adapt_strategy_korea_map_template(TEMPLATE.read_text(encoding="utf-8"))\n\n'
              '    assert \'setAttribute("viewBox","0 0 800 759")\' in html\n'
              '    assert \'setAttribute("viewBox","120 0 500 759")\' in html\n'
              '    assert \'"제주":[207,723]\' in html\n'
              '    assert \'href="assets/korea-sido.svg"\' in html\n'
              '    assert "function showBusanMap()" in html\n'
              ''',
              encoding="utf-8",
          )
          PY

      - name: Commit patch and remove helper workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-map-presentation-crop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 전략 전국 지도 원거리 도서 viewport 제외"
          git push origin HEAD:feat/strategy-dashboard-korea-map
