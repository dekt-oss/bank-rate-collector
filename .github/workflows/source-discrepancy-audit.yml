name: Source discrepancy audit

on:
  push:
    branches: ["feat/source-discrepancy-*"]
    paths:
      - "src/rate_monitor/services/source_discrepancy_service.py"
      - "src/rate_monitor/services/official_evidence_policy.py"
      - "scripts/source_discrepancy_audit.py"
      - "tests/test_source_discrepancy_service.py"
      - "tests/test_official_evidence_policy.py"
      - "docs/evidence/source-discrepancy/**"
      - "docs/specs/20260820-source-discrepancy-official-evidence-v2.md"
      - ".github/workflows/source-discrepancy-audit.yml"
      - "config/storage.yaml"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: source-discrepancy-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore current production database read-only
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          print(load_backend(Path('config/storage.yaml')).backend.value)
          ")
          echo "audit source backend=$BACKEND"

          if [ "$BACKEND" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          else
            git fetch origin rate-data --depth=1
            git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz
            gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3
            rm -rf latest
          fi

          test -s work/rate_monitor.sqlite3
          echo "restored bytes=$(stat -c%s work/rate_monitor.sqlite3)"

      - name: Apply migrations to audit copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Build read-only three-way discrepancy report
        run: |
          set -euo pipefail
          uv run python scripts/source_discrepancy_audit.py \
            --db work/rate_monitor.sqlite3 \
            --out work/source-discrepancy-report.json \
            --official-evidence docs/evidence/source-discrepancy/20260820-official-savings-bank.json

      - name: Inspect mismatch and official evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("work/source-discrepancy-report.json").read_text(encoding="utf-8")
          )
          assert report["scope"]["canonical_mutated"] is False
          assert report["scope"]["official_evidence_authority"] == "read_only_support_only"
          assert report["scope"]["official_conflict_blocks_authority"] is True
          assert report["summary"]["official_evidence_records"] >= 5
          assert report["summary"]["official_evidence_groups"] >= 4

          print("source runs:", report["source_runs"])
          print("summary:", report["summary"])

          mismatch_statuses = {
              "rate_mismatch",
              "rate_mismatch_date_diff",
              "rate_mismatch_date_unknown",
              "incomplete_rate",
          }
          mismatches = [
              item for item in report["matches"] if item["status"] in mismatch_statuses
          ]
          print(f"max-rate mismatch evidence rows={len(mismatches)}")
          for item in mismatches[:20]:
              left = item["primary"]
              right = item["secondary"]
              print(
                  item["status"],
                  left["institution"],
                  left["product"],
                  f"term={left['term_months']}",
                  f"fsb={left['max_rate']}@{left['source_effective_at']}",
                  f"finlife={right['max_rate']}@{right['source_effective_at']}",
                  f"delta={item['delta_max_rate_primary_minus_secondary']}",
                  f"raw={left['raw_artifact_path']}",
              )

          base_mismatches = [
              item for item in report["matches"]
              if item["base_rate_comparison"]["status"] in {"mismatch", "incomplete"}
          ]
          print(f"base-rate mismatch/incomplete evidence rows={len(base_mismatches)}")
          for item in base_mismatches[:20]:
              left = item["primary"]
              base = item["base_rate_comparison"]
              print(
                  base["status"],
                  left["institution"],
                  left["product"],
                  f"term={left['term_months']}",
                  f"fsb={base['primary']}",
                  f"finlife={base['secondary']}",
                  f"delta={base['delta_primary_minus_secondary']}",
              )

          print("official evidence groups:")
          for group in report["official_evidence_groups"]:
              print(
                  group["evidence_group"],
                  f"status={group['status']}",
                  f"signal={group['reconciliation_signal']}",
                  f"primary={group['source_support']['primary']}",
                  f"secondary={group['source_support']['secondary']}",
                  f"official_max={group['official_max_rates']}",
              )

          conflicts = [
              group for group in report["official_evidence_groups"]
              if group["status"] == "conflict"
          ]
          print(f"official internal conflicts={len(conflicts)}")
          for group in conflicts:
              print(
                  "official-conflict",
                  group["institution"],
                  group["official_product"],
                  f"term={group['term_months']}",
                  f"fields={group['conflict_fields']}",
                  f"rates={group['official_max_rates']}",
              )

          for target in ("대백", "청주", "키움YES", "키움예스"):
              found = [
                  item for item in report["matches"]
                  if target in (item["primary"]["institution"] or "")
                  or target in (item["secondary"]["institution"] or "")
              ]
              print(f"target={target} exact_matches={len(found)}")
              for item in found[:20]:
                  print(
                      " ",
                      item["status"],
                      item["primary"]["product"],
                      f"term={item['primary']['term_months']}",
                      item["primary"]["max_rate"],
                      item["secondary"]["max_rate"],
                  )
          PY

      - name: Upload discrepancy evidence
        uses: actions/upload-artifact@v4
        with:
          name: source-discrepancy-evidence-${{ github.run_id }}
          path: |
            work/source-discrepancy-report.json
            docs/evidence/source-discrepancy/20260820-official-savings-bank.json
          retention-days: 30
