name: Source discrepancy audit

on:
  push:
    branches: ["feat/source-discrepancy-*"]
    paths:
      - "src/rate_monitor/services/source_discrepancy_service.py"
      - "src/rate_monitor/services/official_evidence_policy.py"
      - "src/rate_monitor/services/source_discrepancy_triage.py"
      - "src/rate_monitor/services/source_official_contradiction_triage.py"
      - "scripts/source_discrepancy_audit.py"
      - "tests/test_source_discrepancy_service.py"
      - "tests/test_source_discrepancy_variant_freshness.py"
      - "tests/test_source_discrepancy_payment_ambiguity.py"
      - "tests/test_official_evidence_policy.py"
      - "tests/test_official_evidence_variant_grouping.py"
      - "tests/test_source_discrepancy_triage.py"
      - "tests/test_source_discrepancy_triage_variant.py"
      - "tests/test_source_official_contradiction_triage.py"
      - "tests/test_source_official_contradiction_variant.py"
      - "docs/evidence/source-discrepancy/**"
      - "docs/specs/20260820-source-discrepancy-official-evidence-v2.md"
      - "docs/specs/20260820-source-discrepancy-priority-triage-v1.md"
      - "docs/specs/20260820-source-official-contradiction-triage-v1.md"
      - "docs/specs/20260823-source-discrepancy-variant-freshness-v3.md"
      - "docs/specs/20260823-source-discrepancy-payment-ambiguity-v4.md"
      - ".github/workflows/source-discrepancy-audit.yml"
      - "config/storage.yaml"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: source-discrepancy-audit
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish discrepancy audit locator
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=source-discrepancy-audit \
            -f description="Production-data source discrepancy audit running" \
            -f target_url="$TARGET_URL"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Validate discrepancy contracts
        run: |
          set -euo pipefail
          uv run ruff check \
            src/rate_monitor/services/source_discrepancy_service.py \
            src/rate_monitor/services/official_evidence_policy.py \
            src/rate_monitor/services/source_discrepancy_triage.py \
            src/rate_monitor/services/source_official_contradiction_triage.py \
            tests/test_source_discrepancy_service.py \
            tests/test_source_discrepancy_variant_freshness.py \
            tests/test_source_discrepancy_payment_ambiguity.py \
            tests/test_official_evidence_policy.py \
            tests/test_official_evidence_variant_grouping.py \
            tests/test_source_discrepancy_triage.py \
            tests/test_source_discrepancy_triage_variant.py \
            tests/test_source_official_contradiction_triage.py \
            tests/test_source_official_contradiction_variant.py
          uv run pytest -q \
            tests/test_source_discrepancy_service.py \
            tests/test_source_discrepancy_variant_freshness.py \
            tests/test_source_discrepancy_payment_ambiguity.py \
            tests/test_official_evidence_policy.py \
            tests/test_official_evidence_variant_grouping.py \
            tests/test_source_discrepancy_triage.py \
            tests/test_source_discrepancy_triage_variant.py \
            tests/test_source_official_contradiction_triage.py \
            tests/test_source_official_contradiction_variant.py

      - name: Restore current production database read-only
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          print(load_backend(Path('config/storage.yaml')).backend.value)
          ")
          echo "audit source backend=$BACKEND"

          if [ "$BACKEND" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          else
            git fetch origin rate-data --depth=1
            git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz
            gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3
            rm -rf latest
          fi

          test -s work/rate_monitor.sqlite3
          echo "restored bytes=$(stat -c%s work/rate_monitor.sqlite3)"

      - name: Apply migrations to audit copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Build read-only three-way report and queues
        run: |
          set -euo pipefail
          uv run python scripts/source_discrepancy_audit.py \
            --db work/rate_monitor.sqlite3 \
            --out work/source-discrepancy-report.json \
            --triage-out work/source-discrepancy-priority-queue.json \
            --official-contradiction-out work/source-discrepancy-official-contradictions.json \
            --official-evidence docs/evidence/source-discrepancy/20260823-official-savings-bank.json

      - name: Inspect payment-method ambiguity and current evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("work/source-discrepancy-report.json").read_text(encoding="utf-8"))
          queue_payload = json.loads(
              Path("work/source-discrepancy-priority-queue.json").read_text(encoding="utf-8")
          )
          contradiction_payload = json.loads(
              Path("work/source-discrepancy-official-contradictions.json").read_text(
                  encoding="utf-8"
              )
          )

          scope = report["scope"]
          assert scope["canonical_mutated"] is False
          assert "join_channel" in scope["automatic_match_method"]
          assert "interest_method" in scope["automatic_match_method"]
          assert "multiple payment_method" in scope["dimension_ambiguity_policy"]
          assert scope["freshness_metadata_policy"].startswith("observational_only")
          assert scope["official_evidence_authority"] == "read_only_support_only"
          assert scope["official_conflict_blocks_authority"] is True
          assert scope["triage_mutates_canonical"] is False
          assert scope["triage_selects_authority"] is False
          assert scope["official_contradiction_mutates_canonical"] is False
          assert scope["official_contradiction_selects_authority"] is False

          summary = report["summary"]
          assert summary["ambiguous_variant_dimension"] >= 2
          assert summary["ambiguous_payment_method"] >= 2
          assert summary["official_evidence_records"] >= 8
          assert summary["official_evidence_groups"] >= 7

          ambiguities = report["dimension_ambiguities"]
          cheongju = [
              item for item in ambiguities
              if item["institution"] == "청주저축은행"
              and item["product"] == "정기적금"
              and item["term_months"] in {6, 12}
              and item["dimension"] == "payment_method"
              and item["side"] == "secondary"
          ]
          assert {item["term_months"] for item in cheongju} == {6, 12}
          for item in cheongju:
              assert len(set(item["candidate_payment_methods"])) >= 2
              rate_pairs = {
                  (candidate.get("base_rate"), candidate.get("max_rate"))
                  for candidate in item["candidate_variants"]
              }
              assert len(rate_pairs) >= 2
              assert all(entry.get("raw_artifact_path") for entry in item["provenance"])

          triage = report["triage"]
          assert triage["summary"]["queue_size"] == summary["mismatch_or_incomplete"]
          assert queue_payload["triage"] == triage
          assert not any(
              item["institution"] == "청주저축은행"
              and item["product"] == "정기적금"
              and item["term_months"] in {6, 12}
              for item in triage["queue"]
          )
          assert [item["rank"] for item in triage["queue"]] == list(
              range(1, triage["summary"]["queue_size"] + 1)
          )
          assert sum(triage["summary"][key] for key in ("P0", "P1", "P2", "P3")) == triage[
              "summary"
          ]["queue_size"]

          contradictions = report["official_contradictions"]
          assert contradiction_payload["official_contradictions"] == contradictions
          assert [item["rank"] for item in contradictions["queue"]] == list(
              range(1, contradictions["summary"]["queue_size"] + 1)
          )
          assert not any(
              item["institution"] == "대백저축은행" for item in contradictions["queue"]
          )

          groups = {item["evidence_group"]: item for item in report["official_evidence_groups"]}
          daebaek_expected = {
              "debec:apple-deposit:internet:simple:12m": ("internet", "simple"),
              "debec:apple-deposit:internet:compound:12m": ("internet", "compound"),
              "debec:apple-deposit:mobile:simple:12m": ("mobile", "simple"),
              "debec:apple-deposit:mobile:compound:12m": ("mobile", "compound"),
          }
          for group_id, (channel, method) in daebaek_expected.items():
              group = groups[group_id]
              assert group["status"] == "consistent"
              assert group["join_channel"] == channel
              assert group["interest_method"] == method
              assert group["official_max_rates"] == ["4.10"]
              assert len(group["records"]) == 1
              record = group["records"][0]
              assert record.get("capture_method") == "live_http_artifact"
              assert record.get("capture_run_id") == "32635180304"
              assert record.get("capture_artifact_id") == "9492104054"

          print("source runs:", report["source_runs"])
          print("summary:", summary)
          print("triage summary:", triage["summary"])
          print("official contradiction summary:", contradictions["summary"])
          print("dimension ambiguities:")
          for item in ambiguities:
              print(
                  item["side"], item["institution"], item["product"],
                  f"term={item['term_months']}",
                  f"variant={item['join_channel']}/{item['interest_method']}",
                  f"payment={item['candidate_payment_methods']}",
                  f"rates={[v.get('max_rate') for v in item['candidate_variants']]}",
              )
          print("priority queue:")
          for item in triage["queue"]:
              print(
                  f"#{item['rank']}", item["priority"], f"score={item['score']}",
                  item["classification"], item["institution"], item["product"],
                  f"term={item['term_months']}",
                  f"variant={item['join_channel']}/{item['interest_method']}",
                  f"delta={item['max_rate']['absolute_delta']}",
              )
          print("official contradiction queue:")
          for item in contradictions["queue"]:
              print(
                  f"#{item['rank']}", item["priority"], f"score={item['score']}",
                  item["classification"], item["institution"], item["official_product"],
                  f"official={item['official_max_rates']}",
                  f"consensus={item['source_consensus_max_rate']}",
              )
          PY

      - name: Upload discrepancy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-discrepancy-evidence-${{ github.run_id }}
          path: |
            work/source-discrepancy-report.json
            work/source-discrepancy-priority-queue.json
            work/source-discrepancy-official-contradictions.json
            docs/evidence/source-discrepancy/20260823-official-savings-bank.json
          retention-days: 30

      - name: Publish discrepancy audit conclusion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="Production-data payment-dimension audit passed"
          else
            STATE=failure
            DESCRIPTION="Production-data payment-dimension audit failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context=source-discrepancy-audit \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"
