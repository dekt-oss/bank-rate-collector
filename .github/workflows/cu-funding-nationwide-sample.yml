name: Diagnostic — CU funding nationwide sample

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cu-funding-disclosure-20260829
    paths:
      - src/rate_monitor/collectors/cu/funding.py
      - tests/test_cu_funding_year_format.py
      - scripts/cu_funding_nationwide_sample.py
      - .github/workflows/cu-funding-nationwide-sample.yml

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cu-funding-disclosure-20260829

      - name: Apply nationwide-evidence source-contract patch if needed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/rate_monitor/collectors/cu/funding.py")
          text = path.read_text(encoding="utf-8")
          changed = False

          old_year = '_YEAR = re.compile(r"(20\\d{2})\\s*년(?:도)?")'
          new_year = '_YEAR = re.compile(r"^\\s*(20\\d{2})(?:\\s*년(?:도)?|\\s*회계연도)?")'
          if old_year in text:
              text = text.replace(old_year, new_year, 1)
              changed = True
          elif new_year not in text:
              raise SystemExit("CU year regex가 expected old/new 어느 쪽도 아니다")

          old = '''    prior_disclosure_no: int | None = None

    for page in range(1, MAX_LIST_PAGES + 1):
'''
          new = '''    declared_total: int | None = None

    for page in range(1, MAX_LIST_PAGES + 1):
'''
          if old in text:
              text = text.replace(old, new, 1)
              changed = True
          elif new not in text:
              raise SystemExit("CU pagination prelude가 expected old/new 어느 쪽도 아니다")

          old = '''        for row in rows:
            returned = str(row.get("cuIngno") or "").strip()
            if returned != cu_ingno:
                raise CuFundingContractError(
                    "신협 공시목록 identity 불일치: "
                    f"requested={cu_ingno} returned={returned!r}"
                )
            raw_no = str(row.get("disclosureNo") or "").strip()
            if raw_no.isdigit():
                disclosure_no = int(raw_no)
                if prior_disclosure_no is not None and disclosure_no > prior_disclosure_no:
                    raise CuFundingContractError(
                        "신협 공시목록 최신순 계약 불일치: "
                        f"previous={prior_disclosure_no} current={disclosure_no}"
                    )
                prior_disclosure_no = disclosure_no
'''
          new = '''        for row in rows:
            returned = str(row.get("cuIngno") or "").strip()
            if returned != cu_ingno:
                raise CuFundingContractError(
                    "신협 공시목록 identity 불일치: "
                    f"requested={cu_ingno} returned={returned!r}"
                )

        page_totals = {
            int(str(row.get("listTotalCount")))
            for row in rows
            if str(row.get("listTotalCount") or "").isdigit()
        }
        if len(page_totals) > 1:
            raise CuFundingContractError(
                f"신협 공시목록 totalCount가 한 페이지 안에서 다르다: {sorted(page_totals)}"
            )
        if page_totals:
            page_total = next(iter(page_totals))
            if declared_total is None:
                declared_total = page_total
            elif declared_total != page_total:
                raise CuFundingContractError(
                    "신협 공시목록 totalCount가 페이지 사이에서 바뀌었다: "
                    f"expected={declared_total} actual={page_total}"
                )
'''
          if old in text:
              text = text.replace(old, new, 1)
              changed = True
          elif new not in text:
              raise SystemExit("CU monotonic block가 expected old/new 어느 쪽도 아니다")

          old = '''        all_rows.extend(rows)

        selected = select_latest_disclosures(
            all_rows,
            cu_ingno=cu_ingno,
            periods=periods,
        )
        totals = {
            int(str(row.get("listTotalCount")))
            for row in rows
            if str(row.get("listTotalCount") or "").isdigit()
        }
        total = max(totals) if totals else None
        if len(selected) >= periods:
            break
        if not rows or (total is not None and page * LIST_PAGE_SIZE >= total):
            break
        if request_interval:
            time.sleep(request_interval)
    else:
        raise CuFundingContractError(
            f"신협 공시목록 pagination이 {MAX_LIST_PAGES} page를 초과했다: {cu_ingno}"
        )
    return all_rows, artifacts
'''
          new = '''        all_rows.extend(rows)
        if declared_total is not None:
            if len(all_rows) > declared_total:
                raise CuFundingContractError(
                    "신협 공시목록 row 수가 declared total을 초과했다: "
                    f"rows={len(all_rows)} total={declared_total}"
                )
            if len(all_rows) == declared_total:
                break
        if not rows:
            break
        if declared_total is None and len(rows) < LIST_PAGE_SIZE:
            break
        if request_interval:
            time.sleep(request_interval)
    else:
        raise CuFundingContractError(
            f"신협 공시목록 pagination이 {MAX_LIST_PAGES} page를 초과했다: {cu_ingno}"
        )

    if declared_total is not None and len(all_rows) != declared_total:
        raise CuFundingContractError(
            "신협 공시목록 pagination 미완료: "
            f"rows={len(all_rows)} total={declared_total} cuIngno={cu_ingno}"
        )
    return all_rows, artifacts
'''
          if old in text:
              text = text.replace(old, new, 1)
              changed = True
          elif new not in text:
              raise SystemExit("CU early-break block가 expected old/new 어느 쪽도 아니다")

          if changed:
              path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/patch-cu-funding-list-contract.yml
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/rate_monitor/collectors/cu/funding.py .github/workflows/patch-cu-funding-list-contract.yml
            git commit -m "fix: align CU disclosure list parsing with nationwide evidence"
            git push origin HEAD:feat/cu-funding-disclosure-20260829
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore authoritative R2 database read-only baseline
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work data/raw publish
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3

      - name: Apply migrations to runner-local copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Run deterministic nationwide CU sample
        run: |
          set -euo pipefail
          uv run python scripts/cu_funding_nationwide_sample.py \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw \
            --json publish/cu-funding-nationwide-sample.json \
            --sample-size 24 \
            --periods 12 \
            --request-interval 1.0

      - name: Verify runner-local DB integrity
        run: |
          uv run python - <<'PY'
          import sqlite3
          c = sqlite3.connect("work/rate_monitor.sqlite3")
          assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          assert not c.execute("PRAGMA foreign_key_check").fetchall()
          print("runner-local integrity/FK PASS")
          PY

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cu-funding-nationwide-sample-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            publish/cu-funding-nationwide-sample.json
            data/raw/
