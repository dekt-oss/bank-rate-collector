name: Apply retry delay budget

on:
  push:
    branches:
      - agent/retry-wall-clock-budget

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retry-wall-clock-budget
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Apply patch
        run: python .github/dev/retry_delay_budget_patch.py

      - name: Verify
        run: |
          uv sync --locked
          uv run ruff check src tests scripts --fix
          uv run ruff check src tests scripts
          uv run pytest -q
          RATE_MONITOR_DB_URL=sqlite+pysqlite:///${{ runner.temp }}/retry-budget.sqlite3 uv run alembic upgrade head

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/dev/retry_delay_budget_patch.py
          git add -A
          git commit -m "fix: bound cumulative retry delay"
          git push origin HEAD:agent/retry-wall-clock-budget
