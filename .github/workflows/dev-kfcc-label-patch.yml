name: Temporary — apply KFCC display label patch

on:
  push:
    branches: [agent/kfcc-source-label]
    paths:
      - .github/workflows/dev-kfcc-label-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply label patch
        run: python scripts/dev_kfcc_label_patch.py
      - name: Static checks
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name dekt-oss
          git config user.email degackt@gmail.com
          git add src/rate_monitor/collectors/kfcc/adapter.py web/templates/site.html tests/test_kfcc_source_label.py
          git commit -m "fix: clarify KFCC user-facing source label"
          git push origin HEAD:agent/kfcc-source-label
