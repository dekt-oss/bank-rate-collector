name: Align source discrepancy test fixtures

on:
  push:
    branches: ["feat/source-discrepancy-dimension-ambiguity-20260823"]
    paths:
      - ".github/workflows/align-source-discrepancy-test-fixtures.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-discrepancy-dimension-ambiguity-20260823
          fetch-depth: 0
      - name: Align hand-built SQLite schemas and remove helper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("tests/test_source_discrepancy_service.py"),
              Path("tests/test_source_discrepancy_variant_freshness.py"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              old = """          join_channel TEXT,\n          interest_method TEXT\n        );\n"""
              new = """          join_channel TEXT,\n          interest_method TEXT,\n          payment_method TEXT\n        );\n"""
              assert text.count(old) == 1, (path, "schema")
              text = text.replace(old, new, 1)

              if path.name == "test_source_discrepancy_service.py":
                  old_insert = '        "INSERT INTO product_variants VALUES (?, ?, 12, ?, ?)",\n'
                  new_insert = (
                      '        "INSERT INTO product_variants "\n'
                      '        "(id, product_id, term_months, join_channel, interest_method) "\n'
                      '        "VALUES (?, ?, 12, ?, ?)",\n'
                  )
              else:
                  old_insert = '    conn.executemany("INSERT INTO product_variants VALUES (?, ?, ?, ?, ?)", variants)\n'
                  new_insert = (
                      '    conn.executemany(\n'
                      '        "INSERT INTO product_variants "\n'
                      '        "(id, product_id, term_months, join_channel, interest_method) "\n'
                      '        "VALUES (?, ?, ?, ?, ?)",\n'
                      '        variants,\n'
                      '    )\n'
                  )
              assert text.count(old_insert) == 1, (path, "insert")
              text = text.replace(old_insert, new_insert, 1)
              path.write_text(text, encoding="utf-8")

          PY
          git rm .github/workflows/align-source-discrepancy-test-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_source_discrepancy_service.py tests/test_source_discrepancy_variant_freshness.py
          git commit -m "test: align discrepancy fixtures with payment method schema"
          git push origin HEAD:feat/source-discrepancy-dimension-ambiguity-20260823
