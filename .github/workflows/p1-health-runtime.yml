name: Validate P1 collection health

on:
  push:
    branches: [agent/p1-collection-health]
    paths: [.github/workflows/p1-health-runtime.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-collection-health

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Decide storage backend
        id: storage
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          c = load_backend(Path('config/storage.yaml'))
          print(c.backend.value)
          ")
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "상태 저장소: $BACKEND"

      - name: Restore production state read-only
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          if [ "${{ steps.storage.outputs.backend }}" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          else
            git fetch origin rate-data --depth=1
            git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz
            gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3
          fi
          echo "복원 DB: $(stat -c%s work/rate_monitor.sqlite3) bytes"

      - name: Apply current migrations to copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Dump collection health
        run: |
          uv run python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from rate_monitor.services.source_health_service import build_collection_health
          db = Path('work/rate_monitor.sqlite3')
          conn = sqlite3.connect(db)
          try:
              health = build_collection_health(conn)
          finally:
              conn.close()
          Path('work/collection-health.json').write_text(
              json.dumps(health, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(health, ensure_ascii=False, indent=2))
          assert health['sources'], 'source health가 비었다'
          assert all(s['latest_attempt'] is not None for s in health['sources'] if s['enabled'])
          assert all(s['last_success_at'] is not None for s in health['sources'] if s['enabled'])
          PY

      - name: Snapshot
        run: |
          uv run rate-monitor snapshot \
            --db work/rate_monitor.sqlite3 \
            --publish-db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json

      - name: Validate stored data
        run: uv run rate-monitor validate --db publish/rate_monitor.sqlite3

      - name: Build dashboard
        run: |
          uv run rate-monitor build-dashboard \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/dashboard.html \
            --site site/index.html \
            --summary publish/summary.json

      - name: Export full dataset
        run: uv run rate-monitor export --db publish/rate_monitor.sqlite3 --out publish/export

      - name: Build public site
        run: |
          uv run rate-monitor build-site \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out site-public \
            --export-dir publish/export

      - name: Verify P1-A gate in publish-only mode
        run: |
          mkdir -p data/raw
          uv run python scripts/verify_gate.py \
            --db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json \
            --summary publish/summary.json \
            --site site/index.html \
            --raw-root data/raw \
            --no-collection

      - name: Verify built health UI contract
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('publish/summary.json').read_text(encoding='utf-8'))
          assert summary['collection_health']['sources']
          html = Path('site-public/index.html').read_text(encoding='utf-8')
          assert '수집 상태' in html
          assert 'api/health' in html
          assert Path('web/api/health.js').exists()
          print('collection_health sources:', len(summary['collection_health']['sources']))
          print('overall:', summary['collection_health']['overall'])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-health-runtime-${{ github.run_id }}
          retention-days: 90
          path: |
            work/collection-health.json
            publish/summary.json
            publish/manifest.json
            site-public/site-manifest.json
          if-no-files-found: warn
