name: Strategy responsive runtime audit temp

on:
  push:
    branches: [audit/strategy-responsive-runtime-20260830]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore current production database into isolated copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          test -s work/rate_monitor.sqlite3
      - name: Apply migrations
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head
      - name: Build isolated Strategy site from production data
        env:
          RATE_MONITOR_STRATEGY_DASHBOARD: "1"
        run: |
          set -euo pipefail
          uv run rate-monitor build-site \
            --db work/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out work/site-public
          test -s work/site-public/strategy.html
          test -s work/site-public/data/strategy-table.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright runner
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          npm install --no-save --package-lock=false @playwright/test@1.61.1
          node --check scripts/strategy_responsive_runtime_audit.js
      - name: Audit Strategy desktop and mobile runtime
        env:
          PRODUCTION_URL: http://127.0.0.1:4173
          AUDIT_SKIP_AUTH: "1"
        run: |
          set -euo pipefail
          mkdir -p work/strategy-responsive-audit
          python -m http.server 4173 --directory work/site-public > work/strategy-responsive-audit/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/strategy.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/strategy.html >/dev/null
          node scripts/strategy_responsive_runtime_audit.js | tee work/strategy-responsive-audit/summary.txt
      - name: Upload responsive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-responsive-runtime-audit-${{ github.run_id }}
          path: |
            work/strategy-responsive-audit/report.json
            work/strategy-responsive-audit/summary.txt
            work/strategy-responsive-audit/http.log
            work/strategy-responsive-audit/*.png
          retention-days: 30
          if-no-files-found: warn
