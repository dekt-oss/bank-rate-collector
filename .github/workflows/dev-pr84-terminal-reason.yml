name: Apply PR84 terminal reason review fix

on:
  push:
    branches:
      - agent/resumable-acquisition-common-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resumable-acquisition-common-v1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Apply and verify focused regression
        run: |
          python .github/dev/pr84_terminal_reason.py
          uv sync --locked
          uv run ruff check src tests scripts
          uv run pytest -q tests/test_checkpoint_sealed_audit.py tests/test_resumable_acquisition.py
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-pr84-terminal-reason.yml .github/dev/pr84_terminal_reason.py
          git add -A
          git commit -m "fix: preserve specific terminal checkpoint reason"
          git push origin HEAD:agent/resumable-acquisition-common-v1
