name: Strategy dashboard preview

on:
  push:
    branches: ["feat/strategy-dashboard-*"]
    paths:
      - "web/templates/strategy.html"
      - "web/templates/site.html"
      - "web/assets/**"
      - "src/rate_monitor/services/**"
      - "config/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/strategy_preview_smoke.js"
      - "scripts/product_scope_runtime_smoke.js"
      - "scripts/product_scope_insight_smoke.js"
      - "scripts/filter_decision_runtime_smoke.js"
      - "scripts/market_funding_preview_patch.py"
      - "scripts/market_funding_preview_smoke.js"
      - ".github/workflows/strategy-browser-smoke.yml"
      - ".github/workflows/strategy-preview.yml"
  workflow_dispatch:

# Production writer와 완전히 분리한다. 운영 DB는 read-only restore하고,
# 결과는 preview branches에만 publish한다. Preview patch를 제거하면 기존
# canonical build 결과로 바로 복귀한다.
concurrency:
  group: strategy-dashboard-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore current production database read-only
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          BACKEND=$(uv run python -c "from pathlib import Path; from rate_monitor.services.storage_service import load_backend; print(load_backend(Path('config/storage.yaml')).backend.value)")
          echo "preview source backend=$BACKEND"
          if [ "$BACKEND" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          else
            git fetch origin rate-data --depth=1
            git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz
            gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3
            rm -rf latest
          fi
          test -s work/rate_monitor.sqlite3
          echo "restored bytes=$(stat -c%s work/rate_monitor.sqlite3)"

      - name: Apply migrations to preview copy
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Build canonical Strategy preview source
        env:
          RATE_MONITOR_STRATEGY_DASHBOARD: "1"
        run: |
          set -euo pipefail
          uv run rate-monitor build-site \
            --db work/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out site-public
          test -s site-public/index.html
          test -s site-public/strategy.html
          test -s site-public/data/table.json
          test -s site-public/data/strategy-table.json

      - name: Apply isolated market-funding v2 preview patch
        run: |
          set -euo pipefail
          uv run python scripts/market_funding_preview_patch.py
          grep -q 'id="market-funding-preview"' site-public/index.html
          grep -q '수신시장 현황' site-public/index.html
          grep -q '업권별 수신잔액 추이' site-public/index.html
          grep -q '예금은행 수신 구조' site-public/index.html
          grep -q 'id="strategy-market-funding-preview"' site-public/strategy.html
          grep -q '시장 환경 요약' site-public/strategy.html
          grep -q '수신시장 현황 전체 보기' site-public/strategy.html
          grep -q '#external-market-context { display: none !important; }' site-public/strategy.html
          ! grep -q 'id="market-funding-preview"' site-public/strategy.html
          ! grep -q 'id="strategy-market-funding-preview"' site-public/index.html

      - name: Verify canonical Strategy contracts survived preview patch
        run: |
          set -euo pipefail
          grep -q "수신상품 전략 대시보드" site-public/strategy.html
          grep -q "경쟁사 TOP 5" site-public/strategy.html
          grep -q "우대조건 트렌드" site-public/strategy.html
          grep -q "신상품 기획 시뮬레이터" site-public/strategy.html
          grep -q 'id="prediction-toggle"' site-public/strategy.html
          grep -q 'id="prediction-panel"' site-public/strategy.html
          grep -q "내부 실적 미보정" site-public/strategy.html
          grep -q 'id="market-intelligence"' site-public/strategy.html
          grep -q 'id="external-market-context-script"' site-public/strategy.html
          grep -q "assets/korea-sido.svg" site-public/strategy.html
          grep -q "전략 대시보드" site-public/index.html

          python - <<'PY'
          import json
          from pathlib import Path

          html = Path("site-public/strategy.html").read_text(encoding="utf-8")
          marker = '<script id="rate-monitor-data" type="application/json">'
          start = html.index(marker) + len(marker)
          end = html.index("</script>", start)
          payload = json.loads(html[start:end].replace("<\\/", "</"))
          trend = payload["strategy"]["rate_trend"]
          assert trend["window_days"] == 63
          assert trend["scope"]["aggregation"] == "product_representative_mean"
          assert trend["scope"]["our_institution"] == "고려저축은행"
          model = payload["strategy"]["inflow_prediction"]
          assert model["version"] == "inflow-structural-v1"
          assert model["calibration_status"] == "uncalibrated"
          assert payload["strategy"]["external_features"]
          print(
              f"preview trend={len(trend['points'])} "
              f"model={model['version']}:{model['calibration_status']}"
          )
          PY

      - name: Verify Strategy inline JavaScript parses
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          html = Path("site-public/strategy.html").read_text(encoding="utf-8")
          data_marker = '<script id="rate-monitor-data" type="application/json">'
          data_start = html.index(data_marker)
          data_end = html.index("</script>", data_start)
          script_start = html.index("<script>", data_end) + len("<script>")
          script_end = html.index("</script>", script_start)
          Path("work/strategy-inline.js").write_text(html[script_start:script_end], encoding="utf-8")
          PY
          node --check work/strategy-inline.js

      - name: Stamp exact preview source
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("site-public/preview-source.json").write_text(
              json.dumps(
                  {
                      "source_ref": os.environ["SOURCE_REF"],
                      "source_sha": os.environ["SOURCE_SHA"],
                      "production": False,
                      "market_funding_preview": True,
                      "rollback": "discard preview branch / remove preview patch",
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Prepare preview-only Vercel config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          config["ignoreCommand"] = (
              '[ "$VERCEL_GIT_COMMIT_REF" != "preview/strategy-dashboard" ] '
              '&& [ "$VERCEL_GIT_COMMIT_REF" != "strategy-preview" ]'
          )
          Path("preview-vercel.json").write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish isolated preview branches
        run: |
          set -euo pipefail
          rm -rf preview-stage
          mkdir preview-stage
          cp -R site-public preview-stage/site-public
          cp preview-vercel.json preview-stage/vercel.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --detach
          git branch -D strategy-preview-new 2>/dev/null || true
          git checkout -q --orphan strategy-preview-new
          git rm -rf . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 -not -name .git -not -name preview-stage -exec rm -rf {} +
          cp -R preview-stage/site-public .
          cp preview-stage/vercel.json .
          rm -rf preview-stage

          git add -f site-public vercel.json
          git commit -q -m "preview: Strategy v2 market funding from ${{ github.sha }}"
          git push --force origin HEAD:preview/strategy-dashboard
          git push --force origin HEAD:strategy-preview
