name: Strategy dashboard preview

on:
  push:
    branches: ["feat/strategy-dashboard-*"]
    paths:
      - "web/templates/strategy.html"
      - "web/templates/site.html"
      - "web/assets/**"
      - "src/rate_monitor/services/site_service.py"
      - "src/rate_monitor/services/strategy_contract_service.py"
      - "src/rate_monitor/services/strategy_service.py"
      - "src/rate_monitor/domain/preference_taxonomy.py"
      - "config/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/strategy-preview.yml"
  workflow_dispatch:

# 운영 rate-data writer와 완전히 분리한다. 이 workflow는 운영 DB를 읽기만 하고
# preview/strategy-dashboard와 고정 review용 strategy-preview 브랜치만 갱신한다.
concurrency:
  group: strategy-dashboard-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore current production database read-only
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          print(load_backend(Path('config/sources.yaml')).backend)
          ")
          if [ "$BACKEND" = "local" ]; then
            git fetch --depth=1 origin rate-data
            git show origin/rate-data:rates.sqlite3 > work/rates.sqlite3
          else
            uv run rate-monitor storage-restore --config config/sources.yaml --db work/rates.sqlite3
          fi

      - name: Apply migrations to preview copy
        run: uv run alembic -c alembic.ini upgrade head
        env:
          RATE_MONITOR_DB: work/rates.sqlite3

      - name: Build strategy preview site
        run: |
          RATE_MONITOR_STRATEGY_DASHBOARD=1 uv run rate-monitor build-site \
            --db work/rates.sqlite3 \
            --out site-public

      - name: Audit strategy canonical inputs
        run: uv run python scripts/audit_strategy_inputs.py --site-dir site-public

      - name: Verify strategy inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("site-public/strategy.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?: [^>]*)?>(.*?)</script>", html, re.S)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("strategy inline JavaScript not found")
          Path("/tmp/strategy-inline.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/strategy-inline.js

      - name: Stamp preview source
        run: |
          printf '%s\n' "$GITHUB_SHA" > site-public/PREVIEW_SOURCE_SHA.txt

      - name: Prepare preview-only Vercel config
        run: |
          cat > site-public/vercel.json <<'JSON'
          {
            "cleanUrls": true,
            "trailingSlash": false,
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  {"key": "X-Robots-Tag", "value": "noindex, nofollow"},
                  {"key": "Cache-Control", "value": "public, max-age=0, must-revalidate"}
                ]
              }
            ]
          }
          JSON

      - name: Publish isolated preview branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/strategy-publish"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"
          cp -a site-public/. "$PUBLISH_DIR/"
          git fetch origin preview/strategy-dashboard strategy-preview || true
          rm -rf site-public
          git checkout --orphan preview/strategy-dashboard-next
          git rm -rf .
          cp -a "$PUBLISH_DIR/." .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "preview: strategy dashboard ${GITHUB_SHA}"
          PREVIEW_SHA=$(git rev-parse HEAD)
          git push --force origin "$PREVIEW_SHA:refs/heads/preview/strategy-dashboard"
          git push --force origin "$PREVIEW_SHA:refs/heads/strategy-preview"
