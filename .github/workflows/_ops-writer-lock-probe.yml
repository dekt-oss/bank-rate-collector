name: OPS — writer lock probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_ops-writer-lock-probe.yml"

concurrency:
  group: rate-data-writer
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "rate-data-writer lock acquired"
