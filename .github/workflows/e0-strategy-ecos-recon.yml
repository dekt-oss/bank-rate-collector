name: Diagnostic — Strategy ECOS external indicators

# Stage E0 source-contract discovery and verified-series probe only. This
# workflow never writes the production DB and does not publish Strategy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/e0_strategy_external_indicators_recon.py"
      - "scripts/e0_strategy_external_indicator_series_probe.py"
      - ".github/workflows/e0-strategy-ecos-recon.yml"

permissions:
  contents: read
  statuses: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Chat/GitHub connector can read commit statuses but cannot enumerate
      # push-triggered workflow runs. Publish only this run URL — never source
      # data — so the diagnostic artifact remains discoverable and auditable.
      - name: Publish diagnostic run locator
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=strategy-ecos-recon \
            -f description="ECOS external-indicator probe running" \
            -f target_url="$TARGET_URL"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Discover Strategy external indicator contracts
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: uv run python scripts/e0_strategy_external_indicators_recon.py

      - name: Probe verified Strategy external indicator series
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: uv run python scripts/e0_strategy_external_indicator_series_probe.py

      - name: Check the key never reached the reports
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          for REPORT in \
            docs/source-recon/strategy-external-indicators-recon.json \
            docs/source-recon/strategy-external-indicator-series-probe.json
          do
            if grep -qF "$ECOS_API_KEY" "$REPORT"; then
              echo "인증키가 $REPORT 에 남아 있다. 올리지 않는다."
              exit 1
            fi
          done
          echo "인증키 노출 0건"

      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-strategy-ecos-external-indicators
          path: |
            docs/source-recon/strategy-external-indicators-recon.json
            docs/source-recon/strategy-external-indicator-series-probe.json
          retention-days: 7

      - name: Mark diagnostic run successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=strategy-ecos-recon \
            -f description="ECOS external-indicator probe complete" \
            -f target_url="$TARGET_URL"
