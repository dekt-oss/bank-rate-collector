name: Retry NH on fresh runner

# Collect rates가 끝난 뒤, scheduled NH가 연결 계층에서 원본 0건으로 실패한 경우만
# 별도 workflow/job을 한 번 실행한다. workflow_run은 부모 job과 다른 GitHub-hosted
# runner를 받으므로 같은 Azure egress 경로에 묶인 in-job HTTP retry와 목적이 다르다.
on:
  workflow_run:
    workflows: ["Collect rates"]
    types: [completed]

# 부모 Collect rates, KFCC-only run, 은행권 경량 수집과 모두 같은 canonical DB/R2와
# rate-data 브랜치를 쓴다. fresh-runner retry도 단일 writer 계약 밖으로 나가지 않는다.
concurrency:
  group: rate-data-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  retry-nh:
    # 수동 custom scope를 부모 payload에서 안전하게 복원하지 않는다. 운영 장애가 발생한
    # scheduled 기본 scope만 자동 retry한다. 부모 workflow 자체가 실패했다면 canonical R2
    # commit 여부가 불명확하므로 fail-closed로 아무 것도 하지 않는다.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Decide storage backend
        id: storage
        env:
          STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          BACKEND=$(uv run python -c "
          from pathlib import Path
          from rate_monitor.services.storage_service import load_backend
          c = load_backend(Path('config/storage.yaml'))
          print(c.backend.value)
          import sys; print(f'backend={c.backend.value} ({c.source})', file=sys.stderr)
          ")
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "상태 저장소: $BACKEND"

      - name: Restore previous database
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work

          if [ "${{ steps.storage.outputs.backend }}" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
            exit 0
          fi

          if git ls-remote --exit-code --heads origin rate-data >/dev/null 2>&1; then
            git fetch origin rate-data --depth=1
            git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz 2>/dev/null || true
            if [ -f latest/rate_monitor.sqlite3.gz ]; then
              gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3
              echo "이전 DB 복원: $(stat -c%s work/rate_monitor.sqlite3) bytes"
            fi
            rm -rf latest
          else
            echo "rate-data 브랜치 없음. 새 DB로 시작한다."
          fi

      - name: Apply migrations
        env:
          RATE_MONITOR_DB_URL: sqlite+pysqlite:///${{ github.workspace }}/work/rate_monitor.sqlite3
        run: uv run alembic upgrade head

      - name: Decide NH fresh-runner retry
        id: decision
        env:
          PARENT_START: ${{ github.event.workflow_run.run_started_at }}
          PARENT_END: ${{ github.event.workflow_run.updated_at }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          uv run python -m rate_monitor.nh_runner_retry \
            --db work/rate_monitor.sqlite3 \
            --parent-start "$PARENT_START" \
            --parent-end "$PARENT_END" \
            --json work/nh-fresh-runner-decision.json >/dev/null

          ELIGIBLE=$(python -c "import json; print(str(json.load(open('work/nh-fresh-runner-decision.json'))['eligible']).lower())")
          REASON=$(python -c "import json; print(json.load(open('work/nh-fresh-runner-decision.json'))['reason_code'])")
          CYCLE_DATE=$(python -c "import json; print(json.load(open('work/nh-fresh-runner-decision.json'))['cycle_date_kst'])")
          FAILURE_CODE=$(python -c "import json; print(json.load(open('work/nh-fresh-runner-decision.json')).get('failure_code') or '')")
          RUN_ID=$(python -c "import json; print(json.load(open('work/nh-fresh-runner-decision.json')).get('collection_run_id') or '')")
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "cycle_date=$CYCLE_DATE" >> "$GITHUB_OUTPUT"
          echo "failure_code=$FAILURE_CODE" >> "$GITHUB_OUTPUT"
          echo "collection_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "NH fresh-runner eligible=$ELIGIBLE reason=$REASON code=$FAILURE_CODE run=$RUN_ID"

      - name: Upload retry decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-fresh-runner-decision-${{ github.run_id }}
          retention-days: 30
          path: work/nh-fresh-runner-decision.json
          if-no-files-found: warn

      - name: Collect NH on fresh runner
        id: retry_nh
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          uv run rate-monitor collect \
            --source nh_local \
            --resume auto \
            --cycle-date "${{ steps.decision.outputs.cycle_date }}" \
            --db work/rate_monitor.sqlite3 \
            --raw-root data/raw

      - name: Snapshot
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: |
          uv run rate-monitor snapshot \
            --db work/rate_monitor.sqlite3 \
            --publish-db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json

      - name: Validate stored data
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: uv run rate-monitor validate --db publish/rate_monitor.sqlite3

      - name: Build dashboard
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: |
          uv run rate-monitor build-dashboard \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/dashboard.html \
            --site site/index.html \
            --summary publish/summary.json

      - name: Export full dataset
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: |
          uv run rate-monitor export \
            --db publish/rate_monitor.sqlite3 \
            --out publish/export

      - name: Build public site
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: |
          uv run rate-monitor build-site \
            --db publish/rate_monitor.sqlite3 \
            --template web/templates/site.html \
            --out site-public \
            --export-dir publish/export

      - name: Verify P1-A gate
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: |
          uv run python scripts/verify_gate.py \
            --db publish/rate_monitor.sqlite3 \
            --manifest publish/manifest.json \
            --summary publish/summary.json \
            --site site/index.html \
            --raw-root data/raw

      - name: Volume gate
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: uv run python scripts/volume_gate.py --summary publish/summary.json

      - name: Stage rate-data payload
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        env:
          BACKEND: ${{ steps.storage.outputs.backend }}
        run: |
          set -euo pipefail
          rm -rf stage && mkdir -p stage/latest

          if [ "$BACKEND" = "r2" ]; then
            echo "backend=r2 — 상태 DB를 rate-data에 싣지 않는다"
          else
            gzip -kf publish/rate_monitor.sqlite3
            cp publish/rate_monitor.sqlite3.gz stage/latest/
          fi
          cp publish/manifest.json publish/summary.json stage/latest/
          cp -r site-public stage/site-public
          cp vercel.json stage/vercel.json
          cp -r web/api stage/api

      - name: Size gate
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: uv run python scripts/size_gate.py stage --backend ${{ steps.storage.outputs.backend }}

      - name: Upload retry raw and reports
        if: ${{ always() && steps.decision.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nh-fresh-runner-${{ github.run_id }}
          retention-days: 90
          path: |
            data/raw/
            publish/manifest.json
            publish/summary.json
            work/nh-fresh-runner-decision.json
          if-no-files-found: warn

      # 데이터 게이트가 모두 통과한 뒤에만 authoritative state를 바꾼다.
      - name: Upload state to R2
        if: ${{ steps.decision.outputs.eligible == 'true' && steps.storage.outputs.backend != 'github_legacy' }}
        continue-on-error: ${{ steps.storage.outputs.backend == 'r2_migration' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: uv run rate-monitor storage upload --db publish/rate_monitor.sqlite3

      - name: Publish to rate-data branch
        if: ${{ steps.decision.outputs.eligible == 'true' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin rate-data --depth=1 2>/dev/null || true
          BEFORE=$(git rev-parse origin/rate-data 2>/dev/null || echo "")

          for attempt in 1 2; do
            git checkout -q --detach 2>/dev/null || true
            git branch -D rate-data-new 2>/dev/null || true
            git checkout -q --orphan rate-data-new
            git rm -rq --cached . 2>/dev/null || true

            find . -maxdepth 1 -mindepth 1 \
              -not -name .git -not -name work -not -name publish \
              -not -name stage -not -name data -not -name site \
              -not -name site-public -exec rm -rf {} +
            rm -rf latest site site-public vercel.json api
            cp -r stage/latest stage/site-public stage/api .
            cp stage/vercel.json .

            git add -f latest site-public vercel.json api
            git commit -q -m "data: NH fresh-runner retry 갱신 (run ${{ github.run_id }})"

            if [ -n "$BEFORE" ]; then
              PUSH="git push --force-with-lease=rate-data:$BEFORE origin HEAD:rate-data"
            else
              PUSH="git push origin HEAD:rate-data"
            fi
            if $PUSH; then
              echo "push 성공 (시도 $attempt)"
              exit 0
            fi

            echo "push 거부됨. 원격이 그 사이 바뀌었다. 재시도 $attempt"
            git fetch origin rate-data --depth=1 2>/dev/null || true
            BEFORE=$(git rev-parse origin/rate-data 2>/dev/null || echo "")
          done
          echo "push 재시도 실패" >&2
          exit 1

      # collection 실패도 위에서 snapshot/R2/publish까지 기록한 뒤 workflow 자체는 실패로 보인다.
      # 이 workflow를 trigger하는 workflow_run은 없으므로 여기서 자동 retry 체인은 끝난다.
      - name: Surface failed NH retry
        if: ${{ always() && steps.decision.outputs.eligible == 'true' && steps.retry_nh.outcome == 'failure' }}
        run: |
          echo "::error::fresh runner에서도 NH 수집이 실패했다. 자동 재시도는 여기서 종료한다."
          exit 1
