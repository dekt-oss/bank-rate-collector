name: TEMP raw artifact path audit

on:
  push:
    branches:
      - fix/windows-posix-path-contract-20260826
    paths:
      - ".github/workflows/temp-raw-artifact-path-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore current production database into runner-local copy
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
        run: |
          set -euo pipefail
          mkdir -p work
          BACKEND=$(uv run python -c "from pathlib import Path; from rate_monitor.services.storage_service import load_backend; print(load_backend(Path('config/storage.yaml')).backend.value)")
          echo "audit source backend=$BACKEND"
          if [ "$BACKEND" = "r2" ]; then
            uv run rate-monitor storage restore --dest work/rate_monitor.sqlite3
          else
            git fetch origin rate-data --depth=1
            git checkout origin/rate-data -- latest/rate_monitor.sqlite3.gz
            gunzip -c latest/rate_monitor.sqlite3.gz > work/rate_monitor.sqlite3
          fi
          test -s work/rate_monitor.sqlite3

      - name: Audit persisted raw_artifacts path separators read-only
        run: |
          uv run python - <<'PY'
          import sqlite3

          conn = sqlite3.connect("file:work/rate_monitor.sqlite3?mode=ro", uri=True)
          try:
              table = conn.execute(
                  "SELECT 1 FROM sqlite_master WHERE type='table' AND name='raw_artifacts'"
              ).fetchone()
              if table is None:
                  raise SystemExit("raw_artifacts table is missing")
              total = conn.execute("SELECT COUNT(*) FROM raw_artifacts").fetchone()[0]
              backslash = conn.execute(
                  "SELECT COUNT(*) FROM raw_artifacts WHERE instr(relative_path, ?) > 0",
                  ("\\",),
              ).fetchone()[0]
              slash = conn.execute(
                  "SELECT COUNT(*) FROM raw_artifacts WHERE instr(relative_path, '/') > 0"
              ).fetchone()[0]
              print(f"raw_artifacts total={total} backslash_paths={backslash} slash_paths={slash}")
              samples = conn.execute(
                  "SELECT relative_path FROM raw_artifacts WHERE instr(relative_path, ?) > 0 LIMIT 5",
                  ("\\",),
              ).fetchall()
              for index, row in enumerate(samples, start=1):
                  print(f"backslash_sample_{index}={row[0]}")
          finally:
              conn.close()
          PY
