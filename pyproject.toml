[project]
name = "rate-monitor"
version = "0.1.0"
description = "전국 예·적금 공시금리 통합 조회·비교"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # R2(S3 호환) 상태 저장. 선행 수정안 v1 §6.2
    "boto3>=1.34",
]

[project.scripts]
rate-monitor = "rate_monitor.cli:main"
rate-monitor-checkpoint = "rate_monitor.checkpoint_cli:main"
rate-monitor-special-offer = "rate_monitor.special_offer_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rate_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# migrations/env.py는 alembic 런타임 컨텍스트가 있어야 import되므로 doctest 수집에서 뺀다.
addopts = "--doctest-modules --ignore=src/rate_monitor/db/migrations"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
# alembic이 생성한 마이그레이션은 손으로 고치지 않으므로 린트에서 뺀다.
extend-exclude = ["src/rate_monitor/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
# 전략 템플릿 원문을 exact-match하는 계약 문자열은 임의 줄바꿈하면 매칭값이 바뀐다.
"src/rate_monitor/services/strategy_contract_service.py" = ["E501"]
# 메인 지도 presentation은 브라우저에 그대로 주입하는 CSS/JS 원문이다.
# Python line wrapping으로 JS template literal을 훼손하지 않도록 E501만 제외한다.
"src/rate_monitor/services/main_map_presentation.py" = ["E501"]
# Public Structural v2 Cockpit도 build-time에 브라우저 CSS/JS를 그대로 주입한다.
# Python line wrapping이 SVG/JS template literal의 runtime source를 바꾸지 않게 E501만 제외한다.
"src/rate_monitor/services/public_structural_v2_cockpit_presentation.py" = ["E501"]
# 상품군 후속 UX도 shareable URL/empty-state/차트 JS를 build-time에 그대로 주입한다.
# template literal 및 query-state runtime 원문 보존을 위해 E501만 제외한다.
"src/rate_monitor/services/dashboard_product_scope_followup_presentation.py" = ["E501"]
# 적금 유형 차이 배지/스프레드 KPI도 브라우저 CSS/JS 원문을 build-time에 주입한다.
# runtime 문자열을 임의 줄바꿈하지 않도록 E501만 제외한다.
"src/rate_monitor/services/dashboard_product_scope_insight_presentation.py" = ["E501"]
# Relative Pricing R1도 Strategy에 CSS/HTML/JS 원문을 build-time 주입한다.
# 브라우저 template literal을 임의 줄바꿈하지 않고 E501만 제외한다.
"src/rate_monitor/services/relative_pricing_presentation.py" = ["E501"]
# 기관 수신 데이터 수집/감사 리포트는 계약 설명 문자열이 길다. 기능 검증과 별개인 E501만 제외한다.
"src/rate_monitor/collectors/data_go_funding/collector.py" = ["E501"]
"src/rate_monitor/collectors/data_go_funding/reconciliation.py" = ["E501"]
