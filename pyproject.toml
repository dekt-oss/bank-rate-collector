[project]
name = "rate-monitor"
version = "0.1.0"
description = "2금융권 수신금리 통합 모니터 — 부산 16개 구·군"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # R2(S3 호환) 상태 저장. 선행 수정안 v1 §6.2
    "boto3>=1.34",
]

[project.scripts]
rate-monitor = "rate_monitor.cli:main"
rate-monitor-checkpoint = "rate_monitor.checkpoint_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rate_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# migrations/env.py는 alembic 런타임 컨텍스트가 있어야 import되므로 doctest 수집에서 뺀다.
addopts = "--doctest-modules --ignore=src/rate_monitor/db/migrations"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
# alembic이 생성한 마이그레이션은 손으로 고치지 않으므로 린트에서 뺀다.
extend-exclude = ["src/rate_monitor/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# checkpoint core의 두 forward-reference 표기는 dataclass classmethod 반환형을
# 가까이 읽기 위한 것이고, tar open은 바로 다음 `with archive:`에서 닫힌다.
# E501 한 건은 예외 chain 문장이며 동작과 무관하다. PR 후속 정리 때 좁힌다.
"src/rate_monitor/services/resumable_acquisition.py" = ["UP037", "SIM115", "E501"]
