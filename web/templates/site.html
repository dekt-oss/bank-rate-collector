<!doctype html>
<html lang="ko">
<head>
<!-- charset을 빼면 안 된다.
     2026-08-06 Chromium 실측: 이 줄이 없으면 페이지에 박힌 한글 낱말
     ("새마을금고", "적금", "영업점")이 전부 깨져 나온다. table.json은
     fetch가 UTF-8로 읽어 멀쩡한데 화면 글자만 깨져서, 데이터가 잘못된
     것처럼 보인다. 호스팅이 charset 헤더를 붙여 주기를 기대하지 않는다. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 파비콘을 인라인으로 둔다. 없으면 브라우저가 /favicon.ico를 찾다 404를
     남기고, 그 404가 콘솔에서 진짜 오류처럼 보인다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232D5F7C'/%3E%3Ctext x='8' y='12' font-size='11' font-family='monospace' font-weight='bold' text-anchor='middle' fill='white'%3E%25%3C/text%3E%3C/svg%3E">
<title>2금융권 수신금리 조회 · rate-monitor</title>
<meta name="description" content="저축은행·새마을금고·신협의 공시 수신금리를 한 표에서 조회하고 파일로 내려받습니다. 공식 공시 화면에서 직접 수집한 값입니다.">
<!-- 검색엔진 색인에서 뺀다.
     주소를 아는 사람은 그대로 들어온다. 다만 "부산 금리" 같은 검색어로
     이 화면이 걸려 나오지는 않게 한다 — 공시금리를 옮겨 실은 화면이
     검색 결과에서 원천 공시처럼 보이면 안 된다 (v4 §17 금지사항과 같은
     취지다).

     이것만으로는 부족해서 세 겹으로 건다. 이 meta는 HTML을 읽는
     크롤러에게, robots.txt는 읽기 전에, vercel.json의 X-Robots-Tag는
     HTML이 아닌 파일(CSV·JSON)에까지 걸린다. -->
<meta name="robots" content="noindex, nofollow">
<style>
  /* ── 토큰 ──────────────────────────────────────────────────────────
     운영 보드(dashboard.html)·조회 화면(public.html)과 같은 색을 쓴다.
     같은 데이터를 세 화면이 다른 색으로 보여주면 같은 것인지 알 수 없다. */
  :root {
    --paper:      #EEF1F4;
    --surface:    #FFFFFF;
    --surface-2:  #F6F8FA;
    --line:       #D3DAE1;
    --line-soft:  #E4E9EE;
    --ink:        #171C23;
    --ink-2:      #4A5563;
    --ink-3:      #77828F;
    --accent:     #2D5F7C;
    --accent-ink: #24506A;
    --accent-bg:  #E5EDF2;
    --ok:         #2E7D5B;
    --warn:       #A9741A;
    --crit:       #AC4238;
    --ok-bg:      #E4F1EA;
    --warn-bg:    #F7EEDA;
    --crit-bg:    #F7E5E3;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
            "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Pretendard",
            "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10141A; --surface: #181D25; --surface-2: #1E242D;
      --line: #2C3540; --line-soft: #232B35;
      --ink: #E3E8EE; --ink-2: #A7B2BF; --ink-3: #7A8695;
      --accent: #6FA8C7; --accent-ink: #8CBEDA; --accent-bg: #1B2A34;
      --ok: #5DBE90; --warn: #D6A343; --crit: #E0776C;
      --ok-bg: #172C24; --warn-bg: #2E2718; --crit-bg: #2E1E1D;
    }
  }
  :root[data-theme="dark"] {
    --paper: #10141A; --surface: #181D25; --surface-2: #1E242D;
    --line: #2C3540; --line-soft: #232B35;
    --ink: #E3E8EE; --ink-2: #A7B2BF; --ink-3: #7A8695;
    --accent: #6FA8C7; --accent-ink: #8CBEDA; --accent-bg: #1B2A34;
    --ok: #5DBE90; --warn: #D6A343; --crit: #E0776C;
    --ok-bg: #172C24; --warn-bg: #2E2718; --crit-bg: #2E1E1D;
  }
  :root[data-theme="light"] {
    --paper: #EEF1F4; --surface: #FFFFFF; --surface-2: #F6F8FA;
    --line: #D3DAE1; --line-soft: #E4E9EE;
    --ink: #171C23; --ink-2: #4A5563; --ink-3: #77828F;
    --accent: #2D5F7C; --accent-ink: #24506A; --accent-bg: #E5EDF2;
    --ok: #2E7D5B; --warn: #A9741A; --crit: #AC4238;
    --ok-bg: #E4F1EA; --warn-bg: #F7EEDA; --crit-bg: #F7E5E3;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 14.5px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 22px 18px 64px; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; gap: 12px;
    padding-bottom: 14px; border-bottom: 2px solid var(--ink);
  }
  header.top h1 {
    margin: 0; font-size: 23px; font-weight: 650;
    letter-spacing: -0.015em; text-wrap: balance;
  }
  header.top .sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
  .stamp {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
    text-align: right; line-height: 1.7; font-variant-numeric: tabular-nums;
  }

  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  a.collect {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; text-decoration: none;
    padding: 6px 12px; border-radius: 6px;
    background: var(--surface); color: var(--accent-ink);
    border: 1px solid var(--accent);
  }
  a.collect:hover { background: var(--accent); color: #fff; }
  /* 누구나 눌러도 아무 일이 안 일어난다는 것을 미리 알린다. */
  a.collect .who {
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    color: var(--ink-3); border: 1px solid var(--line);
    border-radius: 3px; padding: 0 4px;
  }
  a.collect:hover .who { color: #fff; border-color: rgba(255,255,255,.5); }

  .notice {
    margin: 14px 0 0; padding: 9px 13px;
    background: var(--warn-bg); color: var(--warn);
    border-left: 3px solid var(--warn); border-radius: 2px;
    font-size: 12.5px; font-weight: 600;
  }
  .notice span { display: block; font-weight: 400; margin-top: 3px; }

  .totals {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line);
    border-radius: 3px; overflow: hidden; margin-top: 16px;
  }
  .totals > div { background: var(--surface); padding: 11px 14px; }
  .totals .k {
    font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600;
  }
  .totals .v {
    font-family: var(--mono); font-size: 21px; font-weight: 600;
    font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: -0.02em;
  }

  /* ── 내려받기 — 서버 파일을 그냥 가리킨다 ── */
  .files {
    margin-top: 16px; padding: 12px 14px;
    background: var(--accent-bg); border: 1px solid var(--line);
    border-radius: 3px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  }
  .files .lead { font-size: 13px; font-weight: 600; color: var(--accent-ink); }
  .files .hint { font-size: 12px; color: var(--ink-2); flex: 1 1 220px; }
  a.file {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; text-decoration: none;
    padding: 7px 13px; border-radius: 3px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line);
  }
  a.file:hover { border-color: var(--accent); color: var(--accent-ink); }
  a.file .sz {
    font-family: var(--mono); font-size: 11px; font-weight: 400;
    color: var(--ink-3); font-variant-numeric: tabular-nums;
  }

  .panel {
    margin-top: 16px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 3px;
  }
  .panel > h2 {
    margin: 0; padding: 10px 14px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
    border-bottom: 1px solid var(--line-soft);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel > h2 button {
    font: inherit; text-transform: none; letter-spacing: 0;
    background: none; border: 0; color: var(--accent);
    cursor: pointer; padding: 0; font-weight: 600;
  }
  .groups {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 0;
  }
  .group { padding: 12px 14px; border-right: 1px solid var(--line-soft);
           border-bottom: 1px solid var(--line-soft); }
  .group > .lbl {
    font-size: 11px; font-weight: 700; color: var(--ink-3);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 7px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .group > .lbl a {
    font-size: 11px; color: var(--accent); cursor: pointer;
    text-transform: none; letter-spacing: 0; font-weight: 600;
  }
  .checks { display: flex; flex-wrap: wrap; gap: 5px 12px; }
  .checks label {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .checks input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  .checks .n {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .fields { display: flex; flex-wrap: wrap; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 130px; }
  .field label { font-size: 11px; color: var(--ink-3); font-weight: 600; }
  .stale-note {
    margin: 9px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--ink-2);
  }
  .stale-note b { color: var(--warn); }
  input[type="search"], input[type="number"], input[type="date"], select {
    font: inherit; font-size: 13.5px; padding: 6px 8px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible,
  a:focus-visible, th[aria-sort] button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: space-between; padding: 11px 14px;
    background: var(--surface-2); border-top: 1px solid var(--line-soft);
  }
  .bar .count {
    font-family: var(--mono); font-size: 19px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--accent-ink);
  }
  .bar .note { font-size: 12.5px; color: var(--ink-2); }
  .bar .avg {
    font-size: 12.5px; color: var(--ink-2); margin-left: 10px;
    font-variant-numeric: tabular-nums;
  }
  .bar .avg b { color: var(--ink); font-weight: 650; }
  /* 분모가 다르다는 것을 값 옆에 붙여 둔다. 떼어 놓으면 안 읽힌다. */
  .bar .avg .den { color: var(--ink-3); font-size: 11.5px; margin-left: 4px; }
  .bar .avg .sep { color: var(--ink-3); margin: 0 7px; }
  .acts { display: flex; gap: 7px; flex-wrap: wrap; }
  button.act {
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 13px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
  }
  button.act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); }
  button.act:disabled { opacity: 0.45; cursor: default; }

  .scroll {
    margin-top: 16px; overflow-x: auto; background: var(--surface);
    border: 1px solid var(--line); border-radius: 3px;
  }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td {
    padding: 7px 11px; text-align: left;
    border-bottom: 1px solid var(--line-soft); white-space: nowrap;
  }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--surface-2); font-size: 10.5px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 700;
    border-bottom: 1px solid var(--line);
  }
  thead th button {
    font: inherit; background: none; border: 0; padding: 0; cursor: pointer;
    color: inherit; display: inline-flex; align-items: center; gap: 3px;
    letter-spacing: inherit; text-transform: inherit; font-weight: inherit;
  }
  thead th[aria-sort="ascending"] button,
  thead th[aria-sort="descending"] button { color: var(--accent-ink); }
  thead th button .car { font-size: 9px; opacity: 0.55; }
  thead th[aria-sort="ascending"] .car::after { content: "▲"; opacity: 1; }
  thead th[aria-sort="descending"] .car::after { content: "▼"; opacity: 1; }
  thead th[aria-sort="none"] .car::after { content: "↕"; }
  td.num, th.num { text-align: right; font-family: var(--mono);
                   font-variant-numeric: tabular-nums; }
  td.rate { font-family: var(--mono); font-variant-numeric: tabular-nums;
            font-weight: 700; text-align: right; }
  td.rate.top { color: var(--ok); }
  td.dim { color: var(--ink-3); }
  tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  tbody tr:hover { background: var(--accent-bg); }
  td.name { white-space: normal; min-width: 190px; }
  .tag {
    display: inline-block; margin-left: 5px; padding: 1px 5px;
    font-size: 10px; font-weight: 700; border-radius: 2px;
    background: var(--crit-bg); color: var(--crit); vertical-align: 1px;
  }
  .tag.sec { background: var(--accent-bg); color: var(--accent-ink); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .empty { text-align: center; color: var(--ink-3); padding: 30px; }
  .empty.bad { color: var(--crit); }
  .empty.bad code {
    display: block; margin-top: 6px; font-family: var(--mono);
    font-size: 11.5px; color: var(--ink-3);
  }
  .more { text-align: center; padding: 14px; }

  /* 표를 받는 동안 자리를 잡아 둔다. 다 받고 나서 화면이 튀지 않게. */
  .skeleton td { padding: 0; }
  .skeleton .b {
    height: 13px; margin: 8px 11px; border-radius: 2px;
    background: var(--line-soft);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) {
    .skeleton .b { animation: none; }
  }

  footer {
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-3); line-height: 1.75;
  }
  footer code { font-family: var(--mono); font-size: 11.5px; }
  .srcnote { margin-top: 12px; }
  .srcnote ul { margin: 6px 0 0; padding-left: 18px; }
  .srcnote li { margin-bottom: 7px; }
  .srcnote .how { color: var(--ink-3); }
  .srcnote .ref { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .basis-note { margin-top: 12px; }

  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 48px; }
  .marks { grid-template-columns: 1fr; }
    header.top h1 { font-size: 19px; }
    .group { border-right: 0; }
  }

  /* ── 참고카드 ─────────────────────────────────────────────────── */
  .marks {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px; margin: 14px 0 4px;
  }
  .mark {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .mark .t { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
  .mark .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mark .d { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  /* 구·군은 지역 조건 안에서 한 단 들여 편다. 지역의 하위 조건이라는 것이
     선 하나로 보여야 한다. */
  .gu-inline {
    margin-top: 9px; padding-left: 9px;
    border-left: 2px solid var(--accent-bg);
  }
  .gu-lbl {
    font-size: 11px; font-weight: 700; color: var(--ink-3);
    letter-spacing: 0.06em; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .gu-lbl a {
    font-size: 11px; color: var(--accent); cursor: pointer;
    letter-spacing: 0; font-weight: 600;
  }
  /* 점포가 없는 구도 지운다는 뜻이 아니라 흐리게만 둔다. 지우면 "없는 구"와
     "조건에 안 걸린 구"를 구별할 수 없다. */
  .gu-inline label[data-empty="1"] { opacity: .45; }

  /* ── 금리 기준 ────────────────────────────────────────────────── */
  .basis { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 9px; }
  .basis label {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .basis input { accent-color: var(--accent); margin: 0; }

  /* ── 우대조건 ─────────────────────────────────────────────────── */
  .pref { max-width: 22ch; }
  .pref button {
    border: 0; background: none; color: var(--accent); font: inherit;
    font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline;
  }
  tr.detail td { background: var(--paper); font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>2금융권 수신금리 조회</h1>
      <p class="sub" id="sub">금리표를 불러오는 중입니다…</p>
    </div>
    <div class="head-right">
      <div class="stamp" id="stamp"></div>
      <!-- 이 사이트는 서버가 없다. 페이지 안에서 수집을 돌릴 수 없으므로
           GitHub Actions 실행 화면으로 보낸다. 토큰을 페이지에 싣지 않으니
           실행 권한이 있는 사람만 실제로 돌릴 수 있다. 주소를 못 만들면
           (저장소 이름을 모르는 빌드) 버튼을 통째로 숨긴다. -->
      <a class="collect" id="collect" hidden target="_blank" rel="noopener">
        지금 수집하기 <span class="who">관리자</span>
      </a>
    </div>
  </header>

  <p class="notice">
    저축은행 공시금리 — 전국 본점 기준 참고값
    <span id="notice-detail"></span>
  </p>

  <!-- 마지막 수집이 실패한 원천. 화면에는 직전에 확인한 값이 남아 있으므로
       **그 사실을 반드시 알린다** — 조용히 어제 값을 보여주면 보는 사람은
       그게 오늘 확인된 것이라고 믿는다. -->
  <p class="notice" id="stale-notice" hidden></p>

  <div class="totals" id="totals"></div>

  <!-- 참고카드. 메인 4개 업권 순위에 포함되지 않는다 (v4 §10.6).
       값이 없으면 통째로 숨긴다 — 빈 카드는 "0%"로 읽힌다. -->
  <div class="marks" id="marks" hidden></div>

  <!-- 화면을 열지 않고도 받을 수 있어야 한다. 이 링크는 서버에 이미 있는
       파일을 그냥 가리킨다. 브라우저가 16만 행을 조립하지 않는다. -->
  <div class="files">
    <span class="lead">전체 자료 내려받기</span>
    <span id="file-links"></span>
    <span class="hint">조건을 걸어 고른 결과만 받으려면 아래 조회 조건을 정하고
      “조회 결과” 단추를 쓰세요.</span>
  </div>

  <!-- 조회 조건은 이 패널 전체가 받는다.
       `#groups`는 자바스크립트가 채우는 자리라 자기닫힘이고, 공시일·검색
       그룹은 그 **형제**다. 듣는 자리를 `#groups`로 잡으면 공시일의
       「전체」 링크가 영영 안 눌린다 (실제로 안 눌리고 있었다). -->
  <section class="panel" id="conditions">
    <h2>조회 조건 <button type="button" id="reset">조건 초기화</button></h2>
    <div class="groups" id="groups"></div>
    <!-- 공시일은 다른 항목과 성격이 다르다. 값이 수백 가지라 체크박스로는
         못 쓰고, "최근 것만"이 실제로 필요한 조건이다. -->
    <div class="group">
      <div class="lbl">공시일
        <a data-clear="asOf" role="button" tabindex="0">전체</a>
      </div>
      <div class="checks" id="asof-presets"></div>
      <!-- 시작·종료를 따로 준다. "최근 것만"으로는 "작년 6월에 무엇이
           있었나"를 물을 수 없다. 프리셋은 시작만 정하고 종료는 비운다. -->
      <div class="fields" style="margin-top:8px">
        <div class="field">
          <label for="dfrom">이 날짜부터</label>
          <input type="date" id="dfrom">
        </div>
        <div class="field">
          <label for="dto">이 날짜까지</label>
          <input type="date" id="dto">
        </div>
      </div>
      <p class="stale-note" id="stale-note"></p>
    </div>

    <div class="group" style="border-right:0">
      <div class="lbl">검색 · 범위</div>
      <!-- 어느 금리로 거르고 정렬할 것인가.
           기본금리는 거의 모든 행에 있고, 최고금리는 원천이 주는 곳에만
           있다 (실측 27.6%). 둘을 한 칸에서 섞어 물으면 답이 달라진 것을
           눈치채기 어려워서 축을 밖으로 꺼냈다. -->
      <div class="basis" id="basis">
        <label><input type="radio" name="basis" value="base" checked> 기본금리 기준</label>
        <label><input type="radio" name="basis" value="max"> 우대금리(최고) 기준</label>
      </div>
      <div class="fields">
        <div class="field">
          <label for="q">기관·상품 이름</label>
          <input type="search" id="q" placeholder="예: 정기적금, 국제시장" autocomplete="off">
        </div>
        <div class="field">
          <label for="rmin" id="rmin-label">기본금리 이상 (%)</label>
          <input type="number" id="rmin" step="0.1" min="0" placeholder="예: 3.0">
        </div>
        <div class="field">
          <label for="tmin">가입기간 최소 (개월)</label>
          <input type="number" id="tmin" step="1" min="0" placeholder="예: 12">
        </div>
        <div class="field">
          <label for="tmax">가입기간 최대 (개월)</label>
          <input type="number" id="tmax" step="1" min="0" placeholder="예: 36">
        </div>
      </div>
    </div>
    <div class="bar">
      <span>
        <span class="count" id="count">—</span>
        <span class="note" id="note"></span>
        <span class="avg" id="avg"></span>
      </span>
      <span class="acts">
        <button type="button" class="act" id="dl-view" disabled>조회 결과 CSV</button>
        <button type="button" class="act" id="dl-json" disabled>조회 결과 JSON</button>
      </span>
    </div>
  </section>

  <div class="scroll">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="more" hidden id="more-wrap">
    <button type="button" class="act" id="more">더 보기</button>
  </div>

  <footer id="foot"></footer>
</div>

<script id="rate-monitor-data" type="application/json">
{"totals":{},"table_url":"data/table.json"}
</script>

<script>
(() => {
  "use strict";
  // 이 페이지에는 금리표가 들어 있지 않다. 요약만 인라인돼 있고 표는
  // `table_url`에서 따로 받는다. 전국 16만 8천 행을 페이지에 박으면 8MB가
  // 되어 열 때마다 그만큼을 받아야 한다.
  const data = JSON.parse(document.getElementById("rate-monitor-data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (n) => (n == null ? "—" : Number(n).toLocaleString("ko-KR"));

  const SECTOR_KO = { savings_bank: "저축은행", kfcc: "새마을금고", cu: "신협",
                      bank: "은행", nh_local: "지역농축협" };
  const TYPE_KO = { term_deposit: "예금", installment_savings: "적금",
                    flexible_savings: "자유적립", demand_deposit: "입출금", other: "기타" };
  const CHANNEL_KO = { branch: "영업점", internet: "인터넷", mobile: "스마트폰",
                       telephone: "전화", agent: "모집인", any: "여러 채널", unknown: "미상" };
  const SCOPE_KO = { workplace_members: "직장금고", local_members: "지역·조합원",
                     nationwide: "제한없음", unknown: "미상" };
  const METHOD_KO = { simple: "단리", compound: "복리", unknown: "미표기" };

  // 지역근거 배지 (v4 §10.5). 같은 "부산"이라도 어디서 온 값인지가 다르다.
  const GEO_KO = {
    outlet_address: "점포 기준",
    source_query_region: "공식 조회지역",
    head_office: "본점 기준",
    nationwide: "전국 공시",
  };
  // 이 근거로 얻은 구·군을 정확 필터로 써도 되는가 (v4 §10.3).
  const GU_EXACT = new Set(["outlet_address"]);

  // 메인 비교표에 서는 업권.
  //
  // 시중은행은 2026-08-06 사용자 결정으로 들어왔다 (v4 §6.4 정정). 다른
  // 넷과 지역 근거가 다르므로 **배지 없이 섞으면 안 된다** (§17). 배지는
  // 아래 GEO_KO가 붙이고, 시도 필터에서의 예외는 NATIONWIDE_GEO가 맡는다.
  //
  // 한때 이 목록이 화면 위 «업권 탭»의 순서였다. 탭은 2026-08-07에 뺐다 —
  // 아래 조회 조건의 «권역»과 같은 축이라 같은 것을 두 곳에서 켜게 했다.
  // 목록은 남긴다. 어느 업권이 메인인지는 여전히 여기가 말한다.
  const MAIN_SECTORS = ["savings_bank", "kfcc", "nh_local", "cu", "bank"];

  // 전국 공시라 시도가 비어 있는 행. 시도를 골라도 남긴다.
  //
  // "지역 값이 없다"와 "그 지역에 해당하지 않는다"는 다르다. 전국 공시는
  // 고른 시도에서도 가입할 수 있다는 뜻이므로, 시도를 골랐다고 떨어뜨리면
  // 화면이 거짓말을 한다. 구·군의 GU_EXACT 규칙과 같은 취지다 (v4 §6.4).
  const NATIONWIDE_GEO = new Set(["nationwide"]);

  // 부산 16개 구·군 (v4 §4.3).
  //
  // 데이터에서 뽑지 않고 여기 적는다. 수집이 덜 됐거나 그 구에 점포가 없으면
  // 그 구가 화면에서 통째로 사라진다 — 없는 것과 0건은 다르다. 실제로
  // 농·축협은 영도구·중구에 점포가 없다.
  const BUSAN = ["강서구", "금정구", "기장군", "남구", "동구", "동래구",
                 "부산진구", "북구", "사상구", "사하구", "서구", "수영구",
                 "연제구", "영도구", "중구", "해운대구"];
  const BUSAN_SIDO = "부산";

  // ── 조회 조건 ────────────────────────────────────────────────────
  //
  // 기본값은 **아무 조건도 걸지 않은 전체 목록**이다. 체크를 하나도 안 한
  // 묶음은 "그 항목으로 거르지 않는다"는 뜻이고, 하나라도 켜면 켜진 것만
  // 남는다. 처음부터 전부 체크해두면 하나만 보려고 나머지를 다 꺼야 한다.
  // ── 가입기간 구간 ────────────────────────────────────────────────
  //
  // 개월값 그대로 체크박스를 만들면 46종이 나온다 (2026-08-06 발행 DB).
  // 고르기 어렵고, 대부분은 몇 건짜리 꼬리다. 구간으로 묶으면 여섯이다.
  //
  // 경계는 실측으로 정했다. 관측 150,311건 기준 각 구간의 몫이다.
  //
  //   3개월 이하  25,531  17.0%      13~24개월  26,427  17.6%
  //   4~6개월     21,829  14.5%      25~36개월  21,992  14.6%
  //   7~12개월    50,633  33.7%      37개월 이상 3,779   2.5%
  //
  // 60개월 초과는 **0건**이라 구간을 두지 않았다. 있지도 않은 칸을 두면
  // 언제나 0으로 보이고, 0이 "없다"인지 "안 걸렸다"인지 알 수 없다.
  //
  // 정확한 개월이 필요하면 아래 최소·최대 입력을 쓴다. 그쪽은 그대로 둔다.
  const TERM_BUCKETS = [
    { id: "0-3",   label: "3개월 이하",  lo: 0,  hi: 3 },
    { id: "4-6",   label: "4~6개월",    lo: 4,  hi: 6 },
    { id: "7-12",  label: "7~12개월",   lo: 7,  hi: 12 },
    { id: "13-24", label: "13~24개월",  lo: 13, hi: 24 },
    { id: "25-36", label: "25~36개월",  lo: 25, hi: 36 },
    { id: "37+",   label: "37개월 이상", lo: 37, hi: Infinity },
  ];
  const termBucket = (t) =>
    t == null ? null : (TERM_BUCKETS.find((b) => t >= b.lo && t <= b.hi) || null);

  // ── 우대조건 분류 ────────────────────────────────────────────────
  //
  // 코드→표시명은 `config/preference_rules.yaml`이 정하지만, 화면은 표를
  // 받기 전에도 그려져야 해서 여기 한 벌 둔다. 코드가 늘어 여기 없으면
  // 코드 그대로 나온다 — 사라지지는 않는다.
  const PREF_KO = {
    PRODUCT_HOLDING: "계좌·상품 보유", CARD_USAGE: "카드 이용",
    DIGITAL_CHANNEL: "비대면·가입채널", AUTO_PAYMENT: "자동이체·자동납부",
    PAYMENT_PERFORMANCE: "납입 실적", MAINTENANCE: "만기·유지",
    MEMBERSHIP: "회원·조합원", INCOME_TRANSFER: "급여·연금 수령",
    CONTRACT_CONDITION: "가입금액·기간", AGE_LIFE_STAGE: "연령·생애 조건",
    NEW_CUSTOMER: "신규·첫 거래", CONSENT_SERVICE: "동의·전자서비스",
    EVENT_REFERRAL: "이벤트·추천", REGION_AFFILIATION: "지역·소속",
    OTHER: "기타",
  };

  // 목록에서 앞에 세우는 분류. 2026-08-06 발행 DB에서 조건이 있는 8,876건
  // 기준으로 많은 순서다.
  //
  //   계좌·상품 보유 35.6%   카드 이용 35.1%   비대면·가입채널 30.3%
  //   자동이체 26.2%        납입 실적 22.8%
  //
  // 나머지는 뒤에 붙고, «기타»는 언제나 맨 끝이다. **기본 체크는 비운다** —
  // 처음부터 몇 개를 켜 두면 첫 화면이 이미 걸러진 상태가 되고, 그걸
  // 전체 목록으로 오해한다.
  const PREF_TOP = ["PRODUCT_HOLDING", "CARD_USAGE", "DIGITAL_CHANNEL",
                    "AUTO_PAYMENT", "PAYMENT_PERFORMANCE"];

  // 우대조건 원문의 세 상태. 셋을 뭉개면 화면이 거짓말을 한다 —
  // 새마을금고는 공식 화면에 우대금리 열 자체가 없어서 «미제공»이고,
  // 그걸 «없음»으로 적으면 우대금리가 없는 상품처럼 보인다 (v4 §3.3).
  const PREF_STATUS_KO = {
    present: "우대조건 있음", none: "우대조건 없음(원천 명시)",
    missing: "원천 미제공",
  };

  const GROUPS = [
    { key: "sector", label: "권역", ko: SECTOR_KO },
    { key: "type", label: "상품유형", ko: TYPE_KO },
    { key: "term", label: "가입기간", ko: null, buckets: TERM_BUCKETS },
    { key: "region", label: "지역", ko: null },
    { key: "channel", label: "가입채널", ko: CHANNEL_KO },
    { key: "scope", label: "가입제한", ko: SCOPE_KO },
    { key: "method", label: "이자방식", ko: METHOD_KO },
    { key: "prefStatus", label: "우대조건", ko: PREF_STATUS_KO, pref: true },
  ];
  const state = {
    picked: Object.fromEntries(GROUPS.map((g) => [g.key, new Set()])),
    q: "", rmin: null, tmin: null, tmax: null, dfrom: null, dto: null,
    basis: "base",    // 기본금리 기준 | max = 우대금리(최고) 기준
    sort: "base", dir: -1, shown: 100,
    // 구·군은 **지역 안에 둔다.** 부산을 켜야만 열리는 하위 조건이라 별도
    // 축이 아니다. 부산이 꺼지면 `gu`도 함께 비운다.
    //
    // 업권도 축을 하나만 둔다. 예전에는 화면 위 탭과 아래 «권역» 체크박스가
    // 따로 있었는데, 같은 것을 두 곳에서 켜면 어느 쪽이 이겼는지 화면으로
    // 알 수 없다. 탭을 뺐다 (2026-08-07).
    gu: new Set(),
    prefTags: new Set(),   // 세부 우대조건. 우대조건 그룹 안에서만 열린다
    open: new Set(),  // 우대조건을 펼친 행
  };
  const busanOn = () => state.picked.region.has(BUSAN_SIDO);

  let ALL = [];            // 표를 받기 전에는 비어 있다
  let latestAsOf = null;
  let PRESETS = [];

  const COLS = [
    { key: "sector", label: "권역", cell: (r) => esc(SECTOR_KO[r.sector] || r.sector) },
    { key: "institution", label: "기관", cls: "name",
      cell: (r) => esc(r.institution)
        + (r.scope === "workplace_members" ? '<span class="tag">직장</span>' : "") },
    { key: "district", label: "지역",
      // 지역 옆에 **그 지역이 어디서 왔는지**를 붙인다 (v4 §10.5).
      // 같은 "부산"이라도 점포 주소에서 온 것과 조회조건에서 온 것은 다르다.
      cell: (r) => {
        const where = r.district
          ? `${esc(r.district)} <span class="dim">${esc(r.region || "")}</span>`
          : (r.region ? `<span class="dim">${esc(r.region)}</span>` : "—");
        const badge = GEO_KO[r.geo];
        return where + (badge ? ` <span class="tag">${esc(badge)}</span>` : "");
      } },
    { key: "product", label: "상품", cls: "name",
      cell: (r) => esc(r.product)
        + (r.pay ? ` <span class="dim">${esc(r.pay)}</span>` : "") },
    { key: "type", label: "유형", cell: (r) => esc(TYPE_KO[r.type] || r.type) },
    { key: "term", label: "기간", cls: "num",
      cell: (r) => (r.term == null ? "—" : r.term) },
    { key: "base", label: "기본금리", cls: "rate",
      cell: (r) => (r.base == null ? "—" : r.base.toFixed(2) + "%") },
    { key: "max", label: "최고금리", cls: "rate top",
      cell: (r) => (r.max == null ? "—" : r.max.toFixed(2) + "%") },
    { key: "method", label: "이자", cls: "dim",
      cell: (r) => esc(METHOD_KO[r.method] || r.method) },
    { key: "channel", label: "채널", cls: "dim",
      cell: (r) => esc(CHANNEL_KO[r.channel] || r.channel) },
    { key: "scope", label: "가입제한", cls: "dim",
      cell: (r) => esc(SCOPE_KO[r.scope] || r.scope) },
    { key: "pref", label: "우대조건", cls: "pref",
      // 한 줄 요약 후 펼치기 (v4 §10.4). 원문이 길어 행 높이가 들쭉날쭉해지면
      // 표를 훑을 수 없다.
      //
      // **없음과 미제공을 가른다.** 원천이 우대금리 열 자체를 안 주는 곳이
      // 있다(새마을금고 93,819행, 농·축협 4,920행). 그걸 "없음"으로 적으면
      // 우대가 없는 상품처럼 보인다.
      cell: (r) => {
        if (!r.pref) {
          return r.max == null
            ? '<span class="dim">원천 미제공</span>'
            : '<span class="dim">—</span>';
        }
        const one = r.pref.replace(/\s+/g, " ").trim();
        const head = one.length > 24 ? one.slice(0, 24) + "…" : one;
        return `${esc(head)} <button type="button" data-pref="${esc(r._i)}">`
          + `${state.open.has(r._i) ? "접기" : "전문"}</button>`;
      } },
    { key: "source", label: "수집원", cls: "dim", cell: (r) => esc(r.source) },
    { key: "asOf", label: "공시일", cls: "dim num",
      cell: (r) => (r.asOf ? esc(r.asOf) : "—")
        + (isStale(r) ? '<span class="tag warn">오래됨</span>' : "") },
  ];

  // ── 공시일 ───────────────────────────────────────────────────────
  //
  // 원천마다 성격이 다르다. 새마을금고·신협은 조회 시점에 화면을 통째로
  // 다시 그려서 전부 오늘 날짜이고, 저축은행중앙회는 저축은행이 금리를
  // 마지막으로 제출한 날이 그대로 남아 2015년 것도 섞여 있다.
  //
  // 그 행이 "없어진 상품"인지 "금리가 오래 안 바뀐 상품"인지는 이 데이터로
  // 구분할 수 없다. 다만 조회한 날 화면에 나왔으므로 공시 자체는 살아 있다.
  // 그래서 **기본값은 전체**로 두고, 오래된 것이 몇 건인지 눈에 보이게 한다.
  const STALE_DAYS = 365;
  const daysBetween = (a, b) =>
    Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  // 오늘이 아니라 **데이터의 최신 공시일**을 기준으로 센다. 보는 시점이
  // 언제든 같은 결과가 나와야 한다.
  const isStale = (r) =>
    r.asOf && latestAsOf && daysBetween(r.asOf, latestAsOf) > STALE_DAYS;
  const shiftDays = (iso, days) => {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() - days);
    return d.toISOString().slice(0, 10);
  };

  // ── 표 그리기 ────────────────────────────────────────────────────
  const renderHead = () => {
    $("head").innerHTML = COLS.map((c) => {
      const sorted = state.sort === c.key
        ? (state.dir > 0 ? "ascending" : "descending") : "none";
      const cls = (c.cls || "").includes("num") || (c.cls || "").includes("rate")
        ? ' class="num"' : "";
      return `<th${cls} aria-sort="${sorted}">
        <button type="button" data-sort="${esc(c.key)}">
          ${esc(c.label)}<span class="car"></span>
        </button></th>`;
    }).join("");
  };

  const skeleton = (rows) => {
    $("rows").innerHTML = Array.from({ length: rows }, () =>
      `<tr class="skeleton">${COLS.map(() => '<td><div class="b"></div></td>').join("")}</tr>`
    ).join("");
  };

  const failed = (message, detail) => {
    $("rows").innerHTML = `<tr><td class="empty bad" colspan="${COLS.length}">`
      + esc(message) + (detail ? `<code>${esc(detail)}</code>` : "") + "</td></tr>";
    $("sub").textContent = "금리표를 불러오지 못했습니다";
    $("count").textContent = "—";
  };

  const countsOf = (key) => {
    const c = new Map();
    ALL.forEach((r) => {
      const v = r[key];
      if (v == null || v === "") return;
      c.set(v, (c.get(v) || 0) + 1);
    });
    return c;
  };

  const renderAsOf = () => {
    $("asof-presets").innerHTML = PRESETS.map((p) => {
      const n = ALL.filter((r) => r.asOf && r.asOf >= p.from).length;
      return `<label>
        <input type="radio" name="asof" data-from="${p.from}"
               ${state.dfrom === p.from ? "checked" : ""}>
        최근 ${p.days === 365 ? "1년" : p.days + "일"}
        <span class="n">${num(n)}</span>
      </label>`;
    }).join("");
    $("dfrom").value = state.dfrom || "";
    $("dto").value = state.dto || "";

    const stale = ALL.filter(isStale).length;
    $("stale-note").innerHTML = stale
      ? `공시일이 1년 넘게 갱신되지 않은 행이 <b>${num(stale)}건</b> 있습니다. `
        + `전부 저축은행 공시이고, 상품이 없어진 것인지 금리가 오래 바뀌지 `
        + `않은 것인지는 이 자료로 구분할 수 없습니다. 표에 <span class="tag warn">`
        + `오래됨</span> 표식을 붙였습니다.`
      : "모든 행이 최근 1년 안에 갱신되었습니다.";
  };

  // ── 부산 구·군 — 지역 조건 안에 인라인으로 편다 ──────────────────
  //
  // 부산을 켰을 때만 보인다. 0건인 구도 지우지 않는다 — 지운 구와 없는
  // 구를 구별할 수 없게 된다. 실제로 농·축협은 영도구·중구에 점포가 없다.
  const busanGuBoxes = () => {
    if (!busanOn()) return "";
    const counts = new Map();
    ALL.forEach((r) => {
      if (r.region === BUSAN_SIDO && GU_EXACT.has(r.geo) && r.district) {
        counts.set(r.district, (counts.get(r.district) || 0) + 1);
      }
    });
    const boxes = BUSAN.map((gu) => {
      const n = counts.get(gu) || 0;
      return `<label data-empty="${n ? 0 : 1}">
        <input type="checkbox" data-gu="${esc(gu)}"
               ${state.gu.has(gu) ? "checked" : ""}>
        ${esc(gu)}<span class="n">${num(n)}</span>
      </label>`;
    }).join("");
    return `<div class="gu-inline">
      <div class="gu-lbl">부산 구·군
        <a data-clear="gu" role="button" tabindex="0">전체</a>
      </div>
      <div class="checks">${boxes}</div>
    </div>`;
  };

  // 세부 우대조건. «우대조건 있음»을 켰을 때만 편다 — 미제공·없음 행에는
  // 붙일 분류가 없어서, 켜 두면 조건을 걸수록 결과가 비는 것처럼 보인다.
  const prefTagBoxes = () => {
    if (!state.picked.prefStatus.has("present")) return "";
    const counts = new Map();
    ALL.forEach((r) => {
      if (!r.prefTags) return;
      r.prefTags.forEach((code) => counts.set(code, (counts.get(code) || 0) + 1));
    });
    // 실측 상위를 앞에, 나머지는 건수 순, «기타»는 언제나 맨 끝.
    const rest = [...counts.keys()]
      .filter((c) => !PREF_TOP.includes(c) && c !== "OTHER")
      .sort((a, b) => counts.get(b) - counts.get(a));
    const order = PREF_TOP.filter((c) => counts.has(c))
      .concat(rest, counts.has("OTHER") ? ["OTHER"] : []);
    if (!order.length) return "";
    const boxes = order.map((code) => `<label>
      <input type="checkbox" data-preftag="${esc(code)}"
             ${state.prefTags.has(code) ? "checked" : ""}>
      ${esc(PREF_KO[code] || code)}<span class="n">${num(counts.get(code))}</span>
    </label>`).join("");
    return `<div class="gu-inline">
      <div class="gu-lbl">세부 조건
        <a data-clear="prefTags" role="button" tabindex="0">전체</a>
      </div>
      <div class="checks">${boxes}</div>
    </div>`;
  };

  const renderGroups = () => {
    $("groups").innerHTML = GROUPS.map((g) => {
      let boxes;
      if (g.buckets) {
        // 구간은 데이터에서 뽑지 않고 위 목록 순서 그대로 그린다. 0건인
        // 구간도 남긴다 — 구·군과 같은 이유다.
        const counts = new Map(g.buckets.map((b) => [b.id, 0]));
        ALL.forEach((r) => {
          const b = termBucket(r.term);
          if (b) counts.set(b.id, counts.get(b.id) + 1);
        });
        boxes = g.buckets.map((b) => `
          <label>
            <input type="checkbox" data-group="${esc(g.key)}" value="${esc(b.id)}"
                   ${state.picked[g.key].has(b.id) ? "checked" : ""}>
            ${esc(b.label)}
            <span class="n">${num(counts.get(b.id))}</span>
          </label>`).join("");
      } else {
        const counts = countsOf(g.key);
        const values = [...counts.keys()].sort((a, b) => {
          // 부산을 맨 앞에 둔다. 이 제품의 중심이라 건수 순서에 묻히면
          // 안 된다. 나머지는 건수 많은 순이다.
          if (g.key === "region") {
            if (a === BUSAN_SIDO) return -1;
            if (b === BUSAN_SIDO) return 1;
          }
          return counts.get(b) - counts.get(a);
        });
        boxes = values.map((v) => `
          <label>
            <input type="checkbox" data-group="${esc(g.key)}" value="${esc(v)}"
                   ${state.picked[g.key].has(String(v)) ? "checked" : ""}>
            ${esc(g.ko ? (g.ko[v] || v) : v)}
            <span class="n">${num(counts.get(v))}</span>
          </label>`).join("");
      }
      return `<div class="group">
        <div class="lbl">${esc(g.label)}
          <a data-clear="${esc(g.key)}" role="button" tabindex="0">전체</a>
        </div>
        <div class="checks">${boxes}</div>
        ${g.key === "region" ? busanGuBoxes() : ""}
        ${g.pref ? prefTagBoxes() : ""}
      </div>`;
    }).join("");
  };

  const matches = (r) => {
    // 구·군은 **정확 필터를 쓸 수 있는 근거일 때만** 거른다 (v4 §10.3).
    // 신협의 지역은 조회조건이고 저축은행은 본점 소재지라, 그걸 구 단위
    // 정확 필터로 쓰면 그 구에 없는 지점을 있다고 말하는 셈이 된다.
    // 그런 행은 구를 골라도 남기고 화면이 배지로 성격을 밝힌다.
    if (busanOn() && state.gu.size && GU_EXACT.has(r.geo)
        && !state.gu.has(r.district)) {
      return false;
    }
    for (const g of GROUPS) {
      const picked = state.picked[g.key];
      if (!picked.size) continue;
      // 시도만 예외다. 전국 공시 행은 시도가 비어 있지만 고른 시도에서도
      // 가입할 수 있다 — 떨어뜨리면 "그 지역에 없다"고 말하는 셈이다.
      if (g.key === "region" && NATIONWIDE_GEO.has(r.geo)) continue;
      if (g.buckets) {
        const b = termBucket(r.term);
        if (!b || !picked.has(b.id)) return false;
        continue;
      }
      if (!picked.has(String(r[g.key]))) return false;
    }
    // 세부 우대조건은 **하나라도 걸리면** 통과다. 조건은 여러 개가 함께
    // 붙는 것이라 전부 만족을 요구하면 거의 아무것도 안 남는다.
    if (state.prefTags.size) {
      if (!r.prefTags || !r.prefTags.size) return false;
      let hit = false;
      state.prefTags.forEach((code) => { if (r.prefTags.has(code)) hit = true; });
      if (!hit) return false;
    }
    // 공시일이 없는 행은 날짜 조건을 걸면 빠진다. 모르는 값을 통과시키면
    // "최근 것만" 골랐는데 언제 것인지 모르는 행이 섞여 든다.
    if (state.dfrom != null && !(r.asOf && r.asOf >= state.dfrom)) return false;
    if (state.dto != null && !(r.asOf && r.asOf <= state.dto)) return false;
    // 금리 하한은 고른 기준으로 잰다. 우대금리 기준일 때 최고금리가 없는
    // 행은 여기서 빠진다 — 원천이 안 준 것을 기본금리로 메우면 우대금리가
    // 있는 상품처럼 보인다 (v4 §3.3).
    if (state.rmin != null && !(rateOf(r) >= state.rmin)) return false;
    if (state.tmin != null && !(r.term >= state.tmin)) return false;
    if (state.tmax != null && !(r.term <= state.tmax)) return false;
    if (state.q) {
      const hay = `${r.institution} ${r.product} ${r.region || ""} ${r.district || ""}`;
      if (!hay.toLowerCase().includes(state.q)) return false;
    }
    return true;
  };

  // 지금 고른 기준의 금리. 없으면 null이고 절대 다른 값으로 메우지 않는다.
  const rateOf = (r) => (state.basis === "max" ? r.max : r.base);

  // 평균. 값이 있는 행만 세고 그 건수를 함께 돌려준다.
  //
  // 최고금리는 전체의 27.6%에만 있다 (2026-08-06 발행 DB). 새마을금고와
  // 농·축협은 공식 화면에 우대금리 열 자체가 없다. 없는 것을 0으로 세면
  // 평균이 통째로 거짓이 되므로, 분모를 숨기지 않고 같이 적는다.
  const average = (rows, pick) => {
    let sum = 0, n = 0;
    rows.forEach((r) => {
      const v = pick(r);
      if (v == null) return;
      sum += v; n += 1;
    });
    return n ? { avg: sum / n, n } : null;
  };

  const cmp = (a, b) => {
    const x = a[state.sort], y = b[state.sort];
    if (x == null && y == null) return 0;
    if (x == null) return 1;      // 빈 값은 방향과 무관하게 뒤로 보낸다
    if (y == null) return -1;
    if (typeof x === "number" && typeof y === "number") return (x - y) * state.dir;
    return String(x).localeCompare(String(y), "ko") * state.dir;
  };

  let current = [];

  // 건수 옆의 평균. **지금 걸린 조건의 결과 전부**로 낸다 — 화면에 보이는
  // 100건이 아니다. 보이는 것만으로 내면 정렬을 바꿀 때마다 평균이 움직인다.
  const renderAvg = () => {
    if (!current.length) { $("avg").textContent = ""; return; }
    const base = average(current, (r) => r.base);
    const parts = [];
    if (base) parts.push(`기본금리 평균 <b>${base.avg.toFixed(2)}%</b>`);
    // 최고금리는 분모가 다르다. 건수를 안 적으면 같은 모집단의 평균처럼
    // 읽힌다 — 실제로는 원천이 준 행에서만 낸 값이다.
    const max = average(current, (r) => r.max);
    if (max) {
      const missing = current.length - max.n;
      parts.push(`최고금리 평균 <b>${max.avg.toFixed(2)}%</b>`
        + `<span class="den">${num(max.n)}건 기준`
        + (missing ? ` · ${num(missing)}건은 원천 미제공` : "") + `</span>`);
    }
    // 여러 기간·상품유형을 한데 섞은 단순 평균이다. 시장금리가 아니다.
    $("avg").innerHTML = parts.join('<span class="sep">·</span>');
  };

  const render = () => {
    current = ALL.filter(matches).sort(cmp);
    const slice = current.slice(0, state.shown);

    $("count").textContent = num(current.length) + "건";
    $("note").textContent = current.length > slice.length
      ? `중 ${num(slice.length)}건 표시` : (current.length ? "전부 표시" : "");
    renderAvg();

    $("rows").innerHTML = slice.length
      ? slice.map((r) => {
          const row = "<tr>" + COLS.map((c) =>
            `<td class="${c.cls || ""}">${c.cell(r)}</td>`).join("") + "</tr>";
          // 펼친 행만 원문을 붙인다. 전부 붙이면 표를 훑을 수 없다.
          if (!state.open.has(r._i) || !r.pref) return row;
          return row + `<tr class="detail"><td colspan="${COLS.length}">`
            + `${esc(r.pref)}</td></tr>`;
        }).join("")
      : `<tr><td class="empty" colspan="${COLS.length}">조건에 맞는 상품이 없습니다</td></tr>`;

    $("more-wrap").hidden = current.length <= slice.length;
    renderHead();
  };

  // ── 조건에 맞는 것만 내려받기 ────────────────────────────────────
  //
  // 전체 파일은 서버에 있는 것을 그냥 링크로 건다(위 .files). 여기는 화면에서
  // 고른 결과라 서버에 없다. 그것만 브라우저가 만든다.
  // BOM을 붙여야 엑셀이 한글을 깨지 않고 연다.
  const HEAD = ["권역", "기관", "시도", "구·군", "상품", "상품유형", "가입기간(개월)",
                "지급방식", "이자방식", "가입채널", "기본금리(%)", "최고금리(%)",
                "가입제한", "수집원", "공시기준일", "1년내갱신"];
  const flat = (r) => [
    SECTOR_KO[r.sector] || r.sector, r.institution, r.region || "", r.district || "",
    r.product, TYPE_KO[r.type] || r.type, r.term,
    r.pay || "", METHOD_KO[r.method] || r.method, CHANNEL_KO[r.channel] || r.channel,
    r.base == null ? "" : r.base.toFixed(2),
    r.max == null ? "" : r.max.toFixed(2),
    SCOPE_KO[r.scope] || r.scope, r.source, r.asOf || "",
    isStale(r) ? "아니오" : "예",
  ];
  const cell = (v) => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const toCsv = (rows) => "﻿" + [HEAD.join(",")]
    .concat(rows.map((r) => flat(r).map(cell).join(","))).join("\r\n");
  const toJson = (rows) => JSON.stringify({
    generated_at: data.generated_at,
    notice: data.notice,
    count: rows.length,
    columns: HEAD,
    // flat()을 열마다 다시 부르면 행 하나에 15번씩 돈다. 한 번만 편다.
    records: rows.map((r) => {
      const v = flat(r);
      return Object.fromEntries(HEAD.map((h, i) => [h, v[i]]));
    }),
  }, null, 2);

  const download = (name, text, mime) => {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  // 파일명은 ASCII로 짓는다.
  //
  // 2026-08-05 Chromium 실측: `a.download`에 한글이 들어가면 그 값을 통째로
  // 버리고 확장자 없는 `download`로 저장한다. 확장자가 없으면 엑셀이 연결
  // 프로그램을 못 찾는다. 같은 조건에서 ASCII 이름은 그대로 살아남는다.
  const stamp = (data.generated_at || "").slice(0, 10) || "latest";

  // ── 요약 — 표를 받기 전에 그린다 ─────────────────────────────────
  const t = data.totals || {};
  $("totals").innerHTML = [
    // 관측은 `totals.observations`(이력 전체)가 아니라 표에 실린 행 수다.
    // 화면이 보여주는 것과 다른 수를 머리에 띄우면 둘 중 뭐가 맞는지 모른다.
    ["관측", num(data.table_rows)],
    ["기관", num(t.institutions)],
    ["상품", num(t.products)],
    ["수집원", num((data.sources || []).filter((s) => s.observation_count > 0).length)],
    ["구·군", num((data.by_district || []).length)],
  ].map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

  $("stamp").innerHTML =
    `생성 ${esc((data.generated_at || "").slice(0, 19).replace("T", " "))} KST`;

  // ── 참고카드 (v4 §10.6) ──────────────────────────────────────────
  //
  // 메인 4개 업권 순위에 포함되지 않는다. 값이 없으면 카드를 통째로
  // 숨긴다 — 빈 카드를 띄우면 "0%"로 읽힌다.
  //
  // **기준금리와 예금금리의 차이를 계산해 보여주지 않는다** (v4 §7.4).
  // 그 뺄셈을 "수익"이나 "마진"이라 부르는 순간 참고지표가 아니라 권유가 된다.
  const marks = data.benchmarks || {};
  const cards = [];
  const bok = marks.bok_base_rate;
  if (bok && bok.value != null) {
    cards.push([esc(bok.name || "한국은행 기준금리"),
                `${Number(bok.value).toFixed(2)}%`,
                `적용일 ${esc(bok.source_effective_at || "—")}`
                + (bok.checked_at
                    ? ` · 확인 ${esc(bok.checked_at.slice(0, 10))}` : "")]);
  }
  const cb = marks.commercial_bank_12m;
  if (cb) {
    cards.push(["시중은행 12개월 정기예금",
                cb.median == null ? "—" : `${Number(cb.median).toFixed(2)}%`,
                `기본금리 중앙값 · ${num(cb.institution_count)}개 은행`]);
    if (cb.max != null) {
      cards.push(["시중은행 최고금리 상단", `${Number(cb.max).toFixed(2)}%`,
                  `우대 포함 · ${num(cb.record_count)}건 중`]);
    }
  }

  // 2금융권 카드. 저축은행·새마을금고·신협·농·축협을 묶은 값이다.
  //
  // 시중은행과 **한 카드로 합치지 않는다.** 전국 공시(은행)와 점포 기준
  // (금고·농·축협)이 한 숫자에 섞이면 그 값이 무엇의 평균인지 말할 수
  // 없게 된다 (v4 §4.1).
  const st = marks.second_tier_12m;
  if (st) {
    if (st.mean != null) {
      cards.push(["2금융권 12개월 정기예금",
                  `${Number(st.mean).toFixed(2)}%`,
                  `기본금리 평균 · ${num(st.institution_count)}개 기관`
                  + (st.median == null
                      ? "" : ` · 중앙값 ${Number(st.median).toFixed(2)}%`)]);
    }
    if (st.max != null) {
      // **분모를 반드시 적는다.** 새마을금고·농·축협은 원천에 우대금리 열
      // 자체가 없어서, 이 상단은 최고금리를 준 기관에서만 나온 값이다.
      cards.push(["2금융권 최고금리 상단", `${Number(st.max).toFixed(2)}%`,
                  `우대 포함 · ${num(st.max_record_count)}건 중`
                  + (st.record_count > st.max_record_count
                      ? ` (나머지 ${num(st.record_count - st.max_record_count)}건은 원천 미제공)`
                      : "")]);
    }
  }
  if (cards.length) {
    $("marks").hidden = false;
    $("marks").innerHTML = cards.map(([t, v, d]) =>
      `<div class="mark"><div class="t">${esc(t)}</div>`
      + `<div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`).join("");
  }

  // ── 전체 자료 링크 ───────────────────────────────────────────────
  //
  // 주소도 크기도 빌드가 정한다. 큰 파일은 압축해서 싣기 때문에 화면이
  // 이름을 미리 알 수 없다 — 전국 내보내기 JSON은 53 MB라 .gz로 나간다.
  const size = (n) => (n >= 1048576
    ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB");
  const LABEL = { csv: "CSV", json: "JSON" };
  const links = Object.entries(data.downloads || {});
  $("file-links").innerHTML = links.length
    ? links.map(([kind, f]) => `<a class="file" href="${esc(f.url)}" download>`
        + `${esc(LABEL[kind] || kind)}${f.compressed ? " (압축)" : ""} `
        + `<span class="sz">${esc(size(f.bytes))}</span></a>`).join(" ")
    : '<span class="hint">준비된 파일이 없습니다.</span>';

  const stale = data.stale_sources || [];
  if (stale.length) {
    const when = (t) => esc(String(t || "").slice(0, 16).replace("T", " "));
    $("stale-notice").hidden = false;
    $("stale-notice").innerHTML =
      `마지막 수집이 실패한 원천이 ${stale.length}곳 있습니다. `
      + "아래 표의 해당 원천 값은 그 이전에 확인된 것입니다."
      + stale.map((s) =>
          `<span>${esc(s.source_id)} — 실패 ${when(s.failed_at)}`
          + `, 표시 중인 값은 ${when(s.showing_from)} 확인분</span>`).join("");
  }

  $("notice-detail").textContent =
    "저축은행 금리는 본점 기준 공시라 지점별 적용금리가 아닙니다. "
    + "새마을금고는 공식 화면에 우대금리 열이 없어 최고금리가 비어 있습니다. "
    + "신협의 지역은 조회 조건이며 점포 주소가 아닙니다. "
    + "지역 표시는 주소에서 뽑은 파생값이고 행정구역 공식 코드가 아닙니다.";

  // ── 수집원 주석 ──────────────────────────────────────────────────
  //
  // 표의 «수집원» 칸에는 `fsb`, `kfcc` 같은 코드가 그대로 찍힌다. 그게
  // 무엇이고 어디서 온 값인지는 화면 어디에도 없었다.
  //
  // 목록은 DB의 `sources`가 정하고 (`data.sources`), 설명 문장만 여기 둔다.
  // 코드에 목록을 박으면 수집원이 늘었을 때 주석만 조용히 뒤처진다.
  // 아래에 없는 수집원이 들어오면 이름과 근거 주소만이라도 나온다.
  // [무엇을 봤나, 그래서 무엇을 조심해야 하나]. **어떻게 받았는지는 여기
  // 적지 않는다** — 그건 DB의 `mode`가 말한다. 두 곳에 적으면 "공시 화면
  // 공시 화면 조회"처럼 겹쳐 나온다.
  const SOURCE_NOTE = {
    fsb: ["저축은행중앙회 소비자포털",
          "지역은 <b>본점 소재지</b>입니다. 그 지점의 적용금리가 아닙니다."],
    finlife_savings_bank: ["금융감독원 금융상품통합비교공시 — 저축은행",
          "전국 공시입니다. 저축은행중앙회와 겹치는 상품은 표에서 물러납니다."],
    finlife_bank: ["금융감독원 금융상품통합비교공시 — 시중은행",
          "전국 공시라 시도·구·군에 매이지 않습니다. 표에서는 "
          + "<b>전국 공시</b> 배지가 붙습니다."],
    kfcc: ["새마을금고 금고위치안내 · 금고별 금리",
          "지역은 <b>점포 주소</b>에서 뽑았습니다. 공식 화면에 우대금리 열이 "
          + "없어 최고금리가 비어 있습니다."],
    cu: ["신협 전자공시 금리비교",
          "지역은 <b>조회 조건</b>이며 점포 주소가 아닙니다."],
    nh_local: ["농협 금융상품몰 농·축협별 예금금리",
          "점포마다 따로 받습니다. 지역은 <b>점포 주소</b>에서 뽑았습니다. "
          + "이 화면의 우대조건 칸에는 조건이 아니라 <b>상품 설명</b>이 오는 "
          + "경우가 많아, 세부 조건 분류에서는 대부분 «기타»로 잡힙니다."],
    bok_ecos: ["한국은행 ECOS",
          "금융상품이 아니라 지표입니다. 위 참고카드에만 나오고 표에는 "
          + "없습니다."],
  };
  const MODE_KO = { api: "공식 오픈API", http: "공시 화면 조회" };

  const sourceNotes = (data.sources || [])
    // 한 건도 안 들어온 수집원은 적지 않는다. 없는 것을 설명하면 화면에
    // 있는 줄 알게 된다.
    .filter((s) => s.observation_count > 0 || s.id === "bok_ecos")
    .map((s) => {
      const [what, caveat] = SOURCE_NOTE[s.id] || [esc(s.name || s.id), ""];
      const how = MODE_KO[s.mode] || s.mode || "";
      return `<li><code>${esc(s.id)}</code> — ${what}`
        + (how ? ` <span class="how">${esc(how)}</span>` : "")
        + (caveat ? `<br>${caveat}` : "")
        + (s.base_reference ? `<br><span class="ref">${esc(s.base_reference)}</span>` : "")
        + "</li>";
    }).join("");

  $("foot").innerHTML =
    "이 표의 모든 수치는 공식 공시 화면에서 직접 수집해 SQLite에 저장한 값을 "
    + "집계한 것입니다. 하드코딩된 값이 없습니다.<br>"
    + "가입 전에는 반드시 해당 기관의 공식 안내를 확인하세요. "
    + "우대금리는 조건을 모두 충족했을 때의 값입니다."
    + (sourceNotes
        ? `<div class="srcnote"><b>표의 «수집원» 칸이 뜻하는 것</b>`
          + `<ul>${sourceNotes}</ul></div>`
        : "")
    + `<div class="basis-note">근거 — <code>site-manifest.json</code> · `
    + `<code>data/table.json</code>`
    // 「이 데이터를 얼마나 믿을 수 있나」로 가는 길. 무엇이 검사되고 무엇이
    // 검사되지 않는지, 업무에서 이렇게 말하면 안 되는 것이 무엇인지 적혀
    // 있다. 화면에 다 적으면 아무도 안 읽으므로 링크로 둔다.
    + (data.data_trust_url
        ? ` · <a href="${esc(data.data_trust_url)}" target="_blank"`
          + ` rel="noopener">이 데이터를 얼마나 믿을 수 있나</a>`
        : "")
    + `</div>`;

  if (data.collect_workflow_url) {
    $("collect").href = data.collect_workflow_url;
    $("collect").hidden = false;
  }

  renderHead();
  skeleton(12);

  // ── 연결 ─────────────────────────────────────────────────────────
  const redraw = () => { state.shown = 100; render(); };

  $("conditions").addEventListener("change", (e) => {
    const box = e.target.closest("input[type=checkbox][data-group]");
    if (!box) return;
    const set = state.picked[box.dataset.group];
    if (box.checked) set.add(box.value); else set.delete(box.value);
    // 부산을 끄면 구·군도 함께 비운다. 안 비우면 안 보이는 조건이 살아
    // 남아, 나중에 부산을 다시 켰을 때 왜 적게 나오는지 알 수 없다.
    if (box.dataset.group === "region") {
      if (!busanOn()) state.gu.clear();
      renderGroups();
    }
    // «우대조건 있음»을 끄면 세부 조건도 비운다. 안 비우면 안 보이는
    // 조건이 살아남아 왜 적게 나오는지 알 수 없다 — 구·군과 같은 이유다.
    if (box.dataset.group === "prefStatus") {
      if (!state.picked.prefStatus.has("present")) state.prefTags.clear();
      renderGroups();
    }
    redraw();
  });
  $("conditions").addEventListener("change", (e) => {
    const box = e.target.closest("input[type=checkbox][data-preftag]");
    if (!box) return;
    const code = box.dataset.preftag;
    if (box.checked) state.prefTags.add(code); else state.prefTags.delete(code);
    redraw();
  });
  // 구·군은 지역 그룹 안에 있어서 같은 컨테이너가 받는다.
  $("conditions").addEventListener("change", (e) => {
    const box = e.target.closest("input[type=checkbox][data-gu]");
    if (!box) return;
    const gu = box.dataset.gu;
    if (box.checked) state.gu.add(gu); else state.gu.delete(gu);
    redraw();
  });
  $("conditions").addEventListener("click", (e) => {
    const clear = e.target.closest("[data-clear]");
    if (!clear) return;
    if (clear.dataset.clear === "asOf") {
      state.dfrom = null;
      state.dto = null;
      renderAsOf();
    } else if (clear.dataset.clear === "gu") {
      state.gu.clear();
      renderGroups();
    } else if (clear.dataset.clear === "prefTags") {
      state.prefTags.clear();
      renderGroups();
    } else {
      state.picked[clear.dataset.clear].clear();
      renderGroups();
    }
    redraw();
  });
  $("rows").addEventListener("click", (e) => {
    const b = e.target.closest("[data-pref]");
    if (!b) return;
    const key = Number(b.dataset.pref);
    if (state.open.has(key)) state.open.delete(key); else state.open.add(key);
    render();
  });
  $("head").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sort]");
    if (!b) return;
    const key = b.dataset.sort;
    // 같은 열을 다시 누르면 방향이 뒤집힌다. 새 열은 금리·기간이면 내림차순,
    // 이름이면 오름차순으로 시작하는 게 기대에 맞는다.
    if (state.sort === key) state.dir = -state.dir;
    else { state.sort = key; state.dir = ["base", "max", "term"].includes(key) ? -1 : 1; }
    redraw();
  });
  $("q").addEventListener("input", (e) => {
    state.q = e.target.value.trim().toLowerCase(); redraw();
  });
  const numberField = (id, key) => $(id).addEventListener("input", (e) => {
    const v = parseFloat(e.target.value);
    state[key] = Number.isFinite(v) ? v : null;
    redraw();
  });
  numberField("rmin", "rmin");
  numberField("tmin", "tmin");
  numberField("tmax", "tmax");
  $("asof-presets").addEventListener("change", (e) => {
    const radio = e.target.closest("input[name=asof]");
    if (!radio) return;
    state.dfrom = radio.dataset.from;
    renderAsOf();
    redraw();
  });
  $("dfrom").addEventListener("change", (e) => {
    state.dfrom = e.target.value || null;
    renderAsOf();
    redraw();
  });
  $("dto").addEventListener("change", (e) => {
    state.dto = e.target.value || null;
    renderAsOf();
    redraw();
  });
  // 금리 기준을 바꾸면 하한 조건과 정렬이 함께 그 열로 옮겨간다. 한쪽만
  // 옮기면 "최고금리 3% 이상"을 걸었는데 기본금리로 정렬되는 일이 생긴다.
  $("basis").addEventListener("change", (e) => {
    const radio = e.target.closest("input[name=basis]");
    if (!radio) return;
    state.basis = radio.value;
    $("rmin-label").textContent =
      state.basis === "max" ? "최고금리 이상 (%)" : "기본금리 이상 (%)";
    if (state.sort === "base" || state.sort === "max") state.sort = state.basis;
    redraw();
  });

  $("more").addEventListener("click", () => { state.shown += 200; render(); });
  $("reset").addEventListener("click", () => {
    GROUPS.forEach((g) => state.picked[g.key].clear());
    Object.assign(state, { q: "", rmin: null, tmin: null, tmax: null,
                           dfrom: null, dto: null, basis: "base",
                           sort: "base", dir: -1, shown: 100, tab: null });
    state.gu.clear();
    state.prefTags.clear();
    state.open.clear();
    ["q", "rmin", "tmin", "tmax", "dfrom", "dto"].forEach((id) => { $(id).value = ""; });
    $("basis").querySelector('input[value="base"]').checked = true;
    $("rmin-label").textContent = "기본금리 이상 (%)";
    renderGroups();
    renderAsOf();
    render();
  });
  $("dl-view").addEventListener("click", () =>
    download(`rate-monitor_filtered_${stamp}.csv`, toCsv(current), "text/csv;charset=utf-8"));
  $("dl-json").addEventListener("click", () =>
    download(`rate-monitor_filtered_${stamp}.json`, toJson(current), "application/json"));

  // ── 금리표 받기 ──────────────────────────────────────────────────
  const expand = (T) => {
    const col = {};
    (T.columns || []).forEach((name, i) => { col[name] = i; });
    const look = (name, idx) => {
      const table = (T.lookups || {})[name];
      return table ? table[idx] : idx;
    };
    // 열 배열 + 조회표를 객체로 한 번만 편다. 조작마다 풀면 느려진다.
    //
    // `_i`는 행의 고유 번호다. 우대조건을 펼칠 때 "어느 행"인지 가리키는데,
    // 필터·정렬이 바뀌어도 같은 행을 가리켜야 하므로 화면 순서가 아니라
    // 원본 순서를 쓴다.
    return (T.rows || []).map((r, _i) => ({
      _i,
      sector: look("sector", r[col.sector]),
      institution: look("institution", r[col.institution]),
      region: look("region", r[col.region]),
      district: look("district", r[col.district]),
      product: look("product", r[col.product]),
      type: look("product_type", r[col.product_type]),
      term: r[col.term_months],
      pay: look("payment_method", r[col.payment_method]),
      method: look("interest_method", r[col.interest_method]),
      channel: look("join_channel", r[col.join_channel]),
      base: r[col.base_rate],
      max: r[col.max_rate],
      scope: look("availability_scope", r[col.availability_scope]),
      source: look("source_id", r[col.source_id]),
      asOf: look("source_effective_at", r[col.source_effective_at]),
      // v4 §10.4로 늘어난 칸. 없는 표(옛 산출물)에서도 죽지 않게 기본값을 둔다.
      outlet: col.outlet == null ? null : look("outlet", r[col.outlet]),
      geo: col.geo_basis == null ? null : look("geo_basis", r[col.geo_basis]),
      rscope: col.rate_scope == null ? null : look("rate_scope", r[col.rate_scope]),
      amountMax: col.amount_max == null ? null : r[col.amount_max],
      pref: col.preference == null ? null : look("preference", r[col.preference]),
      // 우대조건 판정. 옛 산출물에는 없으므로 기본값을 둔다.
      prefStatus: col.preference_status == null
        ? null : look("preference_status", r[col.preference_status]),
      // 공백으로 이은 코드 목록을 집합으로 편다. 빈 문자열은 빈 집합이다.
      prefTags: col.preference_tags == null ? null
        : new Set((look("preference_tags", r[col.preference_tags]) || "")
            .split(" ").filter(Boolean)),
    }));
  };

  fetch(data.table_url || "data/table.json")
    .then((res) => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then((table) => {
      ALL = expand(table);
      if (!ALL.length) {
        failed("금리표에 행이 없습니다.", data.table_url);
        return;
      }
      const dates = ALL.map((r) => r.asOf).filter(Boolean).sort();
      latestAsOf = dates.at(-1) || null;
      PRESETS = latestAsOf
        ? [7, 30, 90, 365].map((d) => ({ days: d, from: shiftDays(latestAsOf, d) }))
        : [];

      const bySector = {};
      ALL.forEach((r) => { bySector[r.sector] = (bySector[r.sector] || 0) + 1; });
      $("sub").textContent = Object.entries(bySector)
        .sort((a, b) => b[1] - a[1])
        .map(([s, n]) => `${SECTOR_KO[s] || s} ${n.toLocaleString("ko-KR")}건`)
        .join(" · ");
      $("stamp").innerHTML +=
        `<br>공시기준일 ${esc(latestAsOf || "—")}`;

      $("dl-view").disabled = false;
      $("dl-json").disabled = false;

      renderGroups();
      renderAsOf();
      render();
    })
    .catch((err) => {
      // 조용히 빈 표를 보여주지 않는다. 데이터가 없는 것과 못 받은 것은
      // 다르고, 보는 사람이 그 차이를 알아야 한다.
      failed("금리표를 불러오지 못했습니다. 새로고침해 보세요.", String(err));
    });

})();
</script>
</body>
</html>
