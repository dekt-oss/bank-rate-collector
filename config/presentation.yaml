# 무엇을 앞에 내세우고 무엇을 참고로 두는가 (v4 §9.1)
#
# 이 파일이 화면의 계약이다. 코드에 업권 목록을 박아 두면 "왜 이 업권이
# 메인인가"가 커밋 로그에만 남는다.
#
# 핵심 구분: 메인 네 업권은 **같은 표에서 순위를 겨룬다.** 참고지표는
# 겨루지 않는다 — 지역 근거도 금리 성격도 달라서 같은 줄에 세우면 비교가
# 아니라 오해가 된다.

# 메인 비교표. 이 목록이 순위에 들어간다.
#
#   savings_bank  저축은행 (1차 원천 FSB)
#   kfcc          새마을금고
#   nh_local      농·축협
#   cu            신협
#   bank          시중은행  ← 2026-08-06 사용자 결정으로 편입 (v4 §6.4 정정)
#
# 시중은행을 넣은 것은 명세서를 뒤집는 결정이다. 근거와 조건은 v4 §6.4의
# 정정 절에 있다. 요약하면: 넣되 **전국 공시 배지를 반드시 함께 보여준다.**
# 시중은행 행은 rate_scope·geo_basis가 nationwide이고 시도가 비어 있어서,
# 배지가 없으면 점포 주소로 얻은 새마을금고 행과 같은 성격으로 읽힌다.
main_sectors:
  - savings_bank
  - kfcc
  - nh_local
  - cu
  - bank

# 지금은 비어 있다. 시중은행이 메인으로 올라갔다.
#
# 목록을 지우지 않고 남겨 두는 이유는, 지역 근거가 다른 업권이 또 생겼을 때
# 갈 자리가 여기이기 때문이다. 빈 목록과 없는 항목은 다르다.
reference_sectors: []

# DB에는 남기되 화면에 안 띄우는 수집원.
#
# finlife 저축은행은 FSB와 같은 상품을 다시 싣는다. 둘 다 메인에 내면
# 같은 상품이 두 줄로 보인다. 교차검증용으로만 쓴다 (v4 §11.1).
# 이 값은 v4 PR 5에서 source_id를 분리한 뒤에 실제로 걸린다.
db_only_sources:
  - finlife_savings_bank

# 상단 참고바. 금융상품이 아니라 지표다 (v4 §7.1).
# 아직 수집기가 없다 (v4 PR 6).
reference_indicators:
  - bok_base_rate
