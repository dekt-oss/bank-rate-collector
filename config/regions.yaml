# 새마을금고 수집 범위.
#
# ── 이 값들은 행정구역이 아니다 ──────────────────────────────────────
#
# `kfcc_r1`은 새마을금고 「금고위치안내」 화면이 쓰는 **지역 구분값**이고,
# 실측해보면 행정구역 시도와 일치하지 않는다 (2026-08-05).
#
#   r1=광주  → 229점포. 주소를 보면 광주 101 / 전남 124 / 전남광주통합특별시 4
#   r1=전남  → 3점포뿐
#
# 즉 사이트의 지역본부 묶음에 가깝다. 이 값을 시도 이름으로 취급해 화면에
# 쓰면 안 된다. **지역 표시는 언제나 점포 주소에서 뽑는다.**
#
# ── 시군구를 적지 않는 이유 ─────────────────────────────────────────
#
# `r2`를 비우면 그 지역 전체가 한 번에 온다 (부산 = 273점포/137금고, 1회 요청).
# 그래서 시군구 목록이 필요 없다. 예전에는 부산 16개 구를 적어두고 16회를
# 돌았는데, 목록을 손으로 관리해야 했고 명세서 v3 §7.3.4-8이 금지한
# "하드코딩 지역목록"이기도 했다.
#
# ── 행정구역 공식 코드 ──────────────────────────────────────────────
#
# 확보하지 못했다. 확인되기 전까지 `sido_code`/`sigungu_code`를 채우지 않는다.
# `validation_service`가 이 칸이 채워지면 실패시킨다.

sido_code: null

# ── 농·축협은 지역 파라미터가 없다 ──────────────────────────────────
#
# `wmall.nonghyup.com/servlet/SFDPW0161R.view`는 전국 4,871행을 한 번에
# 준다. 지역으로 조를 수 있는 요청 인자를 원천이 주지 않는다 (정찰
# `docs/source-recon/nh-local.md` §0.2). 그래서 범위는 **받아 온 명부의
# 주소로** 거른다. 아래 `nh_local_address_prefixes`가 그 접두어다.
#
# `null`은 "거르지 않는다"는 뜻이다. 빈 목록과 다르다 — 빈 목록은 아무
# 점포도 안 남는다.
#
# 접두어에 "부산 "처럼 뒤에 공백을 둔 것은 "부산진구"가 아니라 "부산"으로
# 시작하는 주소만 잡기 위해서다.

# 수집 범위. 이름은 사람이 고르기 위한 것이고, 실제 요청에는 `kfcc_r1`이 간다.
scopes:
  - name: 전국
    kfcc_r1:
      [서울, 부산, 대구, 인천, 광주, 대전, 울산, 세종,
       경기, 강원, 충북, 충남, 전북, 전남, 경북, 경남, 제주]
    nh_local_address_prefixes: null
  - name: 부산
    kfcc_r1: [부산]
    nh_local_address_prefixes: ["부산광역시", "부산 "]
  - name: 수도권
    kfcc_r1: [서울, 경기, 인천]
    nh_local_address_prefixes: ["서울특별시", "서울 ", "경기도", "인천광역시"]

# 기본 수집 범위. 워크플로우가 이 이름을 쓴다.
default_scope: 전국

# 농·축협만 기본 범위가 다르다.
#
# 이 원천은 점포마다 화면을 따로 받아야 하고 요청 간격이 1초다.
#
#   부산 119점포 × 2화면 =   239회 ≈ 4분
#   전국 4,871점포 × 2화면 = 9,743회 ≈ 2시간 43분
#
# 전국은 GitHub Actions 작업 하나에 담기 어렵고, 원천에 주는 부담도 아직
# 재 본 적이 없다. 그래서 부산부터 돌린다 (v4 §5.3의 세로절단). 전국으로
# 넓히는 것은 `--scope 전국`을 사람이 명시할 때만이다.
# 2026-08-07에 부산에서 전국으로 넓혔다.
#
# 부산만 받는 동안 화면이 거짓 인상을 줬다. 농·축협 4,920행 대 새마을금고
# 93,816행이라 "새마을금고가 압도적으로 많다"로 읽혔는데, 실제 점포는
# 농·축협 4,871곳이 새마을금고 3,135곳보다 많다. 적게 보인 이유는 우리가
# 부산 120곳만 받았기 때문이다.
#
# 전국은 실측 기준 3시간 37분이다 (run 23에서 부산 120점포 5분 20초 =
# 점포당 2.67초 × 4,871점포). 그래서 새마을금고를 같은 실행에서 뺐다 —
# 둘을 한 작업에 넣으면 6시간 3분이라 GitHub의 작업당 6시간 한도를 넘는다.
nh_local_default_scope: 전국

