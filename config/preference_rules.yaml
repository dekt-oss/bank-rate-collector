# 우대조건 원문을 표준 분류로 옮기는 규칙 (우대조건 명세서 v1 §5)
#
# ── 왜 코드가 아니라 여기에 두는가 ──────────────────────────────────
#
# 분류는 판단이다. "비대면 기한부예금 가입실적"이 비대면 조건인지 상품보유
# 조건인지는 데이터로 답할 수 없고 사람이 정해야 한다. 그 판단을 파이썬에
# 박아 두면 고칠 때마다 코드 리뷰가 필요하고, 왜 그렇게 정했는지가 커밋
# 로그에만 남는다. 파일로 두면 **고친 사람과 이유가 PR에 남는다.**
#
# ── 실측 (2026-08-06 발행 DB, 관측 150,311건) ──────────────────────
#
#   원천 미제공  109,149  72.6%   원문 자체가 없다
#   명시적 없음   30,957  20.6%   원문이 "없음"·"해당사항없음"이라고 말한다
#   있음          10,205   6.8%   조건이 적혀 있다
#
# 셋을 반드시 구별한다. "원천 미제공"을 "없음"으로 적으면 우대금리가 없는
# 상품처럼 보인다 (명세서 §3, v4 §3.3).
#
# ── 한 조건이 여러 분류에 들 수 있다 ───────────────────────────────
#
# "비대면 기한부예금 가입실적"은 비대면이면서 상품보유다. 하나로 우겨넣지
# 않는다 — 사람이 «비대면»으로 찾든 «상품보유»로 찾든 나와야 한다.
#
# ── 순서가 곧 우선순위가 아니다 ────────────────────────────────────
#
# 아래 분류를 전부 훑어 걸리는 것을 모두 붙인다. 하나도 안 걸리면 OTHER다.
# OTHER가 늘면 그건 규칙이 뒤처졌다는 뜻이지 조건이 특이한 것이 아니다.

# 화면 표시명은 명세서 §5의 대분류를 그대로 쓴다.
categories:
  CARD_USAGE:
    label: 카드 이용
    keywords: [체크카드, 신용카드, 카드결제, 카드 결제, 카드사용, 카드 사용, 카드실적]

  AUTO_PAYMENT:
    label: 자동이체·자동납부
    keywords: [자동이체, 자동납부, 자동송금, 공과금]

  DIGITAL_CHANNEL:
    label: 비대면·가입채널
    keywords: [비대면, 인터넷뱅킹, 인터넷 뱅킹, 모바일, 스마트폰, 전자금융,
               온라인, 앱 가입, 창구전용, 영업점 방문]

  INCOME_TRANSFER:
    label: 급여·연금 수령
    keywords: [급여이체, 급여 이체, 급여실적, 연금이체, 연금 수령, 급여 수령, 월급]

  MEMBERSHIP:
    label: 회원·조합원
    keywords: [조합원, 출자금, 출자 좌수, 우수고객, 회원 가입]

  PRODUCT_HOLDING:
    label: 계좌·상품 보유
    keywords: [가입실적, 가입 실적, 보유, 공제, 예탁금 실적, 대출 실적, 적립식 실적]

  PAYMENT_PERFORMANCE:
    label: 납입 실적
    keywords: [납입실적, 납입 실적, 납입횟수, 납입 횟수, 미납, 납입금액]

  NEW_CUSTOMER:
    label: 신규·첫 거래
    keywords: [신규, 첫거래, 첫 거래, 최초 거래, 신규고객, 예금 미보유]

  AGE_LIFE_STAGE:
    label: 연령·생애 조건
    keywords: [가입연령, 만 60세, 만60세, 청년, 아동, 어린이, 고령, 생계형,
               출산, 결혼, 다자녀]

  REGION_AFFILIATION:
    label: 지역·소속
    keywords: [지역주민, 관내, 직장, 학교, 단체, 소속]

  CONSENT_SERVICE:
    label: 동의·전자서비스
    keywords: [마케팅, 광고성, SMS, 알림, 오픈뱅킹, 정보 제공 동의]

  MAINTENANCE:
    label: 만기·유지
    keywords: [만기 유지, 재예치, 자동 재예치, 중도해지, 장기가입, 계속 거래]

  CONTRACT_CONDITION:
    label: 가입금액·기간
    keywords: [만원 이상, 억원 이상, 최소가입, 최소 가입, 가입금액, 계약기간]

  EVENT_REFERRAL:
    label: 이벤트·추천
    keywords: [추천인, 추천, 쿠폰, 이벤트, 프로모션]

# 원문이 이 말만 하고 있으면 "명시적 없음"이다. 원천이 스스로 없다고 말한
# 것이므로 "미제공"과 구별해 저장한다.
explicit_none:
  - 없음
  - 없음.
  - 해당사항없음
  - 해당사항 없음
  - 해당없음
  - 해당 없음
  - "-"
  - "--"
