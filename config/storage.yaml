# 운영 상태 DB를 어디에 두는가 (선행 수정안 v1 §2.3)
#
# 이 값을 바꾸는 것이 곧 전환이다. 파일로 두는 이유는 전환이 커밋으로
# 남아야 하기 때문이다 — 언제·누가·왜 바꿨는지가 이력에 박힌다.
#
# 급할 때는 환경변수 STORAGE_BACKEND가 이 값을 이긴다. 그 경우 실행 로그에
# 어느 쪽이 먹혔는지 적힌다.
#
#   github_legacy   R2를 쓰지 않는다. 지금 그대로.
#                   rate-data/latest/rate_monitor.sqlite3.gz가 공식 원본.
#
#   r2_migration    R2에 올리고 다시 받아 검증까지 한다. 그러나 복원은
#                   여전히 GitHub에서 하고, rate-data의 DB도 그대로 둔다.
#                   R2는 시험 저장소이므로 여기서 R2가 실패해도 수집은
#                   계속된다 — 실패를 크게 적을 뿐이다.
#
#   r2              R2가 공식 원본. 복원도 R2에서 한다. 실패하면 멈춘다.
#                   GitHub에는 SQLite를 두지 않는다.
#
# 전환 절차는 docs/roadmap.md §4.2에 있다. 요약하면:
#   시크릿 등록 → storage migrate → storage verify → 여기를 r2_migration으로
#   → 한 바퀴 관찰 → 여기를 r2로
# 2026-08-06: github_legacy → r2_migration.
#
# 근거는 run 31071740056이다 (Storage check (R2), 14단계 전부 success).
# 실제 버킷에 2 KB 왕복이 되고, 275,714,048 bytes DB가 20.4초에 올라가
# 4.4초에 되돌아왔으며, 되받은 파일이 원본과 바이트 단위로 같았다
# (`cmp -s` → 완전히 동일). integrity_check ok, foreign_key_check 0건,
# rate_observations 177,903행이 그대로였다.
#
# 2026-08-08: r2_migration → r2.
#
# **고른 것이 아니라 밀린 것이다.** 농·축협을 전국으로 넓힌 첫 수집
# (run 31232386844)에서 DB가 787,353,600 bytes로 커졌고, 압축본이
# 146,919,500 bytes(142.66 MiB)가 됐다. GitHub은 개별 파일 100 MB를
# 넘으면 push를 거부하므로, r2_migration으로는 발행 자체가 불가능하다.
# 그 실행은 수집·검증·화면 생성까지 다 하고 크기 게이트에서 멈췄다.
#
# 같은 실행에서 R2 쪽은 정상이었다. 올린 뒤 다시 받아 해시·무결성·행 수까지
# 대조해 통과했다 (state/snapshots/20260808T140442-e3363860.sqlite3.gz).
# r2_migration으로 돈 실제 수집은 run 23과 run 34 두 바퀴다.
#
# 이제 복원이 R2에서 온다. R2가 죽으면 빈 DB로 시작하는 대신 **멈춘다**
# (선행 수정안 §6.4). 되돌리려면 저장소 Variables의 STORAGE_BACKEND가
# 이 파일을 이기므로 커밋 없이 github_legacy로 돌아갈 수 있다 — 다만
# rate-data의 DB는 마지막 r2_migration 실행이 남긴 것이라, 그 뒤 수집분은
# `storage restore`로 받아야 한다.
backend: r2
